<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="520" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">OSI 七层模型与 TCP/IP 五层模型</text>

  <rect x="40" y="60" width="120" height="35" rx="6" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="100" y="82" font-size="10" text-anchor="middle" fill="#c53030" font-weight="bold">应用层</text>
  <rect x="180" y="60" width="120" height="35" rx="6" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="240" y="82" font-size="10" text-anchor="middle" fill="#b7791f" font-weight="bold">表示层</text>
  <rect x="320" y="60" width="120" height="35" rx="6" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="380" y="82" font-size="10" text-anchor="middle" fill="#805ad5" font-weight="bold">会话层</text>
  <rect x="460" y="60" width="120" height="35" rx="6" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="520" y="82" font-size="10" text-anchor="middle" fill="#38a169" font-weight="bold">传输层</text>
  <rect x="600" y="60" width="120" height="35" rx="6" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="660" y="82" font-size="10" text-anchor="middle" fill="#3182ce" font-weight="bold">网络层</text>
  <rect x="740" y="60" width="120" height="35" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="800" y="82" font-size="10" text-anchor="middle" fill="#276749" font-weight="bold">数据链路层</text>
  <rect x="880" y="60" width="80" height="35" rx="6" fill="#faf5ff" stroke="#805ad5" stroke-width="2"/>
  <text x="920" y="82" font-size="10" text-anchor="middle" fill="#44337a" font-weight="bold">物理层</text>

  <text x="320" y="115" font-size="11" text-anchor="middle" fill="#744210" font-weight="bold">OSI 七层模型</text>

  <line x1="40" y1="130" x2="960" y2="130" stroke="#a0aec0" stroke-width="1" stroke-dasharray="5,5"/>

  <rect x="100" y="150" width="160" height="35" rx="6" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="180" y="172" font-size="10" text-anchor="middle" fill="#c53030" font-weight="bold">应用层</text>
  <rect x="300" y="150" width="160" height="35" rx="6" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="380" y="172" font-size="10" text-anchor="middle" fill="#38a169" font-weight="bold">传输层</text>
  <rect x="500" y="150" width="160" height="35" rx="6" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="580" y="172" font-size="10" text-anchor="middle" fill="#3182ce" font-weight="bold">网络层</text>
  <rect x="700" y="150" width="160" height="35" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="780" y="172" font-size="10" text-anchor="middle" fill="#276749" font-weight="bold">链路层</text>
  <rect x="900" y="150" width="60" height="35" rx="6" fill="#faf5ff" stroke="#805ad5" stroke-width="2"/>
  <text x="930" y="172" font-size="10" text-anchor="middle" fill="#44337a" font-weight="bold">物理</text>

  <text x="320" y="205" font-size="11" text-anchor="middle" fill="#2a4365" font-weight="bold">TCP/IP 五层模型</text>

  <line x1="40" y1="220" x2="960" y2="220" stroke="#a0aec0" stroke-width="1" stroke-dasharray="5,5"/>

  <rect x="40" y="240" width="460" height="250" rx="12" fill="#ebf8ff" stroke="#4299e1" stroke-width="2"/>
  <text x="270" y="265" font-size="12" font-weight="bold" text-anchor="middle" fill="#2b6cb0">各层协议与功能</text>

  <text x="70" y="292" font-size="10" font-weight="bold" fill="#c53030">应用层：</text>
  <text x="70" y="310" font-size="9" fill="#2d3748">HTTP/HTTPS · DNS · FTP · SMTP · SSH · Telnet</text>
  <text x="70" y="328" font-size="9" fill="#2d3748">功能：应用接口 · 数据格式定义</text>

  <text x="70" y="352" font-size="10" font-weight="bold" fill="#805ad5">表示层：</text>
  <text x="70" y="370" font-size="9" fill="#2d3748">数据加密/解密 · 压缩/解压缩 · 编码转换</text>

  <text x="70" y="394" font-size="10" font-weight="bold" fill="#3182ce">会话层：</text>
  <text x="70" y="412" font-size="9" fill="#2d3748">建立/维护/终止会话 · RPC 调用</text>

  <text x="70" y="436" font-size="10" font-weight="bold" fill="#38a169">传输层：</text>
  <text x="70" y="454" font-size="9" fill="#2d3748">TCP（可靠/面向连接）· UDP（不可靠/无连接）</text>
  <text x="70" y="472" font-size="9" fill="#2d3748">端口号 · 流量控制 · 拥塞控制</text>

  <text x="70" y="488" font-size="10" font-weight="bold" fill="#276749">网络层：</text>
  <text x="70" y="493" font-size="9" fill="#2d3748">IP · ICMP · ARP · 路由选择 · 数据包转发</text>

  <rect x="520" y="240" width="440" height="250" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="265" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">渗透测试相关层</text>

  <text x="550" y="292" font-size="10" font-weight="bold" fill="#c53030">应用层（最多漏洞）：</text>
  <text x="550" y="310" font-size="9" fill="#2d3748">SQL注入 / XSS / RCE / 文件上传</text>
  <text x="550" y="328" font-size="9" fill="#2d3748">CSRF / SSRF / 反序列化 / 越权</text>

  <text x="550" y="352" font-size="10" font-weight="bold" fill="#3182ce">传输层：</text>
  <text x="550" y="370" font-size="9" fill="#2d3748">端口扫描 / 中间人攻击（MITM）</text>
  <text x="550" y="388" font-size="9" fill="#2d3748">TLS 握手漏洞 / 端口转发</text>

  <text x="550" y="412" font-size="10" font-weight="bold" fill="#276749">网络层：</text>
  <text x="550" y="430" font-size="9" fill="#2d3748">ARP 欺骗 / IP 伪造 / DNS 投毒</text>
  <text x="550" y="448" font-size="9" fill="#2d3748">Ping 扫描 / traceroute / 路由攻击</text>

  <text x="550" y="472" font-size="10" font-weight="bold" fill="#44337a">物理层：</text>
  <text x="550" y="490" font-size="9" fill="#2d3748">网线窃听 / 设备物理破坏</text>
</svg>
