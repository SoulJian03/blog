<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="420" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">护网 / 重保 工作流程</text>

  <rect x="30" y="70" width="160" height="60" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="110" y="100" font-size="12" text-anchor="middle" fill="#744210" font-weight="bold">赛前准备</text>
  <text x="110" y="118" font-size="9" text-anchor="middle" fill="#744210">资产梳理/加固/培训</text>

  <line x1="190" y1="100" x2="225" y2="100" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="230" y="70" width="160" height="60" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="310" y="100" font-size="12" text-anchor="middle" fill="#44337a" font-weight="bold">赛前防守</text>
  <text x="310" y="118" font-size="9" text-anchor="middle" fill="#44337a">WAF规则/蜜罐/监控</text>

  <line x1="390" y1="100" x2="425" y2="100" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="430" y="70" width="160" height="60" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="510" y="100" font-size="12" text-anchor="middle" fill="#c53030" font-weight="bold">实战对抗</text>
  <text x="510" y="118" font-size="9" text-anchor="middle" fill="#c53030">蓝队防守/红队攻击</text>

  <line x1="590" y1="100" x2="625" y2="100" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="630" y="70" width="160" height="60" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="710" y="100" font-size="12" text-anchor="middle" fill="#22543d" font-weight="bold">溯源反制</text>
  <text x="710" y="118" font-size="9" text-anchor="middle" fill="#22543d">溯源/封堵/反制</text>

  <line x1="790" y1="100" x2="825" y2="100" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="830" y="70" width="140" height="60" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="900" y="100" font-size="12" text-anchor="middle" fill="#2a4365" font-weight="bold">赛后总结</text>
  <text x="900" y="118" font-size="9" text-anchor="middle" fill="#2a4365">报告/加固/复盘</text>

  <rect x="30" y="160" width="280" height="220" rx="12" fill="#ebf8ff" stroke="#4299e1" stroke-width="2"/>
  <text x="170" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#2b6cb0">赛前准备要点</text>
  <text x="60" y="215" font-size="10" fill="#2d3748">• 资产清点(域名/IP/端口)</text>
  <text x="60" y="240" font-size="10" fill="#2d3748">• 漏洞修复+弱口令清理</text>
  <text x="60" y="265" font-size="10" fill="#2d3748">• WAF 规则升级</text>
  <text x="60" y="290" font-size="10" fill="#2d3748">• 部署蜜罐(诱饵账号)</text>
  <text x="60" y="315" font-size="10" fill="#2d3748">• 日志采集+监控</text>
  <text x="60" y="340" font-size="10" fill="#2d3748">• 应急预案+人员分工</text>
  <text x="60" y="365" font-size="10" fill="#2d3748">• 备份+回滚方案</text>

  <rect x="360" y="160" width="300" height="220" rx="12" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
  <text x="510" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#7b341e">重保 7×24 值守</text>
  <text x="390" y="215" font-size="10" fill="#2d3748">• 监控大屏(Web/API/流量)</text>
  <text x="390" y="240" font-size="10" fill="#2d3748">• 告警分级+15min 响应</text>
  <text x="390" y="265" font-size="10" fill="#2d3748">• 异常 IP 自动封禁</text>
  <text x="390" y="290" font-size="10" fill="#2d3748">• 定时巡检(进程/文件/计划)</text>
  <text x="390" y="315" font-size="10" fill="#2d3748">• 值守交接班记录</text>
  <text x="390" y="340" font-size="10" fill="#2d3748">• 事件升级+通报机制</text>

  <rect x="690" y="160" width="280" height="220" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="830" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">溯源反制技巧</text>
  <text x="720" y="215" font-size="10" fill="#2d3748">• 蜜罐诱捕(假 API/假后台)</text>
  <text x="720" y="240" font-size="10" fill="#2d3748">• 抓包分析攻击工具</text>
  <text x="720" y="265" font-size="10" fill="#2d3748">• 溯源攻击者 IP/UA/BOT</text>
  <text x="720" y="290" font-size="10" fill="#2d3748">• 反向渗透(C2/扫描器)</text>
  <text x="720" y="315" font-size="10" fill="#2d3748">• 上报监管+协同处置</text>
  <text x="720" y="340" font-size="10" fill="#2d3748">• 输出完整攻击时间线</text>
</svg>
