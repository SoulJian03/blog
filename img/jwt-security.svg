<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">JWT 安全边界与攻击方法</text>

  <rect x="40" y="70" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="102" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① 伪造签名</text>

  <rect x="200" y="70" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="270" y="102" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② 算法降级</text>

  <rect x="360" y="70" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="430" y="102" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 密钥泄露</text>

  <rect x="520" y="70" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="590" y="102" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 篡改 Claim</text>

  <rect x="680" y="70" width="140" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="750" y="102" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ 无签名</text>

  <rect x="840" y="70" width="120" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="900" y="102" font-size="11" text-anchor="middle" fill="#276749" font-weight="bold">⑥ 过期</text>

  <rect x="40" y="150" width="460" height="300" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">JWT 攻击方法</text>

  <text x="70" y="205" font-size="10" font-weight="bold" fill="#c53030">算法降级：</text>
  <text x="70" y="225" font-size="9" fill="#2d3748">RS256 → HS256（公开公钥当密钥）</text>
  <text x="70" y="245" font-size="9" fill="#2d3748">工具：jwt_tool · jwtcrack</text>

  <text x="70" y="275" font-size="10" font-weight="bold" fill="#805ad5">密钥暴力：</text>
  <text x="70" y="295" font-size="9" fill="#2d3748">短密钥（&lt;16位）可暴力破解</text>
  <text x="70" y="315" font-size="9" fill="#2d3748">jwt_tool --crack</text>

  <text x="70" y="345" font-size="10" font-weight="bold" fill="#dd6b20">篡改 Claim：</text>
  <text x="70" y="365" font-size="9" fill="#2d3748">修改 payload 中 role/exp</text>
  <text x="70" y="385" font-size="9" fill="#2d3748">需有签名密钥才能成功</text>

  <text x="70" y="415" font-size="10" font-weight="bold" fill="#3182ce">无签名：</text>
  <text x="70" y="435" font-size="9" fill="#2d3748">alg=none → 服务器不验证签名</text>
  <text x="70" y="455" font-size="9" fill="#2d3748">某些库默认接受</text>

  <rect x="520" y="150" width="440" height="300" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">防御方法</text>

  <text x="550" y="205" font-size="10" font-weight="bold" fill="#c53030">强制算法：</text>
  <text x="550" y="225" font-size="9" fill="#2d3748">服务端硬编码允许算法（RS256）</text>
  <text x="550" y="245" font-size="9" fill="#2d3748">拒绝 alg=none 和 HS256</text>

  <text x="550" y="275" font-size="10" font-weight="bold" fill="#805ad5">强密钥：</text>
  <text x="550" y="295" font-size="9" fill="#2d3748">密钥长度 ≥ 256 bit</text>
  <text x="550" y="315" font-size="9" fill="#2d3748">使用非对称密钥（RSA）</text>

  <text x="550" y="345" font-size="10" font-weight="bold" fill="#dd6b20">过期时间：</text>
  <text x="550" y="365" font-size="9" fill="#2d3748">设置合理的 exp（access_token 15min）</text>
  <text x="550" y="385" font-size="9" fill="#2d3748">配合 refresh_token 刷新</text>

  <text x="550" y="415" font-size="10" font-weight="bold" fill="#3182ce">安全存储：</text>
  <text x="550" y="435" font-size="9" fill="#2d3748">HTTPS 传输 · HttpOnly Cookie</text>
  <text x="550" y="455" font-size="9" fill="#2d3748">不存储在 localStorage</text>
</svg>
