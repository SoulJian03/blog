<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="430" fill="#f8fafc" rx="10"/>
  <text x="20" y="34" font-size="20" font-weight="bold" fill="#111">堡垒机：统一入口 + 全程审计</text>

  <!-- 运维人员 -->
  <rect x="30" y="150" width="180" height="120" rx="10" fill="#fee2e2" stroke="#333" stroke-width="2"/>
  <text x="120" y="200" font-size="17" text-anchor="middle" fill="#111">运维人员</text>
  <text x="120" y="226" font-size="13" text-anchor="middle" fill="#666">SSH / RDP / 数据库</text>
  <text x="120" y="248" font-size="13" text-anchor="middle" fill="#666">工单申请 → 审批</text>

  <!-- 堡垒机 -->
  <rect x="330" y="130" width="220" height="160" rx="10" fill="#dbeafe" stroke="#333" stroke-width="3"/>
  <text x="440" y="180" font-size="20" text-anchor="middle" fill="#111" font-weight="bold">堡垒机</text>
  <text x="440" y="210" font-size="14" text-anchor="middle" fill="#333">统一认证 + 托管账号</text>
  <text x="440" y="232" font-size="14" text-anchor="middle" fill="#333">权限控制（最小授权）</text>
  <text x="440" y="254" font-size="14" text-anchor="middle" fill="#333">全程录像 / 命令审计</text>
  <text x="440" y="280" font-size="13" text-anchor="middle" fill="#b91c1c">4A：认证·授权·账号·审计</text>

  <!-- 服务器群 -->
  <rect x="670" y="60" width="200" height="110" rx="10" fill="#dcfce7" stroke="#333" stroke-width="2"/>
  <text x="770" y="105" font-size="16" text-anchor="middle" fill="#111">Web / 应用服务器</text>
  <text x="770" y="130" font-size="13" text-anchor="middle" fill="#666">等目标资产</text>
  <rect x="670" y="230" width="200" height="110" rx="10" fill="#dcfce7" stroke="#333" stroke-width="2"/>
  <text x="770" y="275" font-size="16" text-anchor="middle" fill="#111">数据库 / 网络设备</text>
  <text x="770" y="300" font-size="13" text-anchor="middle" fill="#666">等目标资产</text>

  <!-- arrows -->
  <line x1="210" y1="210" x2="325" y2="210" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="550" y1="175" x2="665" y2="120" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="550" y1="245" x2="665" y2="285" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <text x="268" y="192" font-size="13" fill="#666" text-anchor="middle">只能走堡垒机</text>

  <!-- 攻击者被阻断 -->
  <rect x="330" y="360" width="380" height="44" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="520" y="388" font-size="14" text-anchor="middle" fill="#b91c1c">攻击者直接访问服务器 → 被堡垒机策略阻断</text>

  <line x1="120" y1="360" x2="330" y2="382" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="20" y="420" font-size="13" fill="#666">要点：账号密码由堡垒机托管，人员不直接接触真实口令，操作全程可回放</text>
</svg>
