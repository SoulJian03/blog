<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="460" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c53030"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">OWASP 十大漏洞与修复优先级</text>

  <rect x="40" y="60" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="92" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">SQL注入</text>

  <line x1="180" y1="85" x2="215" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="220" y="60" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="290" y="92" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">XSS</text>

  <line x1="360" y1="85" x2="395" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="400" y="60" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="470" y="92" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">文件上传</text>

  <line x1="540" y1="85" x2="575" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="580" y="60" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="650" y="92" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">SSRF</text>

  <line x1="720" y1="85" x2="755" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="760" y="60" width="200" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="860" y="92" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">SSRF打内网/云元数据</text>

  <rect x="40" y="140" width="450" height="280" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="265" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">危害等级与修复优先级</text>

  <rect x="70" y="185" width="170" height="130" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.5"/>
  <text x="155" y="208" font-size="10" text-anchor="middle" fill="#c53030" font-weight="bold">P0：立即修复</text>
  <text x="95" y="233" font-size="9" fill="#2d3748">SQL注入</text>
  <text x="95" y="253" font-size="9" fill="#2d3748">命令注入</text>
  <text x="95" y="273" font-size="9" fill="#2d3748">反序列化</text>
  <text x="95" y="293" font-size="9" fill="#2d3748">文件上传→Getshell</text>
  <text x="95" y="310" font-size="9" fill="#2d3748">RCE 漏洞</text>

  <rect x="260" y="185" width="200" height="130" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="1.5"/>
  <text x="360" y="208" font-size="10" text-anchor="middle" fill="#b7791f" font-weight="bold">P1：本周修复</text>
  <text x="285" y="233" font-size="9" fill="#2d3748">存储型 XSS</text>
  <text x="285" y="253" font-size="9" fill="#2d3748">越权访问（IDOR）</text>
  <text x="285" y="273" font-size="9" fill="#2d3748">弱口令/无MFA</text>
  <text x="285" y="293" font-size="9" fill="#2d3748">SSRF</text>
  <text x="285" y="310" font-size="9" fill="#2d3748">未授权访问</text>

  <rect x="70" y="335" width="170" height="70" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="1.5"/>
  <text x="155" y="358" font-size="10" text-anchor="middle" fill="#805ad5" font-weight="bold">P2：本月修复</text>
  <text x="95" y="383" font-size="9" fill="#2d3748">CORS/CSRF/信息泄露</text>
  <text x="95" y="403" font-size="9" fill="#2d3748">反射型 XSS</text>

  <rect x="260" y="335" width="200" height="70" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5"/>
  <text x="360" y="358" font-size="10" text-anchor="middle" fill="#38a169" font-weight="bold">P3：持续改进</text>
  <text x="285" y="383" font-size="9" fill="#2d3748">日志监控/审计</text>
  <text x="285" y="403" font-size="9" fill="#2d3748">组件升级/配置加固</text>

  <rect x="510" y="140" width="460" height="280" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">渗透测试检查清单</text>

  <text x="540" y="195" font-size="10" font-weight="bold" fill="#c53030">Web 层：</text>
  <text x="540" y="215" font-size="9" fill="#2d3748">□ SQL 注入 / XSS / CSRF</text>
  <text x="540" y="235" font-size="9" fill="#2d3748">□ 文件上传 / 文件包含</text>
  <text x="540" y="255" font-size="9" fill="#2d3748">□ SSRF / 越权 / IDOR</text>

  <text x="540" y="280" font-size="10" font-weight="bold" fill="#805ad5">应用层：</text>
  <text x="540" y="300" font-size="9" fill="#2d3748">□ 反序列化 / RCE</text>
  <text x="540" y="320" font-size="9" fill="#2d3748">□ 命令注入 / SSTI</text>
  <text x="540" y="340" font-size="9" fill="#2d3748">□ 认证/授权绕过</text>

  <text x="540" y="365" font-size="10" font-weight="bold" fill="#dd6b20">基础设施：</text>
  <text x="540" y="385" font-size="9" fill="#2d3748">□ 默认口令 / 调试端口</text>
  <text x="540" y="405" font-size="9" fill="#2d3748">□ 信息泄露 / 版本号</text>
  <text x="540" y="420" font-size="9" fill="#2d3748">□ 弱加密 / 明文传输</text>
</svg>
