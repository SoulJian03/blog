<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">CORS 跨域资源共享配置错误</text>

  <rect x="40" y="70" width="200" height="60" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="140" y="102" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">正常 CORS</text>
  <text x="140" y="120" font-size="9" text-anchor="middle" fill="#c53030">指定可信域名</text>

  <rect x="260" y="70" width="200" height="60" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="360" y="102" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">配置错误</text>
  <text x="360" y="120" font-size="9" text-anchor="middle" fill="#b7791f">Access-Control-Allow</text>

  <rect x="480" y="70" width="200" height="60" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="580" y="102" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">凭证泄露</text>
  <text x="580" y="120" font-size="9" text-anchor="middle" fill="#805ad5">Cookie + CORS</text>

  <rect x="700" y="70" width="200" height="60" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="800" y="102" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">SSRF 联动</text>
  <text x="800" y="120" font-size="9" text-anchor="middle" fill="#38a169">CORS + 内网扫描</text>

  <rect x="40" y="155" width="460" height="300" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">CORS 常见配置错误</text>

  <text x="70" y="210" font-size="10" font-weight="bold" fill="#c53030">Allow-Origin: *：</text>
  <text x="70" y="230" font-size="9" fill="#2d3748">任意域名可跨域访问</text>
  <text x="70" y="250" font-size="9" fill="#2d3748">+ Allow-Credentials: true 更危险</text>

  <text x="70" y="280" font-size="10" font-weight="bold" fill="#805ad5">反射 Origin：</text>
  <text x="70" y="300" font-size="9" fill="#2d3748">服务器直接返回请求中的 Origin</text>
  <text x="70" y="320" font-size="9" fill="#2d3748">不校验 Origin 是否可信</text>

  <text x="70" y="350" font-size="10" font-weight="bold" fill="#dd6b20">攻击方式：</text>
  <text x="70" y="370" font-size="9" fill="#2d3748">构造恶意页面 → 携带 Cookie 请求</text>
  <text x="70" y="390" font-size="9" fill="#2d3748">读取响应内容（含敏感数据）</text>

  <text x="70" y="420" font-size="10" font-weight="bold" fill="#3182ce">验证：</text>
  <text x="70" y="440" font-size="9" fill="#2d3748">curl -H "Origin: http://evil.com"</text>
  <text x="70" y="460" font-size="9" fill="#2d3748">查看返回头中的 Access-Control-Allow</text>

  <rect x="520" y="155" width="440" height="300" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">防御方法</text>

  <text x="550" y="210" font-size="10" font-weight="bold" fill="#c53030">白名单：</text>
  <text x="550" y="230" font-size="9" fill="#2d3748">只允许可信域名列表</text>
  <text x="550" y="250" font-size="9" fill="#2d3748">禁止使用 * + Credentials</text>

  <text x="550" y="280" font-size="10" font-weight="bold" fill="#805ad5">凭证保护：</text>
  <text x="550" y="300" font-size="9" fill="#2d3748">SameSite=Strict Cookie</text>
  <text x="550" y="320" font-size="9" fill="#2d3748">敏感操作要求 CSRF Token</text>

  <text x="550" y="350" font-size="10" font-weight="bold" fill="#dd6b20">API 安全：</text>
  <text x="550" y="370" font-size="9" fill="#2d3748">敏感 API 要求 HTTPS</text>
  <text x="550" y="390" font-size="9" fill="#2d3748">API Key / Token 认证</text>

  <text x="550" y="420" font-size="10" font-weight="bold" fill="#3182ce">监控：</text>
  <text x="550" y="440" font-size="9" fill="#2d3748">记录 Origin 请求日志</text>
  <text x="550" y="460" font-size="9" fill="#2d3748">异常 Origin 告警</text>
</svg>
