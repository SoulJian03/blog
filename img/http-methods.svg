<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="500" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">HTTP 请求方法对比</text>

  <rect x="40" y="60" width="140" height="55" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="110" y="92" font-size="12" text-anchor="middle" fill="#2a4365" font-weight="bold">GET</text>
  <text x="110" y="108" font-size="9" text-anchor="middle" fill="#2a4365">幂等/安全</text>

  <rect x="200" y="60" width="140" height="55" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="270" y="92" font-size="12" text-anchor="middle" fill="#22543d" font-weight="bold">POST</text>
  <text x="270" y="108" font-size="9" text-anchor="middle" fill="#22543d">非幂等</text>

  <rect x="360" y="60" width="140" height="55" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="430" y="92" font-size="12" text-anchor="middle" fill="#b7791f" font-weight="bold">PUT</text>
  <text x="430" y="108" font-size="9" text-anchor="middle" fill="#b7791f">幂等</text>

  <rect x="520" y="60" width="140" height="55" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="590" y="92" font-size="12" text-anchor="middle" fill="#805ad5" font-weight="bold">PATCH</text>
  <text x="590" y="108" font-size="9" text-anchor="middle" fill="#805ad5">部分更新</text>

  <rect x="680" y="60" width="140" height="55" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="750" y="92" font-size="12" text-anchor="middle" fill="#c53030" font-weight="bold">DELETE</text>
  <text x="750" y="108" font-size="9" text-anchor="middle" fill="#c53030">幂等</text>

  <rect x="840" y="60" width="120" height="55" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="900" y="92" font-size="12" text-anchor="middle" fill="#276749" font-weight="bold">HEAD/OPTIONS</text>

  <rect x="40" y="140" width="460" height="330" rx="12" fill="#ebf8ff" stroke="#4299e1" stroke-width="2"/>
  <text x="270" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#2b6cb0">各方法详细对比</text>

  <text x="70" y="195" font-size="10" font-weight="bold" fill="#3182ce">GET：</text>
  <text x="70" y="213" font-size="9" fill="#2d3748">用途：获取资源  参数：URL  长度：有限(2KB)</text>
  <text x="70" y="231" font-size="9" fill="#2d3748">缓存：可缓存  日志：参数在 URL 中暴露</text>
  <text x="70" y="252" font-size="9" font-weight="bold" fill="#c53030">风险：敏感参数泄露（Referer/日志）</text>

  <text x="70" y="278" font-size="10" font-weight="bold" fill="#38a169">POST：</text>
  <text x="70" y="296" font-size="9" fill="#2d3748">用途：提交数据  参数：Body  长度：无限制</text>
  <text x="70" y="314" font-size="9" fill="#2d3748">缓存：不缓存  日志：Body 不记录</text>
  <text x="70" y="335" font-size="9" font-weight="bold" fill="#c53030">风险：CSRF 攻击（携带 Cookie 自动提交）</text>

  <text x="70" y="361" font-size="10" font-weight="bold" fill="#b7791f">PUT/PATCH：</text>
  <text x="70" y="379" font-size="9" fill="#2d3748">用途：更新资源  PUT 全量  PATCH 部分</text>
  <text x="70" y="397" font-size="9" fill="#2d3748">幂等：PUT 是  PATCH 不一定</text>
  <text x="70" y="418" font-size="9" font-weight="bold" fill="#c53030">风险：PUT 可覆盖任意资源</text>

  <text x="70" y="444" font-size="10" font-weight="bold" fill="#c53030">DELETE：</text>
  <text x="70" y="462" font-size="9" fill="#2d3748">用途：删除资源  幂等：是（多次删除同一资源）</text>
  <text x="70" y="480" font-size="9" font-weight="bold" fill="#c53030">风险：DELETE 被 CSRF 利用</text>

  <rect x="520" y="140" width="440" height="330" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">幂等性 vs 安全性</text>

  <text x="550" y="195" font-size="10" font-weight="bold" fill="#c53030">幂等性（Idempotent）：</text>
  <text x="550" y="215" font-size="9" fill="#2d3748">多次执行结果相同</text>
  <text x="550" y="235" font-size="9" fill="#2d3748">GET / PUT / DELETE → 幂等</text>
  <text x="550" y="255" font-size="9" fill="#2d3748">POST / PATCH → 非幂等</text>

  <text x="550" y="285" font-size="10" font-weight="bold" fill="#805ad5">安全性（Safe）：</text>
  <text x="550" y="305" font-size="9" fill="#2d3748">不改变服务器状态</text>
  <text x="550" y="325" font-size="9" fill="#2d3748">仅 GET / HEAD / OPTIONS → 安全</text>
  <text x="550" y="345" font-size="9" fill="#2d3748">POST / PUT / PATCH / DELETE → 不安全</text>

  <text x="550" y="375" font-size="10" font-weight="bold" fill="#dd6b20">渗透测试关注：</text>
  <text x="550" y="395" font-size="9" fill="#2d3748">① GET 请求携带敏感参数</text>
  <text x="550" y="415" font-size="9" fill="#2d3748">② POST 接口未做 CSRF 防护</text>
  <text x="550" y="435" font-size="9" fill="#2d3748">③ PUT/DELETE 未鉴权</text>
  <text x="550" y="455" font-size="9" fill="#2d3748">④ HTTP 方法篡改（GET→POST）</text>
</svg>
