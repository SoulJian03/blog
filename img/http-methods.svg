<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="460" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">HTTP 方法幂等性与安全性</text>

  <rect x="40" y="60" width="210" height="360" rx="12" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="145" y="85" font-size="13" text-anchor="middle" fill="#c53030" font-weight="bold">GET</text>
  <text x="145" y="103" font-size="9" text-anchor="middle" fill="#742a2a">查询数据</text>

  <text x="70" y="133" font-size="9" fill="#2d3748">幂等：✅ 是</text>
  <text x="70" y="151" font-size="9" fill="#2d3748">安全：✅ 是</text>
  <text x="70" y="169" font-size="9" fill="#2d3748">缓存：✅ 可缓存</text>
  <text x="70" y="187" font-size="9" fill="#2d3748">参数：URL 查询字符串</text>
  <text x="70" y="205" font-size="9" fill="#2d3748">长度：URL 长度限制</text>
  <text x="70" y="235" font-size="9" fill="#2d3748">用途：查询/搜索/详情</text>
  <text x="70" y="253" font-size="9" fill="#2d3748">禁止携带敏感数据</text>
  <text x="70" y="271" font-size="9" fill="#2d3748">注意：URL 记录在日志</text>

  <text x="70" y="301" font-size="9" font-weight="bold" fill="#c53030">危险：</text>
  <text x="70" y="319" font-size="9" fill="#2d3748">GET 请求可能带 Token</text>
  <text x="70" y="337" font-size="9" fill="#2d3748">GET 请求被浏览器缓存</text>
  <text x="70" y="355" font-size="9" fill="#2d3748">GET 删除操作不安全</text>

  <rect x="275" y="60" width="210" height="360" rx="12" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="380" y="85" font-size="13" text-anchor="middle" fill="#b7791f" font-weight="bold">POST</text>
  <text x="380" y="103" font-size="9" text-anchor="middle" fill="#744210">提交数据</text>

  <text x="305" y="133" font-size="9" fill="#2d3748">幂等：❌ 否</text>
  <text x="305" y="151" font-size="9" fill="#2d3748">安全：❌ 否</text>
  <text x="305" y="169" font-size="9" fill="#2d3748">缓存：❌ 不可缓存</text>
  <text x="305" y="187" font-size="9" fill="#2d3748">参数：请求体</text>
  <text x="305" y="205" font-size="9" fill="#2d3748">长度：无限制</text>
  <text x="305" y="235" font-size="9" fill="#2d3748">用途：创建/提交表单</text>
  <text x="305" y="253" font-size="9" fill="#2d3748">注意：重放攻击风险</text>

  <text x="305" y="283" font-size="9" font-weight="bold" fill="#b7791f">幂等解决：</text>
  <text x="305" y="301" font-size="9" fill="#2d3748">使用幂等键（Idempotency-Key）</text>

  <rect x="510" y="60" width="210" height="360" rx="12" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="615" y="85" font-size="13" text-anchor="middle" fill="#805ad5" font-weight="bold">PUT</text>
  <text x="615" y="103" font-size="9" text-anchor="middle" fill="#44337a">替换资源</text>

  <text x="540" y="133" font-size="9" fill="#2d3748">幂等：✅ 是</text>
  <text x="540" y="151" font-size="9" fill="#2d3748">安全：❌ 否</text>
  <text x="540" y="169" font-size="9" fill="#2d3748">缓存：❌ 不可缓存</text>
  <text x="540" y="187" font-size="9" fill="#2d3748">参数：请求体</text>
  <text x="540" y="205" font-size="9" fill="#2d3748">用途：更新完整资源</text>

  <text x="540" y="235" font-size="9" font-weight="bold" fill="#805ad5">注意：</text>
  <text x="540" y="253" font-size="9" fill="#2d3748">幂等：多次执行结果相同</text>
  <text x="540" y="271" font-size="9" fill="#2d3748">安全：非安全（改变资源）</text>

  <rect x="745" y="60" width="215" height="360" rx="12" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="852" y="85" font-size="13" text-anchor="middle" fill="#38a169" font-weight="bold">DELETE</text>
  <text x="852" y="103" font-size="9" text-anchor="middle" fill="#22543d">删除资源</text>

  <text x="775" y="133" font-size="9" fill="#2d3748">幂等：✅ 是</text>
  <text x="775" y="151" font-size="9" fill="#2d3748">安全：❌ 否</text>
  <text x="775" y="169" font-size="9" fill="#2d3748">缓存：❌ 不可缓存</text>
  <text x="775" y="187" font-size="9" fill="#2d3748">用途：删除资源</text>
  <text x="775" y="205" font-size="9" fill="#2d3748">注意：CSRF 攻击目标</text>

  <text x="775" y="235" font-size="9" font-weight="bold" fill="#38a169">幂等：</text>
  <text x="775" y="253" font-size="9" fill="#2d3748">删除不存在的资源返回 204</text>
  <text x="775" y="271" font-size="9" fill="#2d3748">多次删除结果相同</text>

  <rect x="40" y="430" width="920" height="15" rx="4" fill="#e2e8f0"/>
  <text x="500" y="443" font-size="9" text-anchor="middle" fill="#4a5568">幂等性：多次请求结果相同 · 安全性：不改变服务器状态 · 幂等+安全=GET</text>
</svg>
