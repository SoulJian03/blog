<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="500" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">MySQL 事务隔离级别</text>

  <rect x="40" y="60" width="920" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="500" y="90" font-size="12" text-anchor="middle" fill="#2a4365" font-weight="bold">MySQL 四种事务隔离级别</text>

  <rect x="40" y="125" width="215" height="100" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="148" y="148" font-size="10" text-anchor="middle" fill="#276749" font-weight="bold">READ UNCOMMITTED</text>
  <text x="60" y="172" font-size="9" fill="#2d3748">最低级别 · 不推荐</text>
  <text x="60" y="192" font-size="9" fill="#2d3748">❌ 脏读 ❌ 不可重复读</text>
  <text x="60" y="212" font-size="9" fill="#2d3748">❌ 幻读</text>

  <rect x="275" y="125" width="215" height="100" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="383" y="148" font-size="10" text-anchor="middle" fill="#744210" font-weight="bold">READ COMMITTED</text>
  <text x="295" y="172" font-size="9" fill="#2d3748">PostgreSQL 默认</text>
  <text x="295" y="192" font-size="9" fill="#2d3748">✅ 防脏读</text>
  <text x="295" y="212" font-size="9" fill="#2d3748">❌ 不可重复读 ❌ 幻读</text>

  <rect x="510" y="125" width="215" height="100" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="618" y="148" font-size="10" text-anchor="middle" fill="#44337a" font-weight="bold">REPEATABLE READ</text>
  <text x="530" y="172" font-size="9" fill="#2d3748">MySQL 默认</text>
  <text x="530" y="192" font-size="9" fill="#2d3748">✅ 防脏读 ✅ 防不可重复读</text>
  <text x="530" y="212" font-size="9" fill="#2d3748">✅ 防幻读（InnoDB）</text>

  <rect x="745" y="125" width="215" height="100" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="853" y="148" font-size="10" text-anchor="middle" fill="#c53030" font-weight="bold">SERIALIZABLE</text>
  <text x="765" y="172" font-size="9" fill="#2d3748">最严格 · 性能最差</text>
  <text x="765" y="192" font-size="9" fill="#2d3748">✅ 防脏读 ✅ 防不可重复读</text>
  <text x="765" y="212" font-size="9" fill="#2d3748">✅ 防幻读</text>

  <rect x="40" y="245" width="920" height="60" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="2"/>
  <text x="500" y="275" font-size="11" text-anchor="middle" fill="#2b6cb0" font-weight="bold">隔离级别对比矩阵</text>
  <text x="150" y="295" font-size="9" fill="#2d3748">脏读</text>
  <text x="300" y="295" font-size="9" fill="#2d3748">不可重复读</text>
  <text x="500" y="295" font-size="9" fill="#2d3748">幻读</text>
  <text x="700" y="295" font-size="9" fill="#2d3748">性能</text>

  <rect x="40" y="320" width="920" height="150" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="500" y="345" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">三种异常说明</text>

  <rect x="60" y="365" width="280" height="90" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5"/>
  <text x="200" y="388" font-size="10" text-anchor="middle" fill="#822727" font-weight="bold">脏读</text>
  <text x="80" y="408" font-size="9" fill="#2d3748">读到未提交的数据</text>
  <text x="80" y="428" font-size="9" fill="#2d3748">A 更新但未提交 → B 读到脏数据</text>
  <text x="80" y="448" font-size="9" fill="#2d3748">最危险：数据可能回滚</text>

  <rect x="360" y="365" width="280" height="90" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="1.5"/>
  <text x="500" y="388" font-size="10" text-anchor="middle" fill="#744210" font-weight="bold">不可重复读</text>
  <text x="380" y="408" font-size="9" fill="#2d3748">同一事务两次读结果不同</text>
  <text x="380" y="428" font-size="9" fill="#2d3748">A 读→B 更新→A 再读，值变了</text>
  <text x="380" y="448" font-size="9" fill="#2d3748">MVCC 可解决</text>

  <rect x="660" y="365" width="280" height="90" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="1.5"/>
  <text x="800" y="388" font-size="10" text-anchor="middle" fill="#44337a" font-weight="bold">幻读</text>
  <text x="680" y="408" font-size="9" fill="#2d3748">同一条件两次查询行数不同</text>
  <text x="680" y="428" font-size="9" fill="#2d3748">A 查询→B 插入→A 再查多了一行</text>
  <text x="680" y="448" font-size="9" fill="#2d3748">间隙锁 / 串行化可解决</text>
</svg>
