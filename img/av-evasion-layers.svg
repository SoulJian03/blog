<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr-a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="#f8fafc" rx="10"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#111">免杀技术层级图</text>
  <text x="40" y="64" font-size="14" fill="#666">从 Shellcode 混淆到 C2 协议混淆的全流程免杀对抗</text>

  <rect x="40" y="100" width="1120" height="440" rx="12" fill="#ffffff" stroke="#ddd" stroke-width="1"/>

  <rect x="60" y="120" width="200" height="70" rx="10" fill="#fee2e2" stroke="#c0392b" stroke-width="2"/>
  <text x="160" y="150" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">① Shellcode 混淆</text>
  <text x="160" y="172" font-size="12" text-anchor="middle" fill="#555">异或/替换/分段/加密</text>
  <text x="160" y="190" font-size="11" text-anchor="middle" fill="#555">绕过 AV 静态特征匹配</text>

  <rect x="290" y="120" width="200" height="70" rx="10" fill="#dbeafe" stroke="#2980b9" stroke-width="2"/>
  <text x="390" y="150" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">② 进程注入</text>
  <text x="390" y="172" font-size="12" text-anchor="middle" fill="#555">注入 explorer/svchost</text>
  <text x="390" y="190" font-size="11" text-anchor="middle" fill="#555">不落地可执行文件</text>

  <rect x="520" y="120" width="200" height="70" rx="10" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="620" y="150" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">③ AMSI 绕过</text>
  <text x="620" y="172" font-size="12" text-anchor="middle" fill="#555">Patch AMSI.dll</text>
  <text x="620" y="190" font-size="11" text-anchor="middle" fill="#555">PowerShell 脚本不被检测</text>

  <rect x="750" y="120" width="200" height="70" rx="10" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="850" y="150" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">④ C2 协议混淆</text>
  <text x="850" y="172" font-size="12" text-anchor="middle" fill="#555">HTTPS/xray/DNS</text>
  <text x="850" y="190" font-size="11" text-anchor="middle" fill="#555">流量混在正常 HTTPS 中</text>

  <rect x="980" y="120" width="160" height="70" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
  <text x="1060" y="150" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">⑤ 合法工具</text>
  <text x="1060" y="172" font-size="12" text-anchor="middle" fill="#555">LOLBins</text>
  <text x="1060" y="190" font-size="11" text-anchor="middle" fill="#555">MSBuild/WMI/PowerShell</text>

  <path d="M 260 155 L 280 155" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arr-a1)"/>
  <path d="M 490 155 L 510 155" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arr-a1)"/>
  <path d="M 720 155 L 740 155" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arr-a1)"/>
  <path d="M 950 155 L 970 155" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arr-a1)"/>

  <rect x="60" y="220" width="1080" height="60" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="600" y="250" font-size="15" text-anchor="middle" fill="#1565c0" font-weight="bold">↓ 组合使用 ↓</text>
  <text x="600" y="272" font-size="13" text-anchor="middle" fill="#1565c0">shellcode 异或 → 注入 explorer → AMSI bypass → HTTPS C2 → LOLBins 执行</text>

  <rect x="60" y="310" width="1080" height="60" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="600" y="340" font-size="15" text-anchor="middle" fill="#e65100" font-weight="bold">检测对抗</text>
  <text x="600" y="362" font-size="13" text-anchor="middle" fill="#e65100">EDR 行为检测 → 内存异常 → 进程注入检测 → AMSI buffer 修改检测</text>

  <rect x="60" y="400" width="1080" height="60" rx="10" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/>
  <text x="600" y="430" font-size="15" text-anchor="middle" fill="#27ae60" font-weight="bold">防御建议</text>
  <text x="600" y="452" font-size="13" text-anchor="middle" fill="#27ae60">EDR + ASR + Credential Guard + 内存完整性保护 + AMSI 日志 + 网络隔离</text>

  <text x="600" y="510" font-size="14" text-anchor="middle" fill="#555">层级越高越难检测，但落地越复杂；组合使用才能达到"可上线"水平</text>
</svg>
