<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">MySQL DDL 数据定义语句</text>

  <rect x="40" y="60" width="280" height="380" rx="12" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="180" y="85" font-size="13" text-anchor="middle" fill="#b7791f" font-weight="bold">CREATE 创建</text>

  <text x="70" y="115" font-size="10" font-weight="bold" fill="#b7791f">创建表：</text>
  <text x="70" y="133" font-size="9" fill="#2d3748">CREATE TABLE users (</text>
  <text x="80" y="151" font-size="9" fill="#2d3748">  id INT PRIMARY KEY,</text>
  <text x="80" y="169" font-size="9" fill="#2d3748">  name VARCHAR(50),</text>
  <text x="80" y="187" font-size="9" fill="#2d3748">  created_at DATETIME</text>
  <text x="70" y="205" font-size="9" fill="#2d3748">);</text>

  <text x="70" y="235" font-size="10" font-weight="bold" fill="#b7791f">创建数据库：</text>
  <text x="70" y="253" font-size="9" fill="#2d3748">CREATE DATABASE myapp;</text>

  <text x="70" y="283" font-size="10" font-weight="bold" fill="#b7791f">创建索引：</text>
  <text x="70" y="301" font-size="9" fill="#2d3748">CREATE INDEX idx_name</text>
  <text x="80" y="319" font-size="9" fill="#2d3748">ON users(name);</text>

  <text x="70" y="349" font-size="10" font-weight="bold" fill="#b7791f">创建视图：</text>
  <text x="70" y="367" font-size="9" fill="#2d3748">CREATE VIEW v_users AS</text>
  <text x="80" y="385" font-size="9" fill="#2d3748">SELECT id, name FROM users;</text>

  <text x="70" y="415" font-size="10" font-weight="bold" fill="#b7791f">创建用户：</text>
  <text x="70" y="433" font-size="9" fill="#2d3748">CREATE USER 'app'@'%'</text>
  <text x="80" y="451" font-size="9" fill="#2d3748">IDENTIFIED BY 'pwd';</text>

  <rect x="340" y="60" width="300" height="380" rx="12" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="490" y="85" font-size="13" text-anchor="middle" fill="#805ad5" font-weight="bold">ALTER 修改</text>

  <text x="370" y="115" font-size="10" font-weight="bold" fill="#805ad5">添加列：</text>
  <text x="370" y="133" font-size="9" fill="#2d3748">ALTER TABLE users</text>
  <text x="380" y="151" font-size="9" fill="#2d3748">ADD email VARCHAR(100);</text>

  <text x="370" y="181" font-size="10" font-weight="bold" fill="#805ad5">删除列：</text>
  <text x="370" y="199" font-size="9" fill="#2d3748">ALTER TABLE users</text>
  <text x="380" y="217" font-size="9" fill="#2d3748">DROP COLUMN email;</text>

  <text x="370" y="247" font-size="10" font-weight="bold" fill="#805ad5">修改列：</text>
  <text x="370" y="265" font-size="9" fill="#2d3748">ALTER TABLE users</text>
  <text x="380" y="283" font-size="9" fill="#2d3748">MODIFY name VARCHAR(100);</text>

  <text x="370" y="313" font-size="10" font-weight="bold" fill="#805ad5">重命名：</text>
  <text x="370" y="331" font-size="9" fill="#2d3748">ALTER TABLE users</text>
  <text x="380" y="349" font-size="9" fill="#2d3748">RENAME TO members;</text>

  <rect x="660" y="60" width="300" height="380" rx="12" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="810" y="85" font-size="13" text-anchor="middle" fill="#c53030" font-weight="bold">DROP 删除</text>

  <text x="690" y="115" font-size="10" font-weight="bold" fill="#c53030">删除表：</text>
  <text x="690" y="133" font-size="9" fill="#2d3748">DROP TABLE users;</text>
  <text x="690" y="151" font-size="9" fill="#2d3748">DROP TABLE IF EXISTS users;</text>

  <text x="690" y="181" font-size="10" font-weight="bold" fill="#c53030">删除数据库：</text>
  <text x="690" y="199" font-size="9" fill="#2d3748">DROP DATABASE myapp;</text>

  <text x="690" y="229" font-size="10" font-weight="bold" fill="#c53030">删除索引：</text>
  <text x="690" y="247" font-size="9" fill="#2d3748">DROP INDEX idx_name</text>
  <text x="700" y="265" font-size="9" fill="#2d3748">ON users;</text>

  <text x="690" y="295" font-size="10" font-weight="bold" fill="#c53030">安全警告：</text>
  <text x="690" y="313" font-size="9" fill="#2d3748">DROP 不可回滚</text>
  <text x="690" y="331" font-size="9" fill="#2d3748">DDL 自动提交事务</text>
  <text x="690" y="349" font-size="9" fill="#2d3748">操作前务必备份</text>
  <text x="690" y="367" font-size="9" fill="#2d3748">生产环境审批制</text>

  <text x="690" y="397" font-size="10" font-weight="bold" fill="#c53030">TRUNCATE：</text>
  <text x="690" y="415" font-size="9" fill="#2d3748">TRUNCATE TABLE users;</text>
  <text x="690" y="433" font-size="9" fill="#2d3748">-- 清空全表，不可回滚</text>
</svg>
