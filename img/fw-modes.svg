<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="430" fill="#f8fafc" rx="10"/>
  <text x="20" y="34" font-size="20" font-weight="bold" fill="#111">防火墙两种模式对比</text>

  <!-- 路由模式 -->
  <text x="30" y="90" font-size="18" font-weight="bold" fill="#111">① 路由模式：防火墙有 IP，作为三层设备</text>
  <rect x="30" y="110" width="150" height="80" rx="10" fill="#fee2e2" stroke="#333" stroke-width="2"/>
  <text x="105" y="150" font-size="16" text-anchor="middle" fill="#111">外网区</text>
  <rect x="360" y="110" width="160" height="80" rx="10" fill="#dbeafe" stroke="#333" stroke-width="2"/>
  <text x="440" y="150" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">防火墙</text>
  <text x="440" y="172" font-size="12" text-anchor="middle" fill="#333">接口有 IP / 走路由</text>
  <rect x="700" y="110" width="130" height="80" rx="10" fill="#dcfce7" stroke="#333" stroke-width="2"/>
  <text x="765" y="150" font-size="16" text-anchor="middle" fill="#111">内网区</text>
  <line x1="180" y1="150" x2="355" y2="150" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="520" y1="150" x2="695" y2="150" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 透明模式 -->
  <text x="30" y="260" font-size="18" font-weight="bold" fill="#111">② 透明模式：不改 IP，防火墙像“桥”一样串接</text>
  <rect x="30" y="280" width="150" height="80" rx="10" fill="#fee2e2" stroke="#333" stroke-width="2"/>
  <text x="105" y="320" font-size="16" text-anchor="middle" fill="#111">外网区</text>
  <rect x="360" y="280" width="160" height="80" rx="10" fill="#dbeafe" stroke="#333" stroke-width="2"/>
  <text x="440" y="320" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">防火墙</text>
  <text x="440" y="342" font-size="12" text-anchor="middle" fill="#333">桥接 / 接口无业务 IP</text>
  <rect x="700" y="280" width="130" height="80" rx="10" fill="#dcfce7" stroke="#333" stroke-width="2"/>
  <text x="765" y="320" font-size="16" text-anchor="middle" fill="#111">内网区</text>
  <line x1="180" y1="320" x2="355" y2="320" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="520" y1="320" x2="695" y2="320" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <text x="440" y="400" font-size="14" fill="#666" text-anchor="middle">区别：路由模式要规划 IP/路由；透明模式不改变拓扑，插进去就能用</text>
</svg>
