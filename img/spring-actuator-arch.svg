<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">Spring Boot Actuator 信息泄露与未授权</text>

  <rect x="40" y="70" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="102" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① 发现 Actuator</text>

  <rect x="200" y="70" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="270" y="102" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② 枚举端点</text>

  <rect x="360" y="70" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="430" y="102" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 信息收集</text>

  <rect x="520" y="70" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="590" y="102" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 利用</text>

  <rect x="680" y="70" width="140" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="750" y="102" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ RCE</text>

  <rect x="40" y="150" width="460" height="300" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">Actuator 危险端点</text>

  <text x="70" y="205" font-size="10" font-weight="bold" fill="#c53030">/actuator/env：</text>
  <text x="70" y="225" font-size="9" fill="#2d3748">查看/修改环境变量</text>
  <text x="70" y="245" font-size="9" fill="#2d3748">含数据库密码等敏感信息</text>

  <text x="70" y="275" font-size="10" font-weight="bold" fill="#805ad5">/actuator/heapdump：</text>
  <text x="70" y="295" font-size="9" fill="#2d3748">下载 JVM 堆内存快照</text>
  <text x="70" y="315" font-size="9" fill="#2d3748">可提取明文密码/JWT</text>

  <text x="70" y="345" font-size="10" font-weight="bold" fill="#dd6b20">/actuator/auditevents：</text>
  <text x="70" y="365" font-size="9" fill="#2d3748">查看审计事件日志</text>

  <text x="70" y="395" font-size="10" font-weight="bold" fill="#3182ce">/actuator/threaddump：</text>
  <text x="70" y="415" font-size="9" fill="#2d3748">线程堆栈信息（含变量值）</text>

  <text x="70" y="445" font-size="10" font-weight="bold" fill="#38a169">/actuator/logfile：</text>
  <text x="70" y="465" font-size="9" fill="#2d3748">读取应用日志文件</text>

  <rect x="520" y="150" width="440" height="300" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">防御方法</text>

  <text x="550" y="205" font-size="10" font-weight="bold" fill="#c53030">关闭端点：</text>
  <text x="550" y="225" font-size="9" fill="#2d3748">management.endpoints.web.exposure.include=</text>
  <text x="550" y="245" font-size="9" fill="#2d3748">或只暴露 health / info</text>

  <text x="550" y="275" font-size="10" font-weight="bold" fill="#805ad5">加认证：</text>
  <text x="550" y="295" font-size="9" fill="#2d3748">management.endpoints.web.exposure.include=health</text>
  <text x="550" y="315" font-size="9" fill="#2d3748">使用 Spring Security 保护</text>

  <text x="550" y="345" font-size="10" font-weight="bold" fill="#dd6b20">网络隔离：</text>
  <text x="550" y="365" font-size="9" fill="#2d3748">Actuator 端口不暴露公网</text>
  <text x="550" y="385" font-size="9" fill="#2d3748">使用管理端口（不同于业务端口）</text>

  <text x="550" y="415" font-size="10" font-weight="bold" fill="#3182ce">监控：</text>
  <text x="550" y="435" font-size="9" fill="#2d3748">WAF 拦截 /actuator/ 路径</text>
  <text x="550" y="455" font-size="9" fill="#2d3748">监控敏感端点访问</text>
</svg>
