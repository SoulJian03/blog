<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="500" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">MySQL 语句分类（DDL / DML / DQL / DCL）</text>

  <rect x="40" y="60" width="220" height="380" rx="12" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="150" y="85" font-size="13" text-anchor="middle" fill="#c53030" font-weight="bold">DDL 数据定义</text>
  <text x="150" y="102" font-size="9" text-anchor="middle" fill="#742a2a">CREATE / ALTER / DROP</text>

  <text x="70" y="130" font-size="10" fill="#2d3748">CREATE TABLE users (</text>
  <text x="80" y="148" font-size="9" fill="#2d3748">  id INT PRIMARY KEY,</text>
  <text x="80" y="166" font-size="9" fill="#2d3748">  name VARCHAR(50)</text>
  <text x="70" y="184" font-size="9" fill="#2d3748">);</text>
  <text x="70" y="212" font-size="10" fill="#2d3748">ALTER TABLE users ADD</text>
  <text x="80" y="230" font-size="9" fill="#2d3748">email VARCHAR(100);</text>
  <text x="70" y="258" font-size="10" fill="#2d3748">DROP TABLE users;</text>

  <text x="70" y="286" font-size="10" font-weight="bold" fill="#c53030">功能：</text>
  <text x="70" y="304" font-size="9" fill="#2d3748">定义/修改/删除表结构</text>
  <text x="70" y="322" font-size="9" fill="#2d3748">索引/视图/数据库</text>

  <text x="70" y="350" font-size="10" font-weight="bold" fill="#c53030">注意：</text>
  <text x="70" y="368" font-size="9" fill="#2d3748">DDL 自动提交事务</text>
  <text x="70" y="386" font-size="9" fill="#2d3748">不可回滚</text>

  <text x="70" y="414" font-size="10" font-weight="bold" fill="#c53030">安全：</text>
  <text x="70" y="432" font-size="9" fill="#2d3748">DBA 权限控制严格</text>
  <text x="70" y="450" font-size="9" fill="#2d3748">禁止应用账号执行 DDL</text>

  <rect x="285" y="60" width="220" height="380" rx="12" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="395" y="85" font-size="13" text-anchor="middle" fill="#b7791f" font-weight="bold">DML 数据操作</text>
  <text x="395" y="102" font-size="9" text-anchor="middle" fill="#744210">INSERT / UPDATE / DELETE</text>

  <text x="305" y="130" font-size="10" fill="#2d3748">INSERT INTO users</text>
  <text x="315" y="148" font-size="9" fill="#2d3748">VALUES (1,'admin');</text>

  <text x="305" y="176" font-size="10" fill="#2d3748">UPDATE users SET</text>
  <text x="315" y="194" font-size="9" fill="#2d3748">name='root' WHERE id=1;</text>

  <text x="305" y="222" font-size="10" fill="#2d3748">DELETE FROM users</text>
  <text x="315" y="240" font-size="9" fill="#2d3748">WHERE id=2;</text>

  <text x="305" y="268" font-size="10" font-weight="bold" fill="#b7791f">功能：</text>
  <text x="305" y="286" font-size="9" fill="#2d3748">插入/更新/删除数据</text>

  <text x="305" y="314" font-size="10" font-weight="bold" fill="#b7791f">注意：</text>
  <text x="305" y="332" font-size="9" fill="#2d3748">可回滚（需事务）</text>
  <text x="305" y="350" font-size="9" fill="#2d3748">WHERE 条件必须写</text>

  <text x="305" y="378" font-size="10" font-weight="bold" fill="#b7791f">安全：</text>
  <text x="305" y="396" font-size="9" fill="#2d3748">防 SQL 注入</text>
  <text x="305" y="414" font-size="9" fill="#2d3748">最小权限原则</text>
  <text x="305" y="432" font-size="9" fill="#2d3748">DELETE 前 SELECT 验证</text>
  <text x="305" y="450" font-size="9" fill="#2d3748">UPDATE 前先备份</text>

  <rect x="530" y="60" width="220" height="380" rx="12" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="640" y="85" font-size="13" text-anchor="middle" fill="#805ad5" font-weight="bold">DQL 数据查询</text>
  <text x="640" y="102" font-size="9" text-anchor="middle" fill="#44337a">SELECT（只读）</text>

  <text x="550" y="130" font-size="10" fill="#2d3748">SELECT * FROM users;</text>

  <text x="550" y="158" font-size="10" fill="#2d3748">SELECT name, email</text>
  <text x="560" y="176" font-size="9" fill="#2d3748">FROM users</text>
  <text x="560" y="194" font-size="9" fill="#2d3748">WHERE id &gt; 10</text>
  <text x="560" y="212" font-size="9" fill="#2d3748">ORDER BY name</text>
  <text x="560" y="230" font-size="9" fill="#2d3748">LIMIT 10;</text>

  <text x="550" y="258" font-size="10" fill="#2d3748">SELECT COUNT(*),</text>
  <text x="560" y="276" font-size="9" fill="#2d3748">status FROM users</text>
  <text x="560" y="294" font-size="9" fill="#2d3748">GROUP BY status</text>
  <text x="560" y="312" font-size="9" fill="#2d3748">HAVING COUNT(*) &gt; 5;</text>

  <text x="550" y="340" font-size="10" font-weight="bold" fill="#805ad5">功能：</text>
  <text x="550" y="358" font-size="9" fill="#2d3748">查询/聚合/连接/子查询</text>

  <text x="550" y="386" font-size="10" font-weight="bold" fill="#805ad5">注意：</text>
  <text x="550" y="404" font-size="9" fill="#2d3748">不修改数据</text>
  <text x="550" y="422" font-size="9" fill="#2d3748">注意性能（索引）</text>
  <text x="550" y="440" font-size="9" fill="#2d3748">防 SQL 注入</text>

  <rect x="775" y="60" width="185" height="380" rx="12" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="867" y="85" font-size="13" text-anchor="middle" fill="#38a169" font-weight="bold">DCL 数据控制</text>
  <text x="867" y="102" font-size="9" text-anchor="middle" fill="#22543d">GRANT / REVOKE</text>

  <text x="795" y="130" font-size="10" fill="#2d3748">GRANT SELECT ON</text>
  <text x="805" y="148" font-size="9" fill="#2d3748">users TO 'app'@'%';</text>

  <text x="795" y="176" font-size="10" fill="#2d3748">GRANT ALL ON *.*</text>
  <text x="805" y="194" font-size="9" fill="#2d3748">TO 'dba'@'localhost';</text>

  <text x="795" y="222" font-size="10" fill="#2d3748">REVOKE DELETE ON</text>
  <text x="805" y="240" font-size="9" fill="#2d3748">users FROM 'app'@'%';</text>

  <text x="795" y="268" font-size="10" font-weight="bold" fill="#38a169">功能：</text>
  <text x="795" y="286" font-size="9" fill="#2d3748">授权/收回权限</text>

  <text x="795" y="314" font-size="10" font-weight="bold" fill="#38a169">安全：</text>
  <text x="795" y="332" font-size="9" fill="#2d3748">最小权限原则</text>
  <text x="795" y="350" font-size="9" fill="#2d3748">按角色分配</text>
  <text x="795" y="368" font-size="9" fill="#2d3748">定期审查权限</text>
  <text x="795" y="386" font-size="9" fill="#2d3748">禁止 ALL PRIVILEGES</text>
  <text x="795" y="404" font-size="9" fill="#2d3748">限制连接来源 IP</text>
  <text x="795" y="422" font-size="9" fill="#2d3748">密码强度要求</text>
</svg>
