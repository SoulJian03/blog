<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">Mysql-DQL 数据查询语句使用</text>

  <rect x="40" y="60" width="280" height="380" rx="12" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="180" y="85" font-size="13" text-anchor="middle" fill="#805ad5" font-weight="bold">DQL 查询语句</text>

  <text x="70" y="115" font-size="10" font-weight="bold" fill="#805ad5">基础查询：</text>
  <text x="70" y="133" font-size="9" fill="#2d3748">SELECT * FROM users;</text>

  <text x="70" y="157" font-size="10" font-weight="bold" fill="#805ad5">条件查询：</text>
  <text x="70" y="175" font-size="9" fill="#2d3748">SELECT * FROM users</text>
  <text x="80" y="193" font-size="9" fill="#2d3748">WHERE age &gt; 18;</text>

  <text x="70" y="217" font-size="10" font-weight="bold" fill="#805ad5">排序：</text>
  <text x="70" y="235" font-size="9" fill="#2d3748">SELECT * FROM users</text>
  <text x="80" y="253" font-size="9" fill="#2d3748">ORDER BY age DESC;</text>

  <text x="70" y="277" font-size="10" font-weight="bold" fill="#805ad5">分页：</text>
  <text x="70" y="295" font-size="9" fill="#2d3748">SELECT * FROM users</text>
  <text x="80" y="313" font-size="9" fill="#2d3748">LIMIT 10 OFFSET 0;</text>

  <text x="70" y="337" font-size="10" font-weight="bold" fill="#805ad5">聚合：</text>
  <text x="70" y="355" font-size="9" fill="#2d3748">SELECT COUNT(*), MAX(age)</text>
  <text x="80" y="373" font-size="9" fill="#2d3748">FROM users;</text>

  <text x="70" y="397" font-size="10" font-weight="bold" fill="#805ad5">分组：</text>
  <text x="70" y="415" font-size="9" fill="#2d3748">SELECT status, COUNT(*)</text>
  <text x="80" y="433" font-size="9" fill="#2d3748">FROM users GROUP BY status</text>
  <text x="80" y="451" font-size="9" fill="#2d3748">HAVING COUNT(*) &gt; 5;</text>

  <rect x="340" y="60" width="300" height="380" rx="12" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="490" y="85" font-size="13" text-anchor="middle" fill="#38a169" font-weight="bold">多表连接</text>

  <text x="370" y="115" font-size="10" font-weight="bold" fill="#38a169">INNER JOIN：</text>
  <text x="370" y="133" font-size="9" fill="#2d3748">SELECT u.name, o.total</text>
  <text x="380" y="151" font-size="9" fill="#2d3748">FROM users u</text>
  <text x="380" y="169" font-size="9" fill="#2d3748">INNER JOIN orders o</text>
  <text x="380" y="187" font-size="9" fill="#2d3748">ON u.id = o.user_id;</text>

  <text x="370" y="217" font-size="10" font-weight="bold" fill="#38a169">LEFT JOIN：</text>
  <text x="370" y="235" font-size="9" fill="#2d3748">FROM users u</text>
  <text x="380" y="253" font-size="9" fill="#2d3748">LEFT JOIN orders o</text>
  <text x="380" y="271" font-size="9" fill="#2d3748">ON u.id = o.user_id;</text>
  <text x="380" y="289" font-size="9" fill="#2d3748">-- 用户没有订单也显示</text>

  <text x="370" y="319" font-size="10" font-weight="bold" fill="#38a169">子查询：</text>
  <text x="370" y="337" font-size="9" fill="#2d3748">SELECT * FROM users</text>
  <text x="380" y="355" font-size="9" fill="#2d3748">WHERE id IN (</text>
  <text x="380" y="373" font-size="9" fill="#2d3748">  SELECT user_id FROM orders</text>
  <text x="380" y="391" font-size="9" fill="#2d3748">  WHERE total &gt; 1000</text>
  <text x="370" y="409" font-size="9" fill="#2d3748">);</text>

  <rect x="660" y="60" width="300" height="380" rx="12" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="810" y="85" font-size="13" text-anchor="middle" fill="#b7791f" font-weight="bold">安全注意事项</text>

  <text x="690" y="115" font-size="10" font-weight="bold" fill="#b7791f">防 SQL 注入：</text>
  <text x="690" y="133" font-size="9" fill="#2d3748">使用参数化查询（预处理语句）</text>
  <text x="690" y="151" font-size="9" fill="#2d3748">禁止字符串拼接 SQL</text>
  <text x="690" y="169" font-size="9" fill="#2d3748">使用 ORM 框架（Hibernate/MyBatis）</text>

  <text x="690" y="199" font-size="10" font-weight="bold" fill="#b7791f">性能优化：</text>
  <text x="690" y="217" font-size="9" fill="#2d3748">EXPLAIN 分析执行计划</text>
  <text x="690" y="235" font-size="9" fill="#2d3748">在 WHERE 条件字段建索引</text>
  <text x="690" y="253" font-size="9" fill="#2d3748">避免 SELECT *</text>

  <text x="690" y="283" font-size="10" font-weight="bold" fill="#b7791f">权限控制：</text>
  <text x="690" y="301" font-size="9" fill="#2d3748">应用账号只给 SELECT 权限</text>
  <text x="690" y="319" font-size="9" fill="#2d3748">敏感字段加密存储</text>

  <text x="690" y="349" font-size="10" font-weight="bold" fill="#b7791f">数据脱敏：</text>
  <text x="690" y="367" font-size="9" fill="#2d3748">身份证号/手机号加密</text>
  <text x="690" y="385" font-size="9" fill="#2d3748">日志中不输出敏感字段</text>
</svg>
