<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="640" fill="#f8fafc" rx="10"/>
  <text x="20" y="36" font-size="20" font-weight="bold" fill="#111">应急响应取证流程：先保全证据，再隔离处置</text>

  <!-- 1 事件确认 -->
  <rect x="320" y="60" width="260" height="70" rx="10" fill="#fee2e2" stroke="#333" stroke-width="2"/>
  <text x="450" y="92" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">① 确认事件</text>
  <text x="450" y="116" font-size="13" text-anchor="middle" fill="#666">告警/异常 → 判断事件类型</text>

  <!-- 2 内存取证 -->
  <rect x="40" y="200" width="240" height="120" rx="10" fill="#dbeafe" stroke="#333" stroke-width="2"/>
  <text x="160" y="235" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">② 内存取证（先做！）</text>
  <text x="160" y="260" font-size="13" text-anchor="middle" fill="#333">Linux: LiME / fmem / /proc/kcore</text>
  <text x="160" y="280" font-size="13" text-anchor="middle" fill="#333">Windows: DumpIt / FTK Imager</text>
  <text x="160" y="304" font-size="12" text-anchor="middle" fill="#b91c1c">断电/断网会丢内存，最先抓</text>

  <!-- 3 磁盘快照 -->
  <rect x="330" y="200" width="240" height="120" rx="10" fill="#dcfce7" stroke="#333" stroke-width="2"/>
  <text x="450" y="235" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">③ 磁盘快照/镜像</text>
  <text x="450" y="260" font-size="13" text-anchor="middle" fill="#333">Linux: dd / LVM 快照</text>
  <text x="450" y="280" font-size="13" text-anchor="middle" fill="#333">Windows: FTK Imager / dd</text>
  <text x="450" y="304" font-size="12" text-anchor="middle" fill="#b91c1c">云主机先做云快照</text>

  <!-- 4 隔离 -->
  <rect x="620" y="200" width="240" height="120" rx="10" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="740" y="235" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">④ 隔离主机</text>
  <text x="740" y="260" font-size="13" text-anchor="middle" fill="#333">断外网/禁网卡/安全组</text>
  <text x="740" y="280" font-size="13" text-anchor="middle" fill="#333">防火墙封端口/断连接</text>
  <text x="740" y="304" font-size="12" text-anchor="middle" fill="#b45309">遏制扩散，再往下查</text>

  <!-- 5 分析排查 -->
  <rect x="330" y="400" width="240" height="100" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="450" y="438" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">⑤ 分析排查</text>
  <text x="450" y="462" font-size="13" text-anchor="middle" fill="#333">账号/进程/文件/启动项/日志</text>
  <text x="450" y="484" font-size="13" text-anchor="middle" fill="#333">内存+磁盘证据交叉分析</text>

  <!-- 6 清理加固 -->
  <rect x="330" y="540" width="240" height="80" rx="10" fill="#dcfce7" stroke="#333" stroke-width="2"/>
  <text x="450" y="574" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">⑥ 清理加固 + 溯源报告</text>
  <text x="450" y="598" font-size="13" text-anchor="middle" fill="#666">清后门→修漏洞→还原攻击链</text>

  <!-- arrows -->
  <line x1="450" y1="130" x2="450" y2="195" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="280" y1="250" x2="325" y2="250" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="570" y1="250" x2="615" y2="250" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="620" y1="290" x2="540" y2="400" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="450" y1="500" x2="450" y2="535" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>

  <text x="20" y="620" font-size="13" fill="#666">顺序关键：内存（易失）→ 磁盘（持久）→ 隔离 → 分析；取证前别乱动现场</text>
</svg>
