<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr-b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2980b9"/>
    </marker>
    <marker id="arr-b3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="#f8fafc" rx="10"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#111">BloodHound 域关系分析拓扑图</text>
  <text x="40" y="64" font-size="14" fill="#666">域控制器 → 用户/组 → 权限传递链（BloodHound 图分析）</text>

  <!-- 域控 -->
  <rect x="90" y="180" width="200" height="100" rx="12" fill="#fce4ec" stroke="#ad1457" stroke-width="2.5"/>
  <text x="190" y="215" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">🏛️ 域控制器 DC</text>
  <text x="190" y="240" font-size="13" text-anchor="middle" fill="#555">corp.local</text>
  <text x="190" y="260" font-size="12" text-anchor="middle" fill="#555">krbtgt / Administrator</text>

  <!-- 用户组 -->
  <rect x="340" y="140" width="200" height="100" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="440" y="175" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">👥 Domain Admins</text>
  <text x="440" y="200" font-size="13" text-anchor="middle" fill="#555">内置最高权限组</text>
  <text x="440" y="220" font-size="12" text-anchor="middle" fill="#555">Members: 3</text>

  <rect x="340" y="280" width="200" height="100" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="440" y="315" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">👤 低权限用户</text>
  <text x="440" y="340" font-size="13" text-anchor="middle" fill="#555">jdoe / intern</text>
  <text x="440" y="360" font-size="12" text-anchor="middle" fill="#555">普通域成员</text>

  <!-- 攻击路径 -->
  <rect x="600" y="140" width="220" height="240" rx="12" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="710" y="170" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">⚡ 攻击路径（最短路径）</text>
  <line x1="620" y1="180" x2="800" y2="180" stroke="#e65100" stroke-width="1"/>

  <text x="620" y="210" font-size="13" fill="#c0392b" font-weight="bold">1. kerberoastable</text>
  <text x="620" y="228" font-size="12" fill="#555">jdoe 可 kerberoast</text>

  <text x="620" y="260" font-size="13" fill="#2980b9" font-weight="bold">2. memberOf</text>
  <text x="620" y="278" font-size="12" fill="#555">jdoe → IT_Support</text>

  <text x="620" y="310" font-size="13" fill="#27ae60" font-weight="bold">3. genericAll</text>
  <text x="620" y="328" font-size="12" fill="#555">IT_Support 控制 spn_svc</text>

  <text x="620" y="360" font-size="13" fill="#b71c1c" font-weight="bold">4. owns → dc</text>
  <text x="620" y="378" font-size="12" fill="#555">spn_svc 拥有 DC → 域管</text>

  <!-- 关系线 -->
  <path d="M 290 230 L 330 200" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr-b1)"/>
  <text x="310" y="222" font-size="11" fill="#c0392b">admin</text>

  <path d="M 540 190 L 590 220" stroke="#2980b9" stroke-width="2.5" fill="none" marker-end="url(#arr-b2)"/>
  <text x="560" y="215" font-size="11" fill="#2980b9">hasMembers</text>

  <path d="M 540 330 L 590 300" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arr-b3)"/>
  <text x="560" y="345" font-size="11" fill="#27ae60">kerberoastable</text>

  <path d="M 290 280 C 300 420, 480 450, 600 350" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-b1)"/>
  <text x="420" y="430" font-size="11" fill="#c0392b" text-anchor="middle">最短路径：4跳到达域管</text>

  <!-- 底部说明 -->
  <rect x="90" y="470" width="1040" height="70" rx="10" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="110" y="498" font-size="15" font-weight="bold" fill="#111">BloodHound 工作原理</text>
  <text x="110" y="520" font-size="13" fill="#333">SharpHound 采集 LDAP 关系 → 导入 Neo4j → 图数据库分析 → 输出最短攻击路径（用户→组→服务→域管）</text>
  <text x="110" y="540" font-size="12" fill="#555">核心价值：找到从低权限到域管的"最短路径"，而非暴力破解</text>
</svg>
