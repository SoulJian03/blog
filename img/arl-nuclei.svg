<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="500" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3182ce"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">ARL 与 Nuclei 联动：资产发现到漏洞验证</text>

  <rect x="40" y="60" width="150" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="115" y="92" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① subfinder</text>

  <line x1="190" y1="85" x2="225" y2="85" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="230" y="60" width="150" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="305" y="92" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② httpx</text>

  <line x1="380" y1="85" x2="415" y2="85" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="420" y="60" width="150" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="495" y="92" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ ARL</text>

  <line x1="570" y1="85" x2="605" y2="85" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="610" y="60" width="150" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="685" y="92" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ Nuclei</text>

  <line x1="760" y1="85" x2="795" y2="85" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="800" y="60" width="170" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="885" y="92" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ 漏洞验证</text>

  <rect x="40" y="140" width="460" height="330" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">ARL 自动发现资产</text>

  <text x="70" y="195" font-size="10" font-weight="bold" fill="#c53030">① 资产发现：</text>
  <text x="70" y="215" font-size="9" fill="#2d3748">subfinder -d example.com -o sub.txt</text>

  <text x="70" y="240" font-size="10" font-weight="bold" fill="#805ad5">② 存活检测：</text>
  <text x="70" y="260" font-size="9" fill="#2d3748">cat sub.txt | httpx -threads 200 -o alive.txt</text>

  <text x="70" y="285" font-size="10" font-weight="bold" fill="#dd6b20">③ ARL 导入：</text>
  <text x="70" y="305" font-size="9" fill="#2d3748">ARL 自动扫描存活资产</text>
  <text x="70" y="325" font-size="9" fill="#2d3748">自动识别端口/服务/指纹</text>

  <text x="70" y="350" font-size="10" font-weight="bold" fill="#3182ce">④ Nuclei 扫描：</text>
  <text x="70" y="370" font-size="9" fill="#2d3748">nuclei -l alive.txt -t cves/ -o nuclei.json</text>

  <text x="70" y="395" font-size="10" font-weight="bold" fill="#38a169">⑤ 漏洞验证：</text>
  <text x="70" y="415" font-size="9" fill="#2d3748">手工验证高危漏洞</text>
  <text x="70" y="435" font-size="9" fill="#2d3748">排除误报 · 确认 PoC</text>

  <text x="70" y="465" font-size="10" font-weight="bold" fill="#276749">ARL 特点：</text>
  <text x="70" y="475" font-size="9" fill="#2d3748">自动发现 · 指纹识别 · 资产归档</text>

  <rect x="520" y="140" width="440" height="330" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">Nuclei 命令实战</text>

  <text x="550" y="195" font-size="10" font-weight="bold" fill="#c53030">CVE 扫描：</text>
  <text x="550" y="215" font-size="9" fill="#2d3748">nuclei -u http://target -t cves/</text>

  <text x="550" y="240" font-size="10" font-weight="bold" fill="#805ad5">暴露面扫描：</text>
  <text x="550" y="260" font-size="9" fill="#2d3748">nuclei -u http://target -t exposures/</text>

  <text x="550" y="285" font-size="10" font-weight="bold" fill="#dd6b20">鉴权扫描：</text>
  <text x="550" y="305" font-size="9" fill="#2d3748">nuclei -u http://target -t auth/</text>

  <text x="550" y="330" font-size="10" font-weight="bold" fill="#3182ce">自定义规则：</text>
  <text x="550" y="350" font-size="9" fill="#2d3748">nuclei -u http://target -t myrule.yaml</text>

  <text x="550" y="375" font-size="10" font-weight="bold" fill="#38a169">批量扫描：</text>
  <text x="550" y="395" font-size="9" fill="#2d3748">nuclei -l targets.txt -t cves/ -j</text>

  <text x="550" y="420" font-size="10" font-weight="bold" fill="#276749">更新规则：</text>
  <text x="550" y="440" font-size="9" fill="#2d3748">nuclei -update-templates</text>
  <text x="550" y="460" font-size="9" fill="#2d3748">nuclei -update</text>
</svg>
