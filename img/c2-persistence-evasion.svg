<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr-c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2980b9"/>
    </marker>
    <marker id="arr-c3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#27ae60"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="#f8fafc" rx="10"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#111">C2 持久化与免杀组合流程图</text>
  <text x="40" y="64" font-size="14" fill="#666">上线 → 持久化 → 免杀对抗 → 横向推进 的完整链条</text>

  <rect x="40" y="100" width="220" height="80" rx="12" fill="#fee2e2" stroke="#c0392b" stroke-width="2.5"/>
  <text x="150" y="130" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🚀 C2 Beacon 上线</text>
  <text x="150" y="152" font-size="12" text-anchor="middle" fill="#555">msf / CS Beacon</text>
  <text x="150" y="170" font-size="12" text-anchor="middle" fill="#555">初始 shell</text>

  <path d="M 260 140 L 300 140" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr-c1)"/>

  <!-- 持久化层 -->
  <rect x="310" y="90" width="280" height="220" rx="12" fill="#dbeafe" stroke="#2980b9" stroke-width="2"/>
  <text x="450" y="120" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">📌 持久化层</text>
  <line x1="330" y1="130" x2="570" y2="130" stroke="#2980b9" stroke-width="1"/>

  <text x="330" y="155" font-size="13" font-weight="bold" fill="#c0392b">Windows</text>
  <text x="330" y="173" font-size="12" fill="#555">• 计划任务 schtasks /c</text>
  <text x="330" y="191" font-size="12" fill="#555">• 注册表 Run 键</text>
  <text x="330" y="209" font-size="12" fill="#555">• 服务 sc create</text>
  <text x="330" y="227" font-size="12" fill="#555">• WMI 事件订阅</text>
  <text x="330" y="245" font-size="12" fill="#555">• Scheduled Task 隐藏</text>

  <text x="330" y="270" font-size="13" font-weight="bold" fill="#27ae60">Linux</text>
  <text x="330" y="288" font-size="12" fill="#555">• crontab -e</text>
  <text x="330" y="306" font-size="12" fill="#555">• systemd service</text>
  <text x="330" y="324" font-size="12" fill="#555">• bashrc / profile</text>

  <path d="M 590 200 L 630 200" stroke="#2980b9" stroke-width="2.5" fill="none" marker-end="url(#arr-c2)"/>

  <!-- 免杀层 -->
  <rect x="640" y="90" width="280" height="220" rx="12" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="780" y="120" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🛡️ 免杀对抗层</text>
  <line x1="660" y1="130" x2="900" y2="130" stroke="#b45309" stroke-width="1"/>

  <text x="660" y="155" font-size="13" font-weight="bold" fill="#c0392b">1. 混淆/编码</text>
  <text x="660" y="173" font-size="12" fill="#555">shellcode 加密 / 混淆</text>

  <text x="660" y="198" font-size="13" font-weight="bold" fill="#2980b9">2. 进程注入</text>
  <text x="660" y="216" font-size="12" fill="#555">注入合法进程（explorer.exe）</text>

  <text x="660" y="241" font-size="13" font-weight="bold" fill="#27ae60">3. C2 协议</text>
  <text x="660" y="259" font-size="12" fill="#555">HTTPS / DNS / 代理 C2 流量</text>

  <text x="660" y="284" font-size="13" font-weight="bold" fill="#ad1457">4. 落地痕迹</text>
  <text x="660" y="302" font-size="12" fill="#555">无文件执行 / 注册表加载</text>

  <path d="M 920 200 L 960 200" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arr-c3)"/>

  <rect x="970" y="90" width="200" height="220" rx="12" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="1070" y="120" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🎯 组合策略</text>
  <line x1="990" y1="130" x2="1150" y2="130" stroke="#27ae60" stroke-width="1"/>
  <text x="990" y="160" font-size="13" font-weight="bold" fill="#c0392b">推荐组合：</text>
  <text x="990" y="182" font-size="12" fill="#555">① 持久化 + 进程注入</text>
  <text x="990" y="204" font-size="12" fill="#555">② 混淆 + 无文件执行</text>
  <text x="990" y="226" font-size="12" fill="#555">③ HTTPS C2 + 代理流量</text>
  <text x="990" y="248" font-size="12" fill="#555">④ 计划任务 + 服务双保底</text>
  <text x="990" y="270" font-size="12" fill="#555">⑤ 注册表 Run + WMI 备选</text>
  <text x="990" y="292" font-size="12" fill="#555">⑥ 多持久化点互为备份</text>

  <!-- 底部：检测与防御 -->
  <rect x="40" y="340" width="1130" height="190" rx="10" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="60" y="370" font-size="16" font-weight="bold" fill="#111">检测与防御</text>

  <text x="60" y="398" font-size="14" font-weight="bold" fill="#c0392b">检测</text>
  <text x="180" y="398" font-size="12" fill="#333">异常进程父子关系 / 注册表 Run 键变更 / 计划任务新建 / WMI 事件订阅 / 异常外联 / 内存特征</text>

  <text x="60" y="428" font-size="14" font-weight="bold" fill="#2980b9">防御</text>
  <text x="180" y="428" font-size="12" fill="#333">EDR（行为检测）/ ASR 规则（限制进程执行）/ 注册表审计 / 计划任务审计 / 网络隔离 / 最小权限</text>

  <text x="60" y="460" font-size="14" font-weight="bold" fill="#27ae60">最佳实践</text>
  <text x="180" y="460" font-size="12" fill="#333">多层持久化（至少2个独立路径）+ 免杀组合（混淆+进程注入+C2加密）+ 定时轮换（避免单点被发现后全线崩溃）</text>

  <text x="60" y="490" font-size="14" font-weight="bold" fill="#ad1457">报告写法</text>
  <text x="200" y="490" font-size="12" fill="#333">发现：已控主机通过注册表 Run 键持久化，配合进程注入 explorer.exe 逃避检测</text>
  <text x="60" y="512" font-size="12" fill="#555">影响：重启后仍能维持 C2 连接，长期潜伏难以发现</text>
  <text x="60" y="534" font-size="12" fill="#555">建议：启用 EDR + 注册表审计 + ASR 规则 + 最小权限</text>
</svg>
