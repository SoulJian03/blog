<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr-w5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="#f8fafc" rx="10"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#111">冰蝎 / 哥斯拉 WebShell 通信架构</text>
  <text x="40" y="64" font-size="14" fill="#666">加密流量 + 伪装 Content-Type → 绕过 WAF 检测</text>

  <rect x="30" y="160" width="200" height="100" rx="12" fill="#fee2e2" stroke="#c0392b" stroke-width="2.5"/>
  <text x="130" y="195" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🕵️ 攻击者</text>
  <text x="130" y="220" font-size="13" text-anchor="middle" fill="#555">冰蝎 / 哥斯拉客户端</text>

  <path d="M 230 210 L 270 210" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr-w5)"/>

  <rect x="280" y="120" width="280" height="180" rx="12" fill="#dbeafe" stroke="#2980b9" stroke-width="2.5"/>
  <text x="420" y="150" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🛡️ 流量加密层</text>
  <line x1="300" y1="160" x2="540" y2="160" stroke="#2980b9" stroke-width="1"/>

  <text x="300" y="188" font-size="13" font-weight="bold" fill="#c0392b">冰蝎</text>
  <text x="300" y="206" font-size="12" fill="#555">• AES-128-CBC 加密</text>
  <text x="300" y="224" font-size="12" fill="#555">• Base64 编码</text>
  <text x="300" y="242" font-size="12" fill="#555">• Cookie 传 key 或 自动协商</text>
  <text x="300" y="260" font-size="12" fill="#555">• 伪装 Content-Type</text>

  <text x="300" y="280" font-size="13" font-weight="bold" fill="#2980b9">哥斯拉</text>
  <text x="300" y="298" font-size="12" fill="#555">• AES/Rabbit/ChaCha20</text>
  <text x="300" y="316" font-size="12" fill="#555">• Base64/Hex/Plain</text>
  <text x="300" y="334" font-size="12" fill="#555">• 混淆载荷结构</text>

  <path d="M 560 210 L 600 210" stroke="#2980b9" stroke-width="2.5" fill="none" marker-end="url(#arr-w5)"/>

  <rect x="610" y="160" width="200" height="100" rx="12" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="710" y="195" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🖥️ Web 服务器</text>
  <text x="710" y="220" font-size="13" text-anchor="middle" fill="#555">加载 WebShell PHP/JSP</text>

  <path d="M 810 210 L 850 210" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arr-w5)"/>

  <rect x="860" y="160" width="300" height="100" rx="12" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="1010" y="195" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">💻 目标 OS（Linux / Windows）</text>
  <text x="1010" y="220" font-size="13" text-anchor="middle" fill="#555">执行命令 / 文件操作 / 反弹 Shell</text>

  <!-- 通信流程 -->
  <rect x="30" y="340" width="1130" height="200" rx="10" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="370" font-size="16" font-weight="bold" fill="#111">通信流程</text>

  <text x="50" y="400" font-size="13" font-weight="bold" fill="#c0392b">第1步：加载 WebShell</text>
  <text x="260" y="400" font-size="12" fill="#333">上传 .php/.jsp WebShell 文件到 Web 目录（如 /uploads/shell.php）</text>

  <text x="50" y="428" font-size="13" font-weight="bold" fill="#2980b9">第2步：客户端连接</text>
  <text x="260" y="428" font-size="12" fill="#333">冰蝎/哥斯拉填入 URL + 密码 → 自动协商加密密钥 → 建立会话</text>

  <text x="50" y="456" font-size="13" font-weight="bold" fill="#27ae60">第3步：加密通信</text>
  <text x="260" y="456" font-size="12" fill="#333">所有命令通过 AES 加密 → Base64 编码 → 放在 POST Body 中 → 伪装 Content-Type（如 text/xml）</text>

  <text x="50" y="484" font-size="13" font-weight="bold" fill="#b45309">第4步：执行与回传</text>
  <text x="260" y="484" font-size="12" fill="#333">WebShell 解密 → 执行系统命令 → 加密输出 → 回传 → 客户端解密显示</text>

  <text x="50" y="512" font-size="13" font-weight="bold" fill="#ad1457">第5步：功能</text>
  <text x="260" y="512" font-size="12" fill="#333">命令执行 / 文件管理器 / 数据库管理 / 反弹 Shell / 进程管理 / 计划任务</text>

  <text x="50" y="534" font-size="12" fill="#555">关键区别：普通 WebShell（菜刀）是明文传输 → 冰蝎/哥斯拉是加密传输，WAF 无法识别内容</text>
</svg>
