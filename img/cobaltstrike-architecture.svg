<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr-t1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="#f8fafc" rx="10"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#111">CobaltStrike 架构与 Beacon 通信</text>
  <text x="40" y="64" font-size="14" fill="#666">Teamserver → Listener → Beacon → 横向/隧道</text>

  <rect x="30" y="160" width="200" height="90" rx="12" fill="#fee2e2" stroke="#c0392b" stroke-width="2.5"/>
  <text x="130" y="190" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🖥️ 攻击者工作站</text>
  <text x="130" y="215" font-size="13" text-anchor="middle" fill="#555">CS Client（GUI）</text>

  <path d="M 230 205 L 270 205" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr-t1)"/>

  <rect x="280" y="100" width="260" height="220" rx="12" fill="#dbeafe" stroke="#2980b9" stroke-width="2.5"/>
  <text x="410" y="130" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🏛️ Teamserver（C2 服务器）</text>
  <line x1="300" y1="140" x2="540" y2="140" stroke="#2980b9" stroke-width="1"/>

  <text x="300" y="168" font-size="13" font-weight="bold" fill="#c0392b">Listener 配置</text>
  <text x="300" y="188" font-size="12" fill="#555">协议：HTTP/S/HTTPS/DNS/SMB</text>
  <text x="300" y="206" font-size="12" fill="#555">Host/URI 可自定义</text>
  <text x="300" y="224" font-size="12" fill="#555">C2 Profile 混淆</text>

  <text x="300" y="250" font-size="13" font-weight="bold" fill="#2980b9">Beacon 管理</text>
  <text x="300" y="270" font-size="12" fill="#555">Beacon 上线/心跳/任务分发</text>
  <text x="300" y="288" font-size="12" fill="#555">横向任务调度</text>

  <text x="300" y="310" font-size="13" font-weight="bold" fill="#27ae60">数据汇聚</text>
  <text x="300" y="328" font-size="12" fill="#555">Socks5 代理 / 文件下载</text>

  <path d="M 540 210 L 580 210" stroke="#2980b9" stroke-width="2.5" fill="none" marker-end="url(#arr-t1)"/>

  <rect x="590" y="160" width="200" height="90" rx="12" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="690" y="190" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🔑 Beacon 1（跳板）</text>
  <text x="690" y="215" font-size="13" text-anchor="middle" fill="#555">Windows/Meterpreter</text>
  <text x="690" y="233" font-size="12" text-anchor="middle" fill="#555">心跳 60s / 反向 HTTPS</text>

  <path d="M 790 205 L 830 205" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arr-t1)"/>

  <rect x="840" y="160" width="200" height="90" rx="12" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="940" y="190" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🔑 Beacon 2（内网）</text>
  <text x="940" y="215" font-size="13" text-anchor="middle" fill="#555">跳板1 横向得到</text>
  <text x="940" y="233" font-size="12" text-anchor="middle" fill="#555">Sleep 15s / DNS C2</text>

  <path d="M 1040 205 C 1080 205, 1080 205, 1070 205" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arr-t1)"/>

  <rect x="1080" y="160" width="90" height="90" rx="12" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
  <text x="1125" y="190" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">🎯 目标</text>
  <text x="1125" y="215" font-size="12" text-anchor="middle" fill="#555">DC/DB</text>

  <path d="M 370 320 C 370 380, 370 380, 370 400" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" fill="none"/>
  <text x="370" y="420" font-size="12" fill="#c0392b" text-anchor="middle">Client ← Teamserver（加密 RPC）</text>

  <rect x="30" y="360" width="1140" height="180" rx="10" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="390" font-size="16" font-weight="bold" fill="#111">Beacon 通信流程</text>

  <text x="50" y="420" font-size="13" font-weight="bold" fill="#c0392b">1. 上线</text>
  <text x="200" y="420" font-size="12" fill="#333">Beacon payload 执行 → 反向连接 Teamserver Listener → 注册到 Teamserver</text>

  <text x="50" y="448" font-size="13" font-weight="bold" fill="#2980b9">2. 心跳</text>
  <text x="200" y="448" font-size="12" fill="#333">Beacon 每 N 秒（如 60s）发一次心跳包，Teamserver 返回待执行任务</text>

  <text x="50" y="476" font-size="13" font-weight="bold" fill="#27ae60">3. 任务执行</text>
  <text x="200" y="476" font-size="12" fill="#333">Teamserver 分派任务（命令/下载/横向） → Beacon 执行 → 结果回传</text>

  <text x="50" y="504" font-size="13" font-weight="bold" fill="#b45309">4. 横向</text>
  <text x="200" y="504" font-size="12" fill="#333">Beacon 用 psexec/wmi 打同域其他机器 → 新 Beacon 上线（Beacon → Beacon）</text>
</svg>
