<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="460" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">Cobalt Strike Beacon 架构</text>

  <rect x="40" y="70" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="102" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">C2 Server</text>
  <text x="110" y="118" font-size="9" text-anchor="middle" fill="#c53030">TeamServer</text>

  <rect x="200" y="70" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="270" y="102" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">Beacon</text>
  <text x="270" y="118" font-size="9" text-anchor="middle" fill="#b7791f">内存马</text>

  <rect x="360" y="70" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="430" y="102" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">Listener</text>
  <text x="430" y="118" font-size="9" text-anchor="middle" fill="#805ad5">HTTP/SMB/DNS</text>

  <rect x="520" y="70" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="590" y="102" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">Payload</text>
  <text x="590" y="118" font-size="9" text-anchor="middle" fill="#38a169">stage/stager</text>

  <rect x="680" y="70" width="140" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="750" y="102" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">Socks5</text>
  <text x="750" y="118" font-size="9" text-anchor="middle" fill="#3182ce">内网代理</text>

  <rect x="840" y="70" width="120" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="900" y="102" font-size="11" text-anchor="middle" fill="#276749" font-weight="bold">Malleable</text>
  <text x="900" y="118" font-size="9" text-anchor="middle" fill="#276749">流量变形</text>

  <rect x="40" y="150" width="460" height="280" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">Beacon 常用命令</text>

  <text x="70" y="205" font-size="10" font-weight="bold" fill="#c53030">系统信息：</text>
  <text x="70" y="225" font-size="9" fill="#2d3748">sysinfo · getuid · getprivs</text>
  <text x="70" y="245" font-size="9" fill="#2d3748">getsystem · getprivs</text>

  <text x="70" y="275" font-size="10" font-weight="bold" fill="#805ad5">后渗透：</text>
  <text x="70" y="295" font-size="9" fill="#2d3748">runas · execute-assembly</text>
  <text x="70" y="315" font-size="9" fill="#2d3748">mimikatz · kiwi</text>

  <text x="70" y="345" font-size="10" font-weight="bold" fill="#dd6b20">网络代理：</text>
  <text x="70" y="365" font-size="9" fill="#2d3748">socks5 开启 SOCKS5 代理</text>
  <text x="70" y="385" font-size="9" fill="#2d3748">route 添加路由</text>

  <text x="70" y="415" font-size="10" font-weight="bold" fill="#3182ce">持久化：</text>
  <text x="70" y="435" font-size="9" fill="#2d3748">updater / launcher</text>
  <text x="70" y="455" font-size="9" fill="#2d3748">run 持久化脚本</text>

  <rect x="520" y="150" width="440" height="280" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">Beacon 类型</text>

  <text x="550" y="205" font-size="10" font-weight="bold" fill="#c53030">Beacon（S）：</text>
  <text x="550" y="225" font-size="9" fill="#2d3748">SMB Beacon · 横向移动</text>

  <text x="550" y="255" font-size="10" font-weight="bold" fill="#805ad5">Beacon（HTTP）：</text>
  <text x="550" y="275" font-size="9" fill="#2d3748">HTTP Beacon · 主流方式</text>
  <text x="550" y="295" font-size="9" fill="#2d3748">Malleable C2 流量变形</text>

  <text x="550" y="325" font-size="10" font-weight="bold" fill="#dd6b20">Beacon（DNS）：</text>
  <text x="550" y="345" font-size="9" fill="#2d3748">DNS Beacon · 隐蔽通信</text>
  <text x="550" y="365" font-size="9" fill="#2d3748">绕过简单防火墙</text>

  <text x="550" y="395" font-size="10" font-weight="bold" fill="#3182ce">防御：</text>
  <text x="550" y="415" font-size="9" fill="#2d3748">检测 Beacon 心跳频率</text>
  <text x="550" y="435" font-size="9" fill="#2d3748">EDR 检测内存加载行为</text>
  <text x="550" y="455" font-size="9" fill="#2d3748">DNS 监控异常域名</text>
</svg>
