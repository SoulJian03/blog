<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">OWASP Top 10 十大安全风险</text>

  <rect x="40" y="60" width="200" height="60" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="140" y="92" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">A01 访问控制失效</text>
  <text x="140" y="110" font-size="9" text-anchor="middle" fill="#c53030">Broken Access Control</text>

  <rect x="260" y="60" width="200" height="60" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="360" y="92" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">A02 加密机制失效</text>
  <text x="360" y="110" font-size="9" text-anchor="middle" fill="#b7791f">Cryptographic Failures</text>

  <rect x="480" y="60" width="200" height="60" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="580" y="92" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">A03 注入</text>
  <text x="580" y="110" font-size="9" text-anchor="middle" fill="#805ad5">Injection</text>

  <rect x="700" y="60" width="200" height="60" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="800" y="92" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">A04 不安全设计</text>
  <text x="800" y="110" font-size="9" text-anchor="middle" fill="#38a169">Insecure Design</text>

  <rect x="920" y="60" width="30" height="60" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="935" y="92" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">+</text>

  <rect x="40" y="140" width="460" height="310" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">OWASP Top 10（2021）</text>

  <text x="70" y="195" font-size="10" font-weight="bold" fill="#c53030">A01 访问控制失效：</text>
  <text x="70" y="215" font-size="9" fill="#2d3748">越权 · IDOR · 水平/垂直越权</text>

  <text x="70" y="245" font-size="10" font-weight="bold" fill="#805ad5">A02 加密机制失效：</text>
  <text x="70" y="265" font-size="9" fill="#2d3748">明文传输/存储敏感数据</text>

  <text x="70" y="295" font-size="10" font-weight="bold" fill="#dd6b20">A03 注入：</text>
  <text x="70" y="315" font-size="9" fill="#2d3748">SQL/命令/OGNL/SSRF 注入</text>

  <text x="70" y="345" font-size="10" font-weight="bold" fill="#3182ce">A04 不安全设计：</text>
  <text x="70" y="365" font-size="9" fill="#2d3748">缺少安全设计 · 逻辑漏洞</text>

  <text x="70" y="395" font-size="10" font-weight="bold" fill="#38a169">A05 安全配置错误：</text>
  <text x="70" y="415" font-size="9" fill="#2d3748">默认配置 · 调试模式</text>

  <text x="70" y="445" font-size="10" font-weight="bold" fill="#c53030">A06 易受攻击组件：</text>
  <text x="70" y="465" font-size="9" fill="#2d3748">第三方组件漏洞（Log4j2等）</text>

  <rect x="520" y="140" width="440" height="310" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">A07~A10</text>

  <text x="550" y="195" font-size="10" font-weight="bold" fill="#c53030">A07 身份验证失败：</text>
  <text x="550" y="215" font-size="9" fill="#2d3748">弱密码 · 暴力破解 · 会话劫持</text>

  <text x="550" y="245" font-size="10" font-weight="bold" fill="#805ad5">A08 软件和数据完整性：</text>
  <text x="550" y="265" font-size="9" fill="#2d3748">依赖混淆 · 未验证更新</text>

  <text x="550" y="295" font-size="10" font-weight="bold" fill="#dd6b20">A09 安全日志和监控：</text>
  <text x="550" y="315" font-size="9" fill="#2d3748">日志不足 · 无告警</text>

  <text x="550" y="345" font-size="10" font-weight="bold" fill="#3182ce">A10 服务端请求伪造：</text>
  <text x="550" y="365" font-size="9" fill="#2d3748">SSRF · 内网扫描</text>

  <text x="550" y="395" font-size="10" font-weight="bold" fill="#38a169">XSS / 反序列化 / CORS：</text>
  <text x="550" y="415" font-size="9" fill="#2d3748">归入 A03/A01/A02 大类</text>
  <text x="550" y="445" font-size="10" font-weight="bold" fill="#c53030">核心变化（2021 vs 2017）：</text>
  <text x="550" y="465" font-size="9" fill="#2d3748">注入类降第3 · 新增不安全设计</text>
</svg>
