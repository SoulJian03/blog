<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="520" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">OWASP Top 10 攻击分类全景</text>

  <rect x="30" y="55" width="150" height="55" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="105" y="78" font-size="10" text-anchor="middle" fill="#c53030" font-weight="bold">A01 访问控制</text>
  <text x="105" y="95" font-size="8" text-anchor="middle" fill="#c53030">IDOR/越权</text>

  <rect x="200" y="55" width="150" height="55" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="275" y="78" font-size="10" text-anchor="middle" fill="#b7791f" font-weight="bold">A02 加密失效</text>
  <text x="275" y="95" font-size="8" text-anchor="middle" fill="#b7791f">弱加密/明文传输</text>

  <rect x="370" y="55" width="150" height="55" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="445" y="78" font-size="10" text-anchor="middle" fill="#805ad5" font-weight="bold">A03 注入</text>
  <text x="445" y="95" font-size="8" text-anchor="middle" fill="#805ad5">SQL/XSS/命令</text>

  <rect x="540" y="55" width="150" height="55" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="615" y="78" font-size="10" text-anchor="middle" fill="#38a169" font-weight="bold">A04 不安全设计</text>
  <text x="615" y="95" font-size="8" text-anchor="middle" fill="#38a169">逻辑缺陷</text>

  <rect x="710" y="55" width="150" height="55" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="785" y="78" font-size="10" text-anchor="middle" fill="#3182ce" font-weight="bold">A05 安全配置错误</text>
  <text x="785" y="95" font-size="8" text-anchor="middle" fill="#3182ce">默认配置/调试开启</text>

  <rect x="880" y="55" width="90" height="55" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="925" y="78" font-size="10" text-anchor="middle" fill="#276749" font-weight="bold">A06 漏洞组件</text>
  <text x="925" y="95" font-size="8" text-anchor="middle" fill="#276749">CVE/NPM</text>

  <rect x="30" y="135" width="150" height="55" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="105" y="158" font-size="10" text-anchor="middle" fill="#822727" font-weight="bold">A07 身份验证失败</text>
  <text x="105" y="175" font-size="8" text-anchor="middle" fill="#822727">弱口令/MFA缺失</text>

  <rect x="200" y="135" width="150" height="55" rx="8" fill="#faf5ff" stroke="#805ad5" stroke-width="2"/>
  <text x="275" y="158" font-size="10" text-anchor="middle" fill="#44337a" font-weight="bold">A08 软件完整性</text>
  <text x="275" y="175" font-size="8" text-anchor="middle" fill="#44337a">CDN/NPM投毒</text>

  <rect x="370" y="135" width="150" height="55" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="2"/>
  <text x="445" y="158" font-size="10" text-anchor="middle" fill="#2b6cb0" font-weight="bold">A09 日志监控失败</text>
  <text x="445" y="175" font-size="8" text-anchor="middle" fill="#2b6cb0">审计缺失</text>

  <rect x="540" y="135" width="150" height="55" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="615" y="158" font-size="10" text-anchor="middle" fill="#276749" font-weight="bold">A10 Server-Side</text>
  <text x="615" y="175" font-size="8" text-anchor="middle" fill="#276749">Request Forgery</text>

  <rect x="710" y="135" width="260" height="55" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="840" y="158" font-size="10" text-anchor="middle" fill="#c53030" font-weight="bold">A11 服务端请求伪造</text>
  <text x="840" y="175" font-size="8" text-anchor="middle" fill="#c53030">SSRF/内网探测</text>

  <rect x="30" y="210" width="450" height="275" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="255" y="235" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">常见漏洞对应关系</text>

  <text x="60" y="265" font-size="10" font-weight="bold" fill="#c53030">A01 访问控制：</text>
  <text x="60" y="285" font-size="9" fill="#2d3748">越权访问(IDOR) · 未授权访问管理后台</text>

  <text x="60" y="310" font-size="10" font-weight="bold" fill="#805ad5">A03 注入：</text>
  <text x="60" y="330" font-size="9" fill="#2d3748">SQL注入 · XSS · 命令注入 · SSTI</text>

  <text x="60" y="355" font-size="10" font-weight="bold" fill="#3182ce">A05 配置错误：</text>
  <text x="60" y="375" font-size="9" fill="#2d3748">默认口令 · debug开启 · 目录列表</text>

  <text x="60" y="400" font-size="10" font-weight="bold" fill="#dd6b20">A06 漏洞组件：</text>
  <text x="60" y="420" font-size="9" fill="#2d3748">Spring/Fastjson/Log4j CVE · 老旧框架</text>

  <text x="60" y="445" font-size="10" font-weight="bold" fill="#38a169">A07 身份验证：</text>
  <text x="60" y="465" font-size="9" fill="#2d3748">弱口令 · 爆破 · 未启用 MFA</text>

  <text x="60" y="485" font-size="10" font-weight="bold" fill="#276749">A08 完整性：</text>
  <text x="60" y="490" font-size="9" fill="#2d3748">CI/CD投毒 · 供应链攻击</text>

  <rect x="510" y="210" width="460" height="275" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="235" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">防御优先级</text>

  <text x="540" y="265" font-size="10" font-weight="bold" fill="#c53030">P0 立即修复：</text>
  <text x="540" y="285" font-size="9" fill="#2d3748">SQL注入 · RCE · 文件上传 · 反序列化</text>

  <text x="540" y="310" font-size="10" font-weight="bold" fill="#805ad5">P1 本周修复：</text>
  <text x="540" y="330" font-size="9" fill="#2d3748">XSS · 越权 · 弱口令 · 未授权访问</text>

  <text x="540" y="355" font-size="10" font-weight="bold" fill="#dd6b20">P2 本月修复：</text>
  <text x="540" y="375" font-size="9" fill="#2d3748">CORS · CSRF · 敏感信息泄露</text>

  <text x="540" y="400" font-size="10" font-weight="bold" fill="#3182ce">P3 持续改进：</text>
  <text x="540" y="420" font-size="9" fill="#2d3748">日志监控 · 安全配置 · 组件升级</text>

  <text x="540" y="445" font-size="10" font-weight="bold" fill="#38a169">长期建设：</text>
  <text x="540" y="465" font-size="9" fill="#2d3748">SDL安全开发生命周期 · 威胁建模</text>
  <text x="540" y="485" font-size="9" fill="#2d3748">自动化扫描 + 人工代码审计</text>
</svg>
