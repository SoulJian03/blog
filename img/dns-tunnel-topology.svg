<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr-d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="520" fill="#f8fafc" rx="10"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#111">DNS 隧道拓扑图</text>
  <text x="40" y="64" font-size="14" fill="#666">利用 DNS 查询/响应通道建立隐蔽数据传输隧道</text>

  <line x1="500" y1="80" x2="500" y2="420" stroke="#b0b0b0" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="400" y="98" font-size="14" font-weight="bold" fill="#555">公网 / 攻击侧</text>
  <text x="570" y="98" font-size="14" font-weight="bold" fill="#555">内网 / 目标侧</text>

  <rect x="30" y="150" width="200" height="100" rx="12" fill="#fee2e2" stroke="#c0392b" stroke-width="2.5"/>
  <text x="130" y="185" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">🖥️ DNS 隧道服务端</text>
  <text x="130" y="210" font-size="13" text-anchor="middle" fill="#555">dnstunnel / iodine</text>
  <text x="130" y="228" font-size="12" text-anchor="middle" fill="#555">域名: tunnel.example.com</text>

  <rect x="540" y="150" width="200" height="100" rx="12" fill="#dbeafe" stroke="#2980b9" stroke-width="2.5"/>
  <text x="640" y="185" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">🔑 内网 DNS 客户端</text>
  <text x="640" y="210" font-size="13" text-anchor="middle" fill="#555">dnstunnel / iodine</text>
  <text x="640" y="228" font-size="12" text-anchor="middle" fill="#555">DNS 查询 → 隧道数据</text>

  <rect x="790" y="150" width="180" height="100" rx="12" fill="#fef9c3" stroke="#b45309" stroke-width="2.5"/>
  <text x="880" y="185" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">🏛️ 企业 DNS 服务器</text>
  <text x="880" y="210" font-size="13" text-anchor="middle" fill="#555">允许 DNS 出站</text>
  <text x="880" y="228" font-size="12" text-anchor="middle" fill="#555">端口 53 UDP</text>

  <path d="M 230 200 L 530 200" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#arr-d1)"/>
  <text x="380" y="185" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">DNS TXT/A 记录（隧道数据）</text>

  <path d="M 740 200 L 780 200" stroke="#2980b9" stroke-width="3" fill="none" marker-end="url(#arr-d1)"/>
  <text x="760" y="185" font-size="12" fill="#2980b9" text-anchor="middle">DNS 查询</text>

  <path d="M 230 230 C 300 350, 450 370, 530 230" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-d1)"/>
  <text x="380" y="380" font-size="12" fill="#c0392b" text-anchor="middle">DNS 响应 → 隧道数据回流</text>

  <rect x="30" y="310" width="1140" height="180" rx="10" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="340" font-size="16" font-weight="bold" fill="#111">DNS 隧道原理</text>
  <text x="50" y="370" font-size="14" fill="#333">1. 数据编码：把需要传输的数据用 base32/base64 编码成 DNS 合法字符</text>
  <text x="50" y="392" font-size="14" fill="#333">2. 封装查询：编码数据作为子域名发出，如 data123.tunnel.example.com</text>
  <text x="50" y="414" font-size="14" fill="#333">3. DNS 服务器接收：正常 DNS 服务器转发该查询到隧道服务端</text>
  <text x="50" y="436" font-size="14" fill="#333">4. 服务端解码：隧道服务端从 DNS 查询中提取数据，原样传回</text>
  <text x="50" y="458" font-size="14" fill="#333">5. 响应回传：通过 DNS TXT 记录或 CNAME 记录返回数据</text>

  <text x="50" y="480" font-size="14" font-weight="bold" fill="#c0392b">为什么能绕过防火墙？</text>
  <text x="280" y="480" font-size="13" fill="#333">企业防火墙通常允许 DNS 出站（53 端口），很少深度检测 DNS 内容</text>
  <text x="280" y="500" font-size="13" fill="#555">DNS 隧道流量看起来和正常 DNS 查询一样，没有明显异常特征</text>
</svg>
