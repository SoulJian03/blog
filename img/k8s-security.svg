<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">Docker 与 Kubernetes 安全</text>

  <rect x="40" y="70" width="180" height="60" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="130" y="102" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">容器逃逸</text>
  <text x="130" y="120" font-size="9" text-anchor="middle" fill="#c53030">Docker Socket / 特权容器</text>

  <rect x="240" y="70" width="180" height="60" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="330" y="102" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">镜像安全</text>
  <text x="330" y="120" font-size="9" text-anchor="middle" fill="#b7791f">Base Image / CVE</text>

  <rect x="440" y="70" width="180" height="60" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="530" y="102" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">K8s API 滥用</text>
  <text x="530" y="120" font-size="9" text-anchor="middle" fill="#805ad5">未授权 API Server</text>

  <rect x="640" y="70" width="180" height="60" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="730" y="102" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">配置错误</text>
  <text x="730" y="120" font-size="9" text-anchor="middle" fill="#38a169">HostNetwork / Privileged</text>

  <rect x="840" y="70" width="120" height="60" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="900" y="102" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">CIS 加固</text>

  <rect x="40" y="155" width="460" height="300" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">Docker 逃逸方式</text>

  <text x="70" y="210" font-size="10" font-weight="bold" fill="#c53030">Docker Socket 挂载：</text>
  <text x="70" y="230" font-size="9" fill="#2d3748">/var/run/docker.sock 挂载 → root</text>
  <text x="70" y="250" font-size="9" fill="#2d3748">docker run -v /:/host alpine chroot /host</text>

  <text x="70" y="280" font-size="10" font-weight="bold" fill="#805ad5">特权容器：</text>
  <text x="70" y="300" font-size="9" fill="#2d3748">--privileged + --net=host</text>
  <text x="70" y="320" font-size="9" fill="#2d3748">可直接控制宿主机</text>

  <text x="70" y="350" font-size="10" font-weight="bold" fill="#dd6b20">宿主机目录挂载：</text>
  <text x="70" y="370" font-size="9" fill="#2d3748">-v /:/host → 读写宿主机文件</text>

  <text x="70" y="400" font-size="10" font-weight="bold" fill="#3182ce">内核漏洞：</text>
  <text x="70" y="420" font-size="9" fill="#2d3748">Dirty Cow / Dirty Pipe 逃逸</text>

  <text x="70" y="450" font-size="10" font-weight="bold" fill="#38a169">K8s API 未授权：</text>
  <text x="70" y="465" font-size="9" fill="#2d3748">kube-apiserver 暴露公网 → kubectl 操作集群</text>

  <rect x="520" y="155" width="440" height="300" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">防御加固</text>

  <text x="550" y="210" font-size="10" font-weight="bold" fill="#c53030">镜像安全：</text>
  <text x="550" y="230" font-size="9" fill="#2d3748">使用官方基础镜像 · 定期更新</text>
  <text x="550" y="250" font-size="9" fill="#2d3748">Trivy/Grype 扫描镜像 CVE</text>

  <text x="550" y="280" font-size="10" font-weight="bold" fill="#805ad5">容器配置：</text>
  <text x="550" y="300" font-size="9" fill="#2d3748">禁止 --privileged · 不挂载 /</text>
  <text x="550" y="320" font-size="9" fill="#2d3748">使用非 root 用户运行容器</text>

  <text x="550" y="350" font-size="10" font-weight="bold" fill="#dd6b20">K8s 安全：</text>
  <text x="550" y="370" font-size="9" fill="#2d3748">RBAC 最小权限 · 网络策略</text>
  <text x="550" y="390" font-size="9" fill="#2d3748">Pod Security Policy · Admission Webhook</text>

  <text x="550" y="420" font-size="10" font-weight="bold" fill="#3182ce">CIS 基准：</text>
  <text x="550" y="440" font-size="9" fill="#2d3748">遵循 Docker/K8s CIS 加固基准</text>
</svg>
