<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="520" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">Kubernetes 安全架构与常见攻击面</text>

  <rect x="40" y="60" width="220" height="70" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="150" y="88" font-size="12" text-anchor="middle" fill="#2a4365" font-weight="bold">APIServer</text>
  <text x="150" y="108" font-size="9" text-anchor="middle" fill="#2d3748">API 入口 · RBAC 控制</text>

  <rect x="340" y="60" width="220" height="70" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="450" y="88" font-size="12" text-anchor="middle" fill="#44337a" font-weight="bold">Scheduler</text>
  <text x="450" y="108" font-size="9" text-anchor="middle" fill="#2d3748">调度器 · 资源分配</text>

  <rect x="640" y="60" width="220" height="70" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="750" y="88" font-size="12" text-anchor="middle" fill="#744210" font-weight="bold">Controller Manager</text>
  <text x="750" y="108" font-size="9" text-anchor="middle" fill="#2d3748">控制器 · Pod 管理</text>

  <rect x="40" y="160" width="220" height="70" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="150" y="188" font-size="12" text-anchor="middle" fill="#22543d" font-weight="bold">kubelet</text>
  <text x="150" y="208" font-size="9" text-anchor="middle" fill="#2d3748">节点代理 · 容器管理</text>

  <rect x="340" y="160" width="220" height="70" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="450" y="188" font-size="12" text-anchor="middle" fill="#c53030" font-weight="bold">Kube-Proxy</text>
  <text x="450" y="208" font-size="9" text-anchor="middle" fill="#2d3748">网络代理 · 服务发现</text>

  <rect x="640" y="160" width="220" height="70" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="750" y="188" font-size="12" text-anchor="middle" fill="#276749" font-weight="bold">etcd</text>
  <text x="750" y="208" font-size="9" text-anchor="middle" fill="#2d3748">集群状态存储</text>

  <line x1="150" y1="130" x2="150" y2="158" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="450" y1="130" x2="450" y2="158" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="750" y1="130" x2="750" y2="158" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="40" y="260" width="930" height="70" rx="12" fill="#ebf8ff" stroke="#4299e1" stroke-width="2"/>
  <text x="500" y="290" font-size="12" text-anchor="middle" fill="#2b6cb0" font-weight="bold">Worker Nodes (工作节点)</text>
  <text x="500" y="312" font-size="10" text-anchor="middle" fill="#2d3748">Pod · Container · Service · Ingress</text>

  <line x1="150" y1="230" x2="150" y2="258" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="450" y1="230" x2="450" y2="258" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="40" y="350" width="450" height="140" rx="12" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
  <text x="265" y="375" font-size="12" text-anchor="middle" fill="#7b341e" font-weight="bold">常见攻击面</text>
  <text x="70" y="402" font-size="10" fill="#2d3748">• APIServer 未授权 / 弱认证</text>
  <text x="70" y="425" font-size="10" fill="#2d3748">• etcd 未加密 / 匿名访问</text>
  <text x="70" y="448" font-size="10" fill="#2d3748">• Pod 逃逸 (特权容器)</text>
  <text x="70" y="471" font-size="10" fill="#2d3748">• 镜像漏洞 / 供应链攻击</text>

  <rect x="510" y="350" width="460" height="140" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="375" font-size="12" text-anchor="middle" fill="#276749" font-weight="bold">加固要点</text>
  <text x="540" y="402" font-size="10" fill="#2d3748">• APIServer RBAC 最小权限</text>
  <text x="540" y="425" font-size="10" fill="#2d3748">• etcd 加密 + 访问控制</text>
  <text x="540" y="448" font-size="10" fill="#2d3748">• Pod Security Standards (受限模式)</text>
  <text x="540" y="471" font-size="10" fill="#2d3748">• 镜像扫描 + 供应链签名验证</text>
</svg>
