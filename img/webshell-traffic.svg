<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">WebShell 工具流量特征对比</text>

  <rect x="30" y="60" width="220" height="60" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="140" y="95" font-size="12" text-anchor="middle" fill="#2a4365" font-weight="bold">菜刀 / WebShell 工具</text>
  <text x="140" y="112" font-size="9" text-anchor="middle" fill="#2d3748">明文 Base64</text>

  <rect x="290" y="60" width="220" height="60" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="400" y="95" font-size="12" text-anchor="middle" fill="#44337a" font-weight="bold">蚁剑 AntSword</text>
  <text x="400" y="112" font-size="9" text-anchor="middle" fill="#2d3748">Base64 + 自定义头</text>

  <rect x="550" y="60" width="200" height="60" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="650" y="95" font-size="12" text-anchor="middle" fill="#c53030" font-weight="bold">哥斯拉 Godzilla</text>
  <text x="650" y="112" font-size="9" text-anchor="middle" fill="#2d3748">AES/Rabbit Stream</text>

  <rect x="780" y="60" width="190" height="60" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="875" y="95" font-size="12" text-anchor="middle" fill="#22543d" font-weight="bold">冰蝎 Beholder</text>
  <text x="875" y="112" font-size="9" text-anchor="middle" fill="#2d3748">AES + HTTPS 模拟</text>

  <rect x="30" y="145" width="220" height="300" rx="12" fill="#ebf8ff" stroke="#4299e1" stroke-width="2"/>
  <text x="140" y="170" font-size="11" text-anchor="middle" fill="#2b6cb0" font-weight="bold">菜刀</text>
  <text x="60" y="195" font-size="9" fill="#2d3748">编码: Base64</text>
  <text x="60" y="215" font-size="9" fill="#2d3748">Header: 无特殊头</text>
  <text x="60" y="235" font-size="9" fill="#2d3748">UA: Mozilla/5.0</text>
  <text x="60" y="255" font-size="9" fill="#2d3748">Post: &lt;base64&gt;</text>
  <text x="60" y="280" font-size="9" font-weight="bold" fill="#c53030">检测:</text>
  <text x="60" y="300" font-size="9" fill="#2d3748">① 长 Base64 无规律</text>
  <text x="60" y="320" font-size="9" fill="#2d3748">② eval() 请求模式</text>
  <text x="60" y="340" font-size="9" fill="#2d3748">③ User-Agent 异常</text>
  <text x="60" y="365" font-size="9" font-weight="bold" fill="#48bb78">流量:</text>
  <text x="60" y="385" font-size="9" fill="#2d3748">短连接 · 单次命令</text>
  <text x="60" y="405" font-size="9" fill="#2d3748">流量模式: 明文可识别</text>
  <text x="60" y="430" font-size="9" fill="#2d3748">WAF 规则命中率高</text>

  <rect x="290" y="145" width="220" height="300" rx="12" fill="#faf5ff" stroke="#805ad5" stroke-width="2"/>
  <text x="400" y="170" font-size="11" text-anchor="middle" fill="#44337a" font-weight="bold">蚁剑</text>
  <text x="320" y="195" font-size="9" fill="#2d3748">编码: Base64</text>
  <text x="320" y="215" font-size="9" fill="#2d3748">Header: User-Agent 特殊</text>
  <text x="320" y="235" font-size="9" fill="#2d3748">Post: 随机 key 混淆</text>
  <text x="320" y="255" font-size="9" fill="#2d3748">支持插件/扩展</text>
  <text x="320" y="280" font-size="9" font-weight="bold" fill="#c53030">检测:</text>
  <text x="320" y="300" font-size="9" fill="#2d3748">① 自定义 POST 键名</text>
  <text x="320" y="320" font-size="9" fill="#2d3748">② 高频心跳包</text>
  <text x="320" y="340" font-size="9" fill="#2d3748">③ 文件管理特征</text>
  <text x="320" y="365" font-size="9" font-weight="bold" fill="#48bb78">流量:</text>
  <text x="320" y="385" font-size="9" fill="#2d3748">短连接 · 随机 key</text>
  <text x="320" y="405" font-size="9" fill="#2d3748">流量模式: 易混淆</text>
  <text x="320" y="430" font-size="9" fill="#2d3748">需行为分析配合</text>

  <rect x="550" y="145" width="200" height="300" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="650" y="170" font-size="11" text-anchor="middle" fill="#822727" font-weight="bold">哥斯拉</text>
  <text x="580" y="195" font-size="9" fill="#2d3748">编码: AES/Rabbit</text>
  <text x="580" y="215" font-size="9" fill="#2d3748">Header: 模拟真实 UA</text>
  <text x="580" y="235" font-size="9" fill="#2d3748">Post: Stream 加密</text>
  <text x="580" y="255" font-size="9" fill="#2d3748">支持 PHP/ASP/JSP</text>
  <text x="580" y="280" font-size="9" font-weight="bold" fill="#c53030">检测:</text>
  <text x="580" y="300" font-size="9" fill="#2d3748">① Cookie 含 AES key</text>
  <text x="580" y="320" font-size="9" fill="#2d3748">② 固定密钥模式</text>
  <text x="580" y="340" font-size="9" fill="#2d3748">③ Stream 流量特征</text>
  <text x="580" y="365" font-size="9" font-weight="bold" fill="#48bb78">流量:</text>
  <text x="580" y="385" font-size="9" fill="#2d3748">加密流量 · 类似 HTTPS</text>
  <text x="580" y="405" font-size="9" fill="#2d3748">WAF 难以检测</text>
  <text x="580" y="430" font-size="9" fill="#2d3748">需 EDR + 文件检测</text>

  <rect x="780" y="145" width="190" height="300" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="875" y="170" font-size="11" text-anchor="middle" fill="#276749" font-weight="bold">冰蝎</text>
  <text x="805" y="195" font-size="9" fill="#2d3748">编码: AES GCM</text>
  <text x="805" y="215" font-size="9" fill="#2d3748">Header: 模拟 HTTP/2</text>
  <text x="805" y="235" font-size="9" fill="#2d3748">Post: AES 加密</text>
  <text x="805" y="255" font-size="9" fill="#2d3748">HTTPS 通道支持</text>
  <text x="805" y="280" font-size="9" font-weight="bold" fill="#c53030">检测:</text>
  <text x="805" y="300" font-size="9" fill="#2d3748">① 无规律密文 POST</text>
  <text x="805" y="320" font-size="9" fill="#2d3748">② 心跳包频率</text>
  <text x="805" y="340" font-size="9" fill="#2d3748">③ 命令执行痕迹</text>
  <text x="805" y="365" font-size="9" font-weight="bold" fill="#48bb78">流量:</text>
  <text x="805" y="385" font-size="9" fill="#2d3748">强加密 · 极难识别</text>
  <text x="805" y="405" font-size="9" fill="#2d3748">流量模式: 类 HTTPS</text>
  <text x="805" y="430" font-size="9" fill="#2d3748">需全量检测 + 文件</text>
</svg>
