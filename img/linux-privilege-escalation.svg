<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr-l1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-l2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2980b9"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="#f8fafc" rx="10"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#111">Linux 提权决策树</text>
  <text x="40" y="64" font-size="14" fill="#666">从 shell 到手提权到 root 的完整决策路径</text>

  <rect x="40" y="100" width="1120" height="50" rx="10" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="600" y="130" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🚀 获取初始 Shell（www-data / nobody 等低权限用户）</text>

  <path d="M 600 150 L 600 175" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arr-l1)"/>

  <!-- 分支1: SUID 文件 -->
  <rect x="30" y="200" width="260" height="90" rx="10" fill="#fee2e2" stroke="#c0392b" stroke-width="2"/>
  <text x="160" y="228" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">① 检查 SUID 文件</text>
  <text x="160" y="252" font-size="12" text-anchor="middle" fill="#555">find / -perm -4000 -type f</text>
  <text x="160" y="272" font-size="12" text-anchor="middle" fill="#555">vim/nmap/find/bash 提权</text>

  <path d="M 290 245 L 330 245" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr-l1)"/>
  <rect x="340" y="215" width="220" height="60" rx="8" fill="#ffeaa7" stroke="#b45309" stroke-width="1.5"/>
  <text x="450" y="240" font-size="13" text-anchor="middle" fill="#111" font-weight="bold">SUID 提权成功</text>
  <text x="450" y="260" font-size="11" text-anchor="middle" fill="#555">/usr/bin/vim.tiny → root shell</text>

  <path d="M 290 265 C 250 320, 250 420, 290 420" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-l1)"/>
  <text x="150" y="340" font-size="11" fill="#c0392b" text-anchor="middle">找不到 SUID →</text>

  <!-- 分支2: Sudo 权限 -->
  <rect x="580" y="200" width="260" height="90" rx="10" fill="#dbeafe" stroke="#2980b9" stroke-width="2"/>
  <text x="710" y="228" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">② 检查 sudo 权限</text>
  <text x="710" y="252" font-size="12" text-anchor="middle" fill="#555">sudo -l</text>
  <text x="710" y="272" font-size="12" text-anchor="middle" fill="#555">NOPASSWD find/vim/python 提权</text>

  <path d="M 840 245 L 880 245" stroke="#2980b9" stroke-width="2.5" fill="none" marker-end="url(#arr-l2)"/>
  <rect x="890" y="215" width="220" height="60" rx="8" fill="#ffeaa7" stroke="#b45309" stroke-width="1.5"/>
  <text x="1000" y="240" font-size="13" text-anchor="middle" fill="#111" font-weight="bold">sudo 提权成功</text>
  <text x="1000" y="260" font-size="11" text-anchor="middle" fill="#555">sudo python3 -c 'import...os' → root</text>

  <path d="M 580 265 C 550 320, 550 420, 580 420" stroke="#2980b9" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-l2)"/>
  <text x="700" y="340" font-size="11" fill="#2980b9" text-anchor="middle">没有 sudo →</text>

  <!-- 分支3: 内核漏洞 -->
  <rect x="30" y="410" width="530" height="80" rx="10" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="300" y="438" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">③ 内核版本提权（CVE 利用）</text>
  <text x="300" y="462" font-size="12" text-anchor="middle" fill="#555">uname -a → 查已知 CVE（如 dirty_cow CVE-2016-5195、overlayfs）</text>

  <path d="M 560 450 L 600 450" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arr-l2)"/>
  <rect x="610" y="415" width="220" height="70" rx="8" fill="#ffeaa7" stroke="#b45309" stroke-width="1.5"/>
  <text x="720" y="440" font-size="13" text-anchor="middle" fill="#111" font-weight="bold">内核漏洞提权成功</text>
  <text x="720" y="462" font-size="11" text-anchor="middle" fill="#555">编译 exploit → 执行 → root</text>

  <path d="M 830 450 C 900 450, 950 450, 980 450" stroke="#b45309" stroke-width="2.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-l2)"/>
  <rect x="990" y="415" width="180" height="70" rx="8" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/>
  <text x="1080" y="440" font-size="13" text-anchor="middle" fill="#111" font-weight="bold">④ 其他</text>
  <text x="1080" y="462" font-size="11" text-anchor="middle" fill="#555">cron 计划任务 / 文件权限</text>

  <path d="M 720 485 C 720 510, 720 510, 720 530" stroke="#27ae60" stroke-width="2" fill="none"/>
  <text x="720" y="548" font-size="14" text-anchor="middle" fill="#27ae60" font-weight="bold">🎯 提权成功 → root</text>
</svg>
