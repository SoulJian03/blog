<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c53030"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">nmap 端口扫描全流程</text>

  <rect x="40" y="60" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="92" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① host 发现</text>
  <text x="110" y="108" font-size="9" text-anchor="middle" fill="#c53030">-sn / -Pn</text>

  <line x1="180" y1="85" x2="215" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="220" y="60" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="290" y="92" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② SYN 扫描</text>
  <text x="290" y="108" font-size="9" text-anchor="middle" fill="#b7791f">-sS（半开）</text>

  <line x1="360" y1="85" x2="395" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="400" y="60" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="470" y="92" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 服务指纹</text>
  <text x="470" y="108" font-size="9" text-anchor="middle" fill="#805ad5">-sV（版本）</text>

  <line x1="540" y1="85" x2="575" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="580" y="60" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="650" y="92" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ OS 探测</text>
  <text x="650" y="108" font-size="9" text-anchor="middle" fill="#38a169">-O</text>

  <line x1="720" y1="85" x2="755" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="760" y="60" width="140" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="830" y="92" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ NSE 脚本</text>
  <text x="830" y="108" font-size="9" text-anchor="middle" fill="#3182ce">--script=vuln</text>

  <rect x="40" y="140" width="450" height="310" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="265" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">nmap 常用命令</text>

  <text x="70" y="195" font-size="10" font-weight="bold" fill="#c53030">快速扫描：</text>
  <text x="70" y="215" font-size="9" fill="#2d3748">nmap -sS -T4 target</text>

  <text x="70" y="240" font-size="10" font-weight="bold" fill="#805ad5">全端口扫描：</text>
  <text x="70" y="260" font-size="9" fill="#2d3748">nmap -sS -p- target</text>

  <text x="70" y="285" font-size="10" font-weight="bold" fill="#dd6b20">服务+OS检测：</text>
  <text x="70" y="305" font-size="9" fill="#2d3748">nmap -sS -sV -O target</text>

  <text x="70" y="330" font-size="10" font-weight="bold" fill="#3182ce">Vuln 脚本：</text>
  <text x="70" y="350" font-size="9" fill="#2d3748">nmap --script=vuln target</text>

  <text x="70" y="375" font-size="10" font-weight="bold" fill="#38a169">存活主机：</text>
  <text x="70" y="395" font-size="9" fill="#2d3748">nmap -sn 192.168.1.0/24</text>

  <text x="70" y="420" font-size="10" font-weight="bold" fill="#276749">UDP 扫描：</text>
  <text x="70" y="440" font-size="9" fill="#2d3748">nmap -sU -p 53,67,68,69,123 target</text>

  <text x="70" y="465" font-size="10" font-weight="bold" fill="#c53030">输出保存：</text>
  <text x="70" y="475" font-size="9" fill="#2d3748">nmap -oA nmap_report target</text>

  <rect x="510" y="140" width="460" height="310" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">扫描技术对比</text>

  <text x="540" y="195" font-size="10" font-weight="bold" fill="#c53030">-sS SYN 扫描：</text>
  <text x="540" y="215" font-size="9" fill="#2d3748">半开扫描 · 最常用 · 速度快</text>
  <text x="540" y="235" font-size="9" fill="#2d3748">不建立完整连接 · 隐蔽性较好</text>

  <text x="540" y="260" font-size="10" font-weight="bold" fill="#805ad5">-sT TCP 扫描：</text>
  <text x="540" y="280" font-size="9" fill="#2d3748">完整 TCP 连接 · 最稳定</text>
  <text x="540" y="300" font-size="9" fill="#2d3748">容易被 IDS 检测</text>

  <text x="540" y="325" font-size="10" font-weight="bold" fill="#dd6b20">-sU UDP 扫描：</text>
  <text x="540" y="345" font-size="9" fill="#2d3748">扫描 UDP 服务（DNS/DHCP/SNMP）</text>
  <text x="540" y="365" font-size="9" fill="#2d3748">速度慢 · 需指定端口</text>

  <text x="540" y="390" font-size="10" font-weight="bold" fill="#3182ce">-sF/-sX/-sN：</text>
  <text x="540" y="410" font-size="9" fill="#2d3748">FIN/XMAS/NULL 扫描 · 绕过简单防火墙</text>

  <text x="540" y="435" font-size="10" font-weight="bold" fill="#38a169">NSE 脚本：</text>
  <text x="540" y="455" font-size="9" fill="#2d3748">--script=vuln（漏洞扫描）</text>
  <text x="540" y="475" font-size="9" fill="#2d3748">--script=http-enum（目录枚举）</text>
</svg>
