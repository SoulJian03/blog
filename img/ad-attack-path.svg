<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="400" fill="#f8fafc" rx="10"/>
  <text x="20" y="36" font-size="20" font-weight="bold" fill="#111">域渗透攻击路径</text>

  <rect x="20" y="120" width="150" height="110" rx="10" fill="#fee2e2" stroke="#333" stroke-width="2"/>
  <text x="95" y="160" font-size="16" text-anchor="middle" fill="#111">普通域用户</text>
  <text x="95" y="186" font-size="12" text-anchor="middle" fill="#666">拿到一台域内主机</text>

  <rect x="210" y="120" width="160" height="110" rx="10" fill="#dbeafe" stroke="#333" stroke-width="2"/>
  <text x="290" y="160" font-size="16" text-anchor="middle" fill="#111">信息收集</text>
  <text x="290" y="186" font-size="12" text-anchor="middle" fill="#666">BloodHound / 域信息</text>
  <text x="290" y="206" font-size="12" text-anchor="middle" fill="#666">找攻击路径</text>

  <rect x="410" y="120" width="170" height="110" rx="10" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="495" y="160" font-size="16" text-anchor="middle" fill="#b45309" font-weight="bold">拿服务账号/密码</text>
  <text x="495" y="186" font-size="12" text-anchor="middle" fill="#666">Kerberoasting</text>
  <text x="495" y="204" font-size="12" text-anchor="middle" fill="#666">AS-REP / 密码喷洒</text>

  <rect x="620" y="120" width="150" height="110" rx="10" fill="#dbeafe" stroke="#333" stroke-width="2"/>
  <text x="695" y="160" font-size="16" text-anchor="middle" fill="#111">横向 / 提权</text>
  <text x="695" y="186" font-size="12" text-anchor="middle" fill="#666">PtH / PtT</text>

  <rect x="800" y="120" width="85" height="110" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="3"/>
  <text x="842" y="160" font-size="15" text-anchor="middle" fill="#7e22ce" font-weight="bold">域管/域控</text>
  <text x="842" y="186" font-size="11" text-anchor="middle" fill="#666">黄金票据</text>
  <text x="842" y="202" font-size="11" text-anchor="middle" fill="#666">DCSync</text>

  <line x1="170" y1="175" x2="205" y2="175" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="370" y1="175" x2="405" y2="175" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="580" y1="175" x2="615" y2="175" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="770" y1="175" x2="795" y2="175" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>

  <text x="188" y="155" font-size="12" fill="#666" text-anchor="middle">1</text>
  <text x="388" y="155" font-size="12" fill="#666" text-anchor="middle">2</text>
  <text x="598" y="155" font-size="12" fill="#666" text-anchor="middle">3</text>
  <text x="783" y="155" font-size="12" fill="#666" text-anchor="middle">4</text>

  <text x="20" y="290" font-size="14" fill="#333" font-weight="bold">关键手法：</text>
  <text x="20" y="316" font-size="13" fill="#666">BloodHound 找最短路径 → Kerberoasting/AS-REP 离线破解服务账号 → PtH/PtT 横向 → 黄金票据/DCSync 直取域管</text>
  <text x="20" y="342" font-size="13" fill="#666">防御：服务账号强密码+轮换、限制复制权限、监控 4769/4662 事件、保护 krbtgt</text>
</svg>
