<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">API 安全测试核心检查点</text>

  <rect x="40" y="70" width="180" height="60" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="130" y="102" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">认证</text>
  <text x="130" y="120" font-size="9" text-anchor="middle" fill="#c53030">Token / JWT</text>

  <rect x="240" y="70" width="180" height="60" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="330" y="102" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">授权</text>
  <text x="330" y="120" font-size="9" text-anchor="middle" fill="#b7791f">RBAC / 权限</text>

  <rect x="440" y="70" width="180" height="60" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="530" y="102" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">输入验证</text>
  <text x="530" y="120" font-size="9" text-anchor="middle" fill="#805ad5">参数校验</text>

  <rect x="640" y="70" width="180" height="60" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="730" y="102" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">数据暴露</text>
  <text x="730" y="120" font-size="9" text-anchor="middle" fill="#38a169">敏感信息</text>

  <rect x="840" y="70" width="120" height="60" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="900" y="102" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">业务逻辑</text>

  <rect x="40" y="155" width="460" height="300" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">API 安全测试清单</text>

  <text x="70" y="210" font-size="10" font-weight="bold" fill="#c53030">认证测试：</text>
  <text x="70" y="230" font-size="9" fill="#2d3748">Token 缺失 → 是否返回 401</text>
  <text x="70" y="250" font-size="9" fill="#2d3748">Token 过期 → 是否正确拒绝</text>
  <text x="70" y="270" font-size="9" fill="#2d3748">Token 篡改 → 签名验证</text>

  <text x="70" y="300" font-size="10" font-weight="bold" fill="#805ad5">授权测试：</text>
  <text x="70" y="320" font-size="9" fill="#2d3748">用户 A 调用用户 B 的 API</text>
  <text x="70" y="340" font-size="9" fill="#2d3748">管理员 vs 普通用户权限差异</text>

  <text x="70" y="370" font-size="10" font-weight="bold" fill="#dd6b20">输入验证：</text>
  <text x="70" y="390" font-size="9" fill="#2d3748">参数类型/长度/格式校验</text>
  <text x="70" y="410" font-size="9" fill="#2d3748">SQL 注入 · XSS · 命令注入</text>

  <text x="70" y="440" font-size="10" font-weight="bold" fill="#3182ce">数据暴露：</text>
  <text x="70" y="460" font-size="9" fill="#2d3748">响应中不应包含敏感字段</text>

  <rect x="520" y="155" width="440" height="300" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">测试工具</text>

  <text x="550" y="210" font-size="10" font-weight="bold" fill="#c53030">Burp Suite：</text>
  <text x="550" y="230" font-size="9" fill="#2d3748">API 请求篡改 · Repeater</text>

  <text x="550" y="260" font-size="10" font-weight="bold" fill="#805ad5">Postman：</text>
  <text x="550" y="280" font-size="9" fill="#2d3748">API 批量测试 · 集合执行</text>

  <text x="550" y="310" font-size="10" font-weight="bold" fill="#dd6b20">OWASP ZAP：</text>
  <text x="550" y="330" font-size="9" fill="#2d3748">API 安全扫描 · 自动化</text>

  <text x="550" y="360" font-size="10" font-weight="bold" fill="#3182ce">防御：</text>
  <text x="550" y="380" font-size="9" fill="#2d3748">JWT 签名验证 · 最小权限</text>
  <text x="550" y="400" font-size="9" fill="#2d3748">参数白名单 · 响应脱敏</text>
  <text x="550" y="420" font-size="9" fill="#2d3748">限流 + 审计日志</text>
</svg>
