<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="460" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">免杀工具链：从编码到 C2</text>

  <rect x="40" y="60" width="130" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="105" y="92" font-size="10" text-anchor="middle" fill="#c53030" font-weight="bold">编码混淆</text>
  <text x="105" y="108" font-size="9" text-anchor="middle" fill="#c53030">msfvenom</text>

  <rect x="185" y="60" width="130" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="250" y="92" font-size="10" text-anchor="middle" fill="#b7791f" font-weight="bold">编译加壳</text>
  <text x="250" y="108" font-size="9" text-anchor="middle" fill="#b7791f">UPX / VMProtect</text>

  <rect x="330" y="60" width="130" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="395" y="92" font-size="10" text-anchor="middle" fill="#805ad5" font-weight="bold">代码混淆</text>
  <text x="395" y="108" font-size="9" text-anchor="middle" fill="#805ad5">PHP/JS/Python</text>

  <rect x="475" y="60" width="130" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="540" y="92" font-size="10" text-anchor="middle" fill="#38a169" font-weight="bold">Loader 加载</text>
  <text x="540" y="108" font-size="9" text-anchor="middle" fill="#38a169">DLL / Reflect</text>

  <rect x="620" y="60" width="130" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="685" y="92" font-size="10" text-anchor="middle" fill="#3182ce" font-weight="bold">C2 上线</text>
  <text x="685" y="108" font-size="9" text-anchor="middle" fill="#3182ce">CS / 冰蝎</text>

  <rect x="765" y="60" width="130" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="830" y="92" font-size="10" text-anchor="middle" fill="#276749" font-weight="bold">持久化</text>
  <text x="830" y="108" font-size="9" text-anchor="middle" fill="#276749">注册表 / 计划任务</text>

  <rect x="910" y="60" width="45" height="50" rx="8" fill="#faf5ff" stroke="#805ad5" stroke-width="2"/>
  <text x="932" y="92" font-size="10" text-anchor="middle" fill="#44337a" font-weight="bold">+</text>

  <rect x="40" y="135" width="460" height="300" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="160" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">各层检测与对抗</text>

  <text x="70" y="190" font-size="10" font-weight="bold" fill="#c53030">编码混淆：</text>
  <text x="70" y="210" font-size="9" fill="#2d3748">msfvenom 生成 → 静态特征减少</text>
  <text x="70" y="230" font-size="9" fill="#2d3748">检测：YARA 规则 · 哈希匹配</text>

  <text x="70" y="260" font-size="10" font-weight="bold" fill="#805ad5">编译加壳：</text>
  <text x="70" y="280" font-size="9" fill="#2d3748">UPX/VMProtect 保护 PE 文件</text>
  <text x="70" y="300" font-size="9" fill="#2d3748">检测：PE 结构分析 · 虚拟机特征</text>

  <text x="70" y="330" font-size="10" font-weight="bold" fill="#dd6b20">代码混淆：</text>
  <text x="70" y="350" font-size="9" fill="#2d3748">PHP base64_decode → eval</text>
  <text x="70" y="370" font-size="9" fill="#2d3748">检测：代码审计 · DGA 检测</text>

  <text x="70" y="400" font-size="10" font-weight="bold" fill="#3182ce">Loader 加载：</text>
  <text x="70" y="420" font-size="9" fill="#2d3748">反射 DLL 加载 · 无文件落地</text>
  <text x="70" y="440" font-size="9" fill="#2d3748">检测：内存扫描 · ETW 监控</text>

  <rect x="520" y="135" width="440" height="300" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="160" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">EDR 检测手段</text>

  <text x="550" y="190" font-size="10" font-weight="bold" fill="#c53030">静态检测：</text>
  <text x="550" y="210" font-size="9" fill="#2d3748">文件哈希 · PE 结构 · 数字签名</text>
  <text x="550" y="230" font-size="9" fill="#2d3748">YARA 规则 · 机器学习特征</text>

  <text x="550" y="260" font-size="10" font-weight="bold" fill="#805ad5">行为检测：</text>
  <text x="550" y="280" font-size="9" fill="#2d3748">API 调用序列 · 内存操作</text>
  <text x="550" y="300" font-size="9" fill="#2d3748">进程注入 · 无文件执行</text>

  <text x="550" y="330" font-size="10" font-weight="bold" fill="#dd6b20">网络检测：</text>
  <text x="550" y="350" font-size="9" fill="#2d3748">C2 通信特征 · DGA 域名</text>
  <text x="550" y="370" font-size="9" fill="#2d3748">非常规端口 · 加密流量</text>

  <text x="550" y="400" font-size="10" font-weight="bold" fill="#3182ce">云安全：</text>
  <text x="550" y="420" font-size="9" fill="#2d3748">EDR + XDR + NDR 联动</text>
  <text x="550" y="440" font-size="9" fill="#2d3748">威胁情报 · IOC 匹配</text>
</svg>
