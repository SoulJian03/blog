<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">Wireshark 协议分析实战</text>

  <rect x="40" y="70" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="102" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① 抓包</text>

  <rect x="200" y="70" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="270" y="102" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② 过滤</text>

  <rect x="360" y="70" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="430" y="102" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 分析</text>

  <rect x="520" y="70" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="590" y="102" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 导出</text>

  <rect x="680" y="70" width="140" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="750" y="102" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ 取证</text>

  <rect x="840" y="70" width="120" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="900" y="102" font-size="11" text-anchor="middle" fill="#276749" font-weight="bold">⑥ 报告</text>

  <rect x="40" y="150" width="460" height="300" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">Wireshark 过滤器</text>

  <text x="70" y="205" font-size="10" font-weight="bold" fill="#c53030">地址过滤：</text>
  <text x="70" y="225" font-size="9" fill="#2d3748">ip.addr == 192.168.1.100</text>
  <text x="70" y="245" font-size="9" fill="#2d3748">tcp.srcport == 80</text>

  <text x="70" y="275" font-size="10" font-weight="bold" fill="#805ad5">协议过滤：</text>
  <text x="70" y="295" font-size="9" fill="#2d3748">tcp · udp · icmp · http · dns</text>
  <text x="70" y="315" font-size="9" fill="#2d3748">ssl · smb · ntp</text>

  <text x="70" y="345" font-size="10" font-weight="bold" fill="#dd6b20">内容过滤：</text>
  <text x="70" y="365" font-size="9" fill="#2d3748">tcp.contains "password"</text>
  <text x="70" y="385" font-size="9" fill="#2d3748">http.request.method == "POST"</text>

  <text x="70" y="415" font-size="10" font-weight="bold" fill="#3182ce">流追踪：</text>
  <text x="70" y="435" font-size="9" fill="#2d3748">右键 → Follow → TCP Stream</text>
  <text x="70" y="455" font-size="9" fill="#2d3748">查看完整会话内容</text>

  <rect x="520" y="150" width="440" height="300" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">常见分析场景</text>

  <text x="550" y="205" font-size="10" font-weight="bold" fill="#c53030">HTTP 分析：</text>
  <text x="550" y="225" font-size="9" fill="#2d3748">明文密码/Token 泄露</text>
  <text x="550" y="245" font-size="9" fill="#2d3748">File → Export Objects → HTTP</text>

  <text x="550" y="275" font-size="10" font-weight="bold" fill="#805ad5">DNS 分析：</text>
  <text x="550" y="295" font-size="9" fill="#2d3748">DNS 隧道 · 域名解析异常</text>
  <text x="550" y="315" font-size="9" fill="#2d3748">Statistics → DNS → Tree View</text>

  <text x="550" y="345" font-size="10" font-weight="bold" fill="#dd6b20">TCP 分析：</text>
  <text x="550" y="365" font-size="9" fill="#2d3748">SYN 扫描检测</text>
  <text x="550" y="385" font-size="9" fill="#2d3748">TCP 重传分析</text>

  <text x="550" y="415" font-size="10" font-weight="bold" fill="#3182ce">导出：</text>
  <text x="550" y="435" font-size="9" fill="#2d3748">File → Export Packet Dissections</text>
  <text x="550" y="455" font-size="9" fill="#2d3748">File → Export Objects</text>
</svg>
