<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr-b3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-b4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2980b9"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="#f8fafc" rx="10"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#111">Burp Suite 架构与拦截流程图</text>
  <text x="40" y="64" font-size="14" fill="#666">浏览器 → Burp Proxy → 目标服务器 的完整拦截与修改流程</text>

  <rect x="30" y="150" width="200" height="90" rx="12" fill="#fee2e2" stroke="#c0392b" stroke-width="2.5"/>
  <text x="130" y="180" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🌐 浏览器</text>
  <text x="130" y="205" font-size="13" text-anchor="middle" fill="#555">配置代理 127.0.0.1:8080</text>
  <text x="130" y="223" font-size="12" text-anchor="middle" fill="#555">安装 CA 证书（解密 HTTPS）</text>

  <path d="M 230 195 L 270 195" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr-b3)"/>

  <rect x="280" y="100" width="280" height="200" rx="12" fill="#dbeafe" stroke="#2980b9" stroke-width="2.5"/>
  <text x="420" y="130" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🛡️ Burp Suite</text>
  <line x1="300" y1="140" x2="560" y2="140" stroke="#2980b9" stroke-width="1"/>

  <text x="300" y="165" font-size="13" font-weight="bold" fill="#c0392b">1. Proxy 拦截</text>
  <text x="300" y="185" font-size="12" fill="#555">HTTP/HTTPS 流量中间人</text>

  <text x="300" y="210" font-size="13" font-weight="bold" fill="#2980b9">2. Intercept 暂停</text>
  <text x="300" y="230" font-size="12" fill="#555">改参数 / 改 Cookie / 改 Header</text>

  <text x="300" y="255" font-size="13" font-weight="bold" fill="#27ae60">3. Repeater 重放</text>
  <text x="300" y="275" font-size="12" fill="#555">修改后手动发送验证</text>

  <text x="300" y="300" font-size="13" font-weight="bold" fill="#b45309">4. Intruder 批量</text>
  <text x="300" y="320" font-size="12" fill="#555">爆破 / Fuzz / 扫描</text>

  <path d="M 560 195 L 600 195" stroke="#2980b9" stroke-width="2.5" fill="none" marker-end="url(#arr-b4)"/>

  <rect x="610" y="150" width="200" height="90" rx="12" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="710" y="180" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🖥️ 目标服务器</text>
  <text x="710" y="205" font-size="13" text-anchor="middle" fill="#555">Web 应用</text>
  <text x="710" y="223" font-size="12" text-anchor="middle" fill="#555">接收修改后的请求</text>

  <path d="M 230 215 C 300 350, 450 380, 560 215" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-b3)"/>
  <text x="380" y="390" font-size="12" fill="#c0392b" text-anchor="middle">响应回传给浏览器（可再次修改）</text>

  <path d="M 810 195 C 900 200, 920 200, 950 200" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arr-b4)"/>

  <rect x="960" y="150" width="200" height="90" rx="12" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="1060" y="180" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">📦 数据库</text>
  <text x="1060" y="205" font-size="13" text-anchor="middle" fill="#555">响应数据</text>
  <text x="1060" y="223" font-size="12" text-anchor="middle" fill="#555">可能返回敏感信息</text>

  <!-- 底部模块说明 -->
  <rect x="30" y="360" width="1140" height="180" rx="10" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="390" font-size="16" font-weight="bold" fill="#111">Burp 核心模块</text>

  <text x="50" y="420" font-size="13" font-weight="bold" fill="#c0392b">Proxy</text>
  <text x="150" y="420" font-size="12" fill="#333">中间人拦截，改请求/响应。所有流量的入口</text>

  <text x="50" y="448" font-size="13" font-weight="bold" fill="#2980b9">Repeater</text>
  <text x="150" y="448" font-size="12" fill="#333">手动修改单个请求重放，验证漏洞细节</text>

  <text x="50" y="476" font-size="13" font-weight="bold" fill="#27ae60">Intruder</text>
  <text x="150" y="476" font-size="12" fill="#333">自动爆破/扫描：密码、参数、目录、Fuzz payload</text>

  <text x="50" y="504" font-size="13" font-weight="bold" fill="#b45309">Sequencer</text>
  <text x="150" y="504" font-size="12" fill="#333">分析 Session Token 随机性（弱会话检测）</text>

  <text x="550" y="420" font-size="13" font-weight="bold" fill="#ad1457">Decoder</text>
  <text x="670" y="420" font-size="12" fill="#333">编码转换：URL/HTML/Base64/Hex/Mime</text>

  <text x="550" y="448" font-size="13" font-weight="bold" fill="#1565c0">Comparer</text>
  <text x="670" y="448" font-size="12" fill="#333">对比两次响应差异，找注入点</text>

  <text x="550" y="476" font-size="13" font-weight="bold" fill="#27ae60">Target</text>
  <text x="670" y="476" font-size="12" fill="#333">站点地图，可视化已发现的所有 URL/资源</text>

  <text x="550" y="504" font-size="13" font-weight="bold" fill="#c0392b">Extender</text>
  <text x="670" y="504" font-size="12" fill="#333">插件扩展：Java/Groovy 插件增强功能</text>
</svg>
