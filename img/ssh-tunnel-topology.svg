<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e74c3c"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2980b9"/>
    </marker>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="520" fill="#f8fafc" rx="10"/>

  <!-- Title -->
  <text x="40" y="40" font-size="22" font-weight="bold" fill="#111">SSH 隧道拓扑图：三种转发模式对比</text>
  <text x="40" y="62" font-size="14" fill="#666">本地转发 -L | 动态转发 -D | 远程转发 -R</text>

  <!-- ========== 网络边界分隔线 ========== -->
  <line x1="420" y1="80" x2="420" y2="480" stroke="#b0b0b0" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="320" y="98" font-size="14" font-weight="bold" fill="#555">公网 / 攻击侧</text>
  <text x="530" y="98" font-size="14" font-weight="bold" fill="#555">内网 / 目标侧</text>

  <!-- ========== 攻击者（左） ========== -->
  <rect x="30" y="160" width="200" height="110" rx="12" fill="#fee2e2" stroke="#c0392b" stroke-width="2.5"/>
  <text x="130" y="195" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">🖥️ 攻击者 / 本机</text>
  <text x="130" y="220" font-size="13" text-anchor="middle" fill="#555">IP: 192.168.1.100</text>
  <text x="130" y="240" font-size="12" text-anchor="middle" fill="#555">工具: ssh / proxychains</text>
  <text x="130" y="258" font-size="12" text-anchor="middle" fill="#555">本地监听端口</text>

  <!-- ========== 跳板机（中） ========== -->
  <rect x="490" y="160" width="200" height="110" rx="12" fill="#dbeafe" stroke="#2980b9" stroke-width="2.5"/>
  <text x="590" y="195" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">🔑 跳板机 / 已控主机</text>
  <text x="590" y="220" font-size="13" text-anchor="middle" fill="#555">IP: 10.0.0.1</text>
  <text x="590" y="240" font-size="12" text-anchor="middle" fill="#555">SSH 22 可达</text>
  <text x="590" y="258" font-size="12" text-anchor="middle" fill="#555">有 SSH 登录凭证</text>

  <!-- ========== 目标主机（右） ========== -->
  <rect x="900" y="160" width="200" height="110" rx="12" fill="#fef9c3" stroke="#b45309" stroke-width="2.5"/>
  <text x="1000" y="195" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">🎯 内网目标</text>
  <text x="1000" y="220" font-size="13" text-anchor="middle" fill="#555">IP: 10.0.0.5</text>
  <text x="1000" y="240" font-size="12" text-anchor="middle" fill="#555">RDP 3389 / DB 3306</text>
  <text x="1000" y="258" font-size="12" text-anchor="middle" fill="#555">无法从公网直达</text>

  <!-- ========== 模式1: 本地转发 -L ========== -->
  <text x="40" y="315" font-size="16" font-weight="bold" fill="#c0392b">模式1：本地转发 ssh -L</text>
  <text x="40" y="335" font-size="12" fill="#666">ssh -L 13389:10.0.0.5:3389 user@10.0.0.1</text>

  <path d="M 230 230 C 350 200, 450 200, 520 230" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr1)"/>
  <text x="360" y="195" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="bold">SSH 隧道（加密）</text>

  <path d="M 690 225 C 780 245, 850 245, 895 225" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arr1)"/>
  <text x="780" y="255" font-size="11" fill="#c0392b" text-anchor="middle">经隧道代理访问 10.0.0.5:3389</text>

  <text x="40" y="358" font-size="12" fill="#555">→ 本机 13389 ←→ 内网 10.0.0.5:3389 直通映射</text>
  <text x="40" y="376" font-size="12" fill="#555">→ 适合：已知单端口，快速映射</text>

  <!-- ========== 模式2: 动态转发 -D ========== -->
  <text x="40" y="415" font-size="16" font-weight="bold" fill="#2980b9">模式2：动态转发 ssh -D（Socks 代理）</text>
  <text x="40" y="435" font-size="12" fill="#666">ssh -D 1080 user@10.0.0.1 → proxychains 代理全内网</text>

  <path d="M 230 250 C 350 420, 450 440, 520 250" stroke="#2980b9" stroke-width="2.5" fill="none" marker-end="url(#arr2)"/>
  <text x="360" y="465" font-size="11" fill="#2980b9" text-anchor="middle" font-weight="bold">SSH 通道</text>

  <path d="M 690 240 C 780 400, 850 400, 895 240" stroke="#2980b9" stroke-width="2.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arr2)"/>
  <text x="780" y="420" font-size="11" fill="#2980b9" text-anchor="middle">Socks5 代理 → 穿透全内网</text>

  <text x="40" y="458" font-size="12" fill="#555">→ 本机 1080 开 socks5，任何工具加 proxychains 即可扫内网</text>
  <text x="40" y="476" font-size="12" fill="#555">→ 适合：未知内网拓扑，需要扫描/横向移动</text>

  <!-- ========== 模式3: 远程转发 -R ========== -->
  <text x="40" y="500" font-size="14" font-weight="bold" fill="#27ae60">模式3：远程转发 ssh -R → 跳板机主动回连攻击机，将本地端口暴露出来</text>
</svg>
