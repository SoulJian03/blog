<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="460" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">SSH 隧道与内网代理</text>

  <rect x="40" y="70" width="200" height="60" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="140" y="102" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">本地端口转发</text>
  <text x="140" y="120" font-size="9" text-anchor="middle" fill="#c53030">-L（外→内）</text>

  <rect x="260" y="70" width="200" height="60" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="360" y="102" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">远程端口转发</text>
  <text x="360" y="120" font-size="9" text-anchor="middle" fill="#b7791f">-R（内→外）</text>

  <rect x="480" y="70" width="200" height="60" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="580" y="102" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">动态端口转发</text>
  <text x="580" y="120" font-size="9" text-anchor="middle" fill="#805ad5">-D（socks代理）</text>

  <rect x="700" y="70" width="200" height="60" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="800" y="102" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">代理跳板</text>
  <text x="800" y="120" font-size="9" text-anchor="middle" fill="#38a169">ProxyCommand</text>

  <rect x="40" y="160" width="460" height="270" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">SSH 隧道命令</text>

  <text x="70" y="215" font-size="10" font-weight="bold" fill="#c53030">本地端口转发：</text>
  <text x="70" y="235" font-size="9" fill="#2d3748">ssh -L 8080:127.0.0.1:80 user@bastion</text>
  <text x="70" y="255" font-size="9" fill="#2d3748">→ 访问本地 8080 即访问内网 80</text>

  <text x="70" y="285" font-size="10" font-weight="bold" fill="#805ad5">远程端口转发：</text>
  <text x="70" y="305" font-size="9" fill="#2d3748">ssh -R 8080:127.0.0.1:80 user@vps</text>
  <text x="70" y="325" font-size="9" fill="#2d3748">→ VPS 8080 访问本机 80</text>

  <text x="70" y="355" font-size="10" font-weight="bold" fill="#dd6b20">动态端口转发：</text>
  <text x="70" y="375" font-size="9" fill="#2d3748">ssh -D 1080 user@bastion</text>
  <text x="70" y="395" font-size="9" fill="#2d3748">→ 设置 socks5://127.0.0.1:1080</text>

  <text x="70" y="425" font-size="10" font-weight="bold" fill="#3182ce">ProxyCommand：</text>
  <text x="70" y="445" font-size="9" fill="#2d3748">ssh -o ProxyCommand=... user@target</text>

  <rect x="520" y="160" width="440" height="270" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">使用场景</text>

  <text x="550" y="215" font-size="10" font-weight="bold" fill="#c53030">本地转发：</text>
  <text x="550" y="235" font-size="9" fill="#2d3748">访问跳板机后的内网服务</text>
  <text x="550" y="255" font-size="9" fill="#2d3748">本地开发访问测试环境</text>

  <text x="550" y="285" font-size="10" font-weight="bold" fill="#805ad5">远程转发：</text>
  <text x="550" y="305" font-size="9" fill="#2d3748">内网机器反向连接外网 VPS</text>
  <text x="550" y="325" font-size="9" fill="#2d3748">无公网 IP 的服务器出网</text>

  <text x="550" y="355" font-size="10" font-weight="bold" fill="#dd6b20">动态转发：</text>
  <text x="550" y="375" font-size="9" fill="#2d3748">SOCKS5 代理 · 全流量走 SSH</text>
  <text x="550" y="395" font-size="9" fill="#2d3748">配合浏览器/Fiddler 使用</text>

  <text x="550" y="425" font-size="10" font-weight="bold" fill="#3182ce">多重代理：</text>
  <text x="550" y="445" font-size="9" fill="#2d3748">ProxyCommand 级联跳板</text>
</svg>
