<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="400" fill="#f8fafc" rx="10"/>
  <text x="20" y="34" font-size="20" font-weight="bold" fill="#111">防火墙边界部署 · 路由模式</text>

  <!-- 互联网 -->
  <rect x="30" y="150" width="180" height="110" rx="10" fill="#fee2e2" stroke="#333" stroke-width="2"/>
  <text x="120" y="200" font-size="20" text-anchor="middle" fill="#111">互联网</text>
  <text x="120" y="228" font-size="14" text-anchor="middle" fill="#666">攻击者 / 外网用户</text>

  <!-- 防火墙 -->
  <rect x="330" y="130" width="200" height="150" rx="10" fill="#dbeafe" stroke="#333" stroke-width="3"/>
  <text x="430" y="180" font-size="20" text-anchor="middle" fill="#111" font-weight="bold">下一代防火墙</text>
  <text x="430" y="208" font-size="14" text-anchor="middle" fill="#333">策略 / NAT / IPS</text>
  <text x="430" y="228" font-size="14" text-anchor="middle" fill="#333">VPN / 应用识别</text>
  <text x="430" y="258" font-size="13" text-anchor="middle" fill="#b91c1c">★ 边界第一道门</text>

  <!-- DMZ -->
  <rect x="660" y="60" width="170" height="100" rx="10" fill="#dcfce7" stroke="#333" stroke-width="2"/>
  <text x="745" y="105" font-size="18" text-anchor="middle" fill="#111">DMZ 区</text>
  <text x="745" y="132" font-size="14" text-anchor="middle" fill="#333">Web 服务器等对外服务</text>

  <!-- 内网 -->
  <rect x="660" y="240" width="170" height="100" rx="10" fill="#dcfce7" stroke="#333" stroke-width="2"/>
  <text x="745" y="285" font-size="18" text-anchor="middle" fill="#111">内网核心区</text>
  <text x="745" y="312" font-size="14" text-anchor="middle" fill="#333">服务器 / 办公终端</text>

  <!-- arrows -->
  <line x1="210" y1="205" x2="325" y2="205" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="535" y1="175" x2="655" y2="115" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="535" y1="235" x2="655" y2="290" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>

  <text x="268" y="188" font-size="13" fill="#666" text-anchor="middle">双向流量</text>
  <text x="600" y="120" font-size="13" fill="#666" text-anchor="middle">仅放行 80/443</text>
  <text x="600" y="300" font-size="13" fill="#666" text-anchor="middle">默认拒绝</text>
</svg>
