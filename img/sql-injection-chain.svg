<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="500" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c53030"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3182ce"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">SQL 注入攻击链</text>

  <rect x="50" y="70" width="150" height="55" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="125" y="100" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① 探测</text>
  <text x="125" y="117" font-size="9" text-anchor="middle" fill="#c53030">单引号/联合查询</text>

  <line x1="200" y1="97" x2="235" y2="97" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="240" y="70" width="150" height="55" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="315" y="100" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② 判断类型</text>
  <text x="315" y="117" font-size="9" text-anchor="middle" fill="#b7791f">盲注/报错/联合</text>

  <line x1="390" y1="97" x2="425" y2="97" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="430" y="70" width="150" height="55" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="505" y="100" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 获取表结构</text>
  <text x="505" y="117" font-size="9" text-anchor="middle" fill="#805ad5">information_schema</text>

  <line x1="580" y1="97" x2="615" y2="97" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="620" y="70" width="150" height="55" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="695" y="100" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 读取数据</text>
  <text x="695" y="117" font-size="9" text-anchor="middle" fill="#38a169">SELECT FROM 表</text>

  <line x1="770" y1="97" x2="805" y2="97" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="810" y="70" width="150" height="55" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="885" y="100" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ 写文件/Getshell</text>
  <text x="885" y="117" font-size="9" text-anchor="middle" fill="#3182ce">INTO OUTFILE</text>

  <rect x="40" y="160" width="450" height="300" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="265" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">SQL 注入类型</text>

  <rect x="70" y="205" width="160" height="120" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.5"/>
  <text x="150" y="228" font-size="10" text-anchor="middle" fill="#c53030" font-weight="bold">联合注入</text>
  <text x="90" y="253" font-size="9" fill="#2d3748">UNION SELECT</text>
  <text x="90" y="273" font-size="9" fill="#2d3748">条件: 页面回显</text>
  <text x="90" y="293" font-size="9" fill="#2d3748">最快 · 最直观</text>

  <rect x="250" y="205" width="160" height="120" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="1.5"/>
  <text x="330" y="228" font-size="10" text-anchor="middle" fill="#b7791f" font-weight="bold">报错注入</text>
  <text x="270" y="253" font-size="9" fill="#2d3748">floor()/extractvalue()</text>
  <text x="270" y="273" font-size="9" fill="#2d3748">条件: 页面报错</text>
  <text x="270" y="293" font-size="9" fill="#2d3748">从错误信息获取数据</text>

  <rect x="70" y="345" width="160" height="100" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="1.5"/>
  <text x="150" y="368" font-size="10" text-anchor="middle" fill="#805ad5" font-weight="bold">布尔盲注</text>
  <text x="90" y="393" font-size="9" fill="#2d3748">页面 True/False</text>
  <text x="90" y="413" font-size="9" fill="#2d3748">逐字符判断</text>
  <text x="90" y="433" font-size="9" fill="#2d3748">慢 · 但无回显也可</text>

  <rect x="250" y="345" width="160" height="100" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5"/>
  <text x="330" y="368" font-size="10" text-anchor="middle" fill="#38a169" font-weight="bold">时间盲注</text>
  <text x="270" y="393" font-size="9" fill="#2d3748">sleep()/BENCHMARK()</text>
  <text x="270" y="413" font-size="9" fill="#2d3748">根据响应时间判断</text>
  <text x="270" y="433" font-size="9" fill="#2d3748">最慢 · 完全盲注</text>

  <rect x="510" y="160" width="450" height="300" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="735" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">防御措施</text>

  <text x="540" y="215" font-size="10" font-weight="bold" fill="#c53030">1. 使用预编译语句</text>
  <text x="540" y="235" font-size="9" fill="#2d3748">PDO / PreparedStatement / ORM</text>
  <text x="540" y="245" font-size="9" fill="#2d3748">PHP: $pdo->prepare("SELECT * FROM users WHERE id=?")</text>
  <text x="540" y="270" font-size="10" font-weight="bold" fill="#805ad5">2. 最小权限原则</text>
  <text x="540" y="290" font-size="9" fill="#2d3748">数据库账号只给 SELECT 权限</text>
  <text x="540" y="300" font-size="9" fill="#2d3748">禁止 FILE / SYSTEM 权限</text>
  <text x="540" y="325" font-size="10" font-weight="bold" fill="#dd6b20">3. WAF + 输入校验</text>
  <text x="540" y="345" font-size="9" fill="#2d3748">过滤特殊字符: ' " ; -- /</text>
  <text x="540" y="355" font-size="9" fill="#2d3748">参数白名单验证</text>
  <text x="540" y="380" font-size="10" font-weight="bold" fill="#3182ce">4. 错误信息隐藏</text>
  <text x="540" y="400" font-size="9" fill="#2d3748">关闭 MySQL 详细错误回显</text>
  <text x="540" y="410" font-size="9" fill="#2d3748">自定义 404/500 页面</text>
  <text x="540" y="435" font-size="10" font-weight="bold" fill="#38a169">5. 数据库审计</text>
  <text x="540" y="450" font-size="9" fill="#2d3748">开启 general_log / slow_query_log</text>
</svg>
