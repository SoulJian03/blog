<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="400" fill="#f8fafc" rx="10"/>
  <text x="20" y="34" font-size="20" font-weight="bold" fill="#111">EDR：终端侧检测 + 集中响应</text>

  <!-- 终端 -->
  <rect x="30" y="120" width="170" height="110" rx="10" fill="#fee2e2" stroke="#333" stroke-width="2"/>
  <text x="115" y="160" font-size="17" text-anchor="middle" fill="#111">办公 PC</text>
  <text x="115" y="184" font-size="13" text-anchor="middle" fill="#666">装 Agent</text>
  <rect x="230" y="120" width="170" height="110" rx="10" fill="#fee2e2" stroke="#333" stroke-width="2"/>
  <text x="315" y="160" font-size="17" text-anchor="middle" fill="#111">服务器</text>
  <text x="315" y="184" font-size="13" text-anchor="middle" fill="#666">装 Agent</text>
  <rect x="430" y="120" width="170" height="110" rx="10" fill="#fee2e2" stroke="#333" stroke-width="2"/>
  <text x="515" y="160" font-size="17" text-anchor="middle" fill="#111">云主机</text>
  <text x="515" y="184" font-size="13" text-anchor="middle" fill="#666">装 Agent</text>
  <text x="315" y="250" font-size="13" fill="#666" text-anchor="middle">Agent：采集行为/文件/进程/网络 → 上报</text>

  <!-- 管理端 -->
  <rect x="660" y="120" width="190" height="110" rx="10" fill="#dbeafe" stroke="#333" stroke-width="3"/>
  <text x="755" y="160" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">EDR 管理端</text>
  <text x="755" y="184" font-size="13" text-anchor="middle" fill="#333">行为分析 / 查杀</text>
  <text x="755" y="204" font-size="13" text-anchor="middle" fill="#333">隔离 / 取证 / 溯源</text>

  <!-- 态势感知 -->
  <rect x="660" y="290" width="190" height="80" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="755" y="325" font-size="16" text-anchor="middle" fill="#111">态势感知</text>
  <text x="755" y="348" font-size="12" text-anchor="middle" fill="#7e22ce">统一研判 / 联动</text>

  <!-- arrows -->
  <line x1="200" y1="175" x2="310" y2="175" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="400" y1="175" x2="425" y2="175" stroke="#666" stroke-width="2"/>
  <line x1="600" y1="175" x2="655" y2="175" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="755" y1="235" x2="755" y2="285" stroke="#666" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="420" y="270" font-size="12" fill="#666">上报</text>
  <text x="770" y="265" font-size="12" fill="#666">告警/响应</text>

  <text x="30" y="370" font-size="13" fill="#666">EDR 重点检测：LSASS 读取、进程注入、异常计划任务、C2 回连、横向行为</text>
</svg>
