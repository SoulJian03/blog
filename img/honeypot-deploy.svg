<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="400" fill="#f8fafc" rx="10"/>
  <text x="20" y="34" font-size="20" font-weight="bold" fill="#111">蜜罐：诱饵吸引攻击 · 提前发现</text>

  <!-- 攻击者 -->
  <rect x="30" y="140" width="170" height="110" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="115" y="185" font-size="17" text-anchor="middle" fill="#b91c1c">攻击者 / 扫描器</text>
  <text x="115" y="210" font-size="13" text-anchor="middle" fill="#666">批量扫描 / 爆破</text>

  <!-- 真实资产 -->
  <rect x="620" y="60" width="230" height="100" rx="10" fill="#dcfce7" stroke="#333" stroke-width="2"/>
  <text x="735" y="105" font-size="16" text-anchor="middle" fill="#111">真实业务资产</text>
  <text x="735" y="130" font-size="13" text-anchor="middle" fill="#666">有真实数据</text>

  <!-- 蜜罐 -->
  <rect x="620" y="230" width="230" height="100" rx="10" fill="#fef9c3" stroke="#b45309" stroke-width="3"/>
  <text x="735" y="275" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">蜜罐（诱饵）</text>
  <text x="735" y="300" font-size="13" text-anchor="middle" fill="#b45309">无真实数据 · 越像越好</text>

  <!-- 攻击者到蜜罐 -->
  <line x1="200" y1="195" x2="615" y2="285" stroke="#b91c1c" stroke-width="3" marker-end="url(#arr)"/>
  <text x="400" y="225" font-size="13" fill="#b91c1c">攻击者容易被诱饵吸引</text>

  <!-- 蜜罐到态势感知 -->
  <line x1="735" y1="330" x2="735" y2="375" stroke="#7e22ce" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="745" y="365" font-size="12" fill="#7e22ce">告警上报</text>

  <rect x="560" y="370" width="290" height="24" rx="6" fill="#f3e8ff" stroke="#7e22ce"/>
  <text x="705" y="387" font-size="13" fill="#7e22ce" text-anchor="middle">态势感知 / EDR 研判处置</text>

  <text x="30" y="360" font-size="13" fill="#666">核心：正常流量永远不该碰蜜罐，碰了就是威胁信号 → 提前发现、取证、溯源</text>
</svg>
