<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c53030"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">XSS 攻击链与分类</text>

  <rect x="50" y="70" width="130" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="115" y="102" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">攻击者构造 Payload</text>

  <line x1="180" y1="95" x2="215" y2="95" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="220" y="70" width="130" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="285" y="102" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">投递方式</text>

  <line x1="350" y1="95" x2="385" y2="95" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="390" y="70" width="130" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="455" y="102" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">受害者浏览器</text>

  <line x1="520" y1="95" x2="555" y2="95" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="560" y="70" width="130" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="625" y="102" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">JS 执行</text>

  <line x1="690" y1="95" x2="725" y2="95" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="730" y="70" width="200" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="830" y="102" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">窃取 Cookie / 数据 / 钓鱼</text>

  <rect x="40" y="150" width="450" height="290" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="265" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">XSS 三种类型</text>

  <rect x="70" y="195" width="390" height="70" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.5"/>
  <text x="95" y="218" font-size="11" fill="#c53030" font-weight="bold">1. 反射型 XSS (Reflected)</text>
  <text x="95" y="240" font-size="9" fill="#2d3748">• Payload 在 URL 参数中</text>
  <text x="95" y="258" font-size="9" fill="#2d3748">• 受害者点击链接触发 → 需社工/钓鱼</text>

  <rect x="70" y="275" width="390" height="70" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="1.5"/>
  <text x="95" y="298" font-size="11" fill="#b7791f" font-weight="bold">2. 存储型 XSS (Stored)</text>
  <text x="95" y="320" font-size="9" fill="#2d3748">• Payload 写入数据库(评论/发帖)</text>
  <text x="95" y="338" font-size="9" fill="#2d3748">• 所有访问者自动触发 → 危害最大</text>

  <rect x="70" y="355" width="390" height="70" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="1.5"/>
  <text x="95" y="378" font-size="11" fill="#805ad5" font-weight="bold">3. DOM 型 XSS</text>
  <text x="95" y="400" font-size="9" fill="#2d3748">• 客户端 JS 读取 URL/参数拼接到 DOM</text>
  <text x="95" y="418" font-size="9" fill="#2d3748">• 不经过服务器 → WAF 难拦截</text>

  <rect x="510" y="150" width="450" height="290" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="735" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">防御措施</text>

  <text x="540" y="205" font-size="10" font-weight="bold" fill="#c53030">1. 输出编码</text>
  <text x="540" y="225" font-size="9" fill="#2d3748">HTML: &lt; → &amp;lt;  &quot; → &amp;quot;</text>
  <text x="540" y="245" font-size="9" fill="#2d3748">JS: \&lt;\&gt; 等转义</text>
  <text x="540" y="265" font-size="9" fill="#2d3748">URL: encodeURI()</text>

  <text x="540" y="290" font-size="10" font-weight="bold" fill="#805ad5">2. 内容安全策略 (CSP)</text>
  <text x="540" y="310" font-size="9" fill="#2d3748">Content-Security-Policy: script-src 'self'</text>
  <text x="540" y="330" font-size="9" fill="#2d3748">禁止外部脚本 / inline JS</text>

  <text x="540" y="355" font-size="10" font-weight="bold" fill="#dd6b20">3. HttpOnly Cookie</text>
  <text x="540" y="375" font-size="9" fill="#2d3748">document.cookie 无法读取</text>
  <text x="540" y="395" font-size="9" fill="#2d3748">即使 XSS 也拿不到 Session</text>

  <text x="540" y="420" font-size="10" font-weight="bold" fill="#3182ce">4. 输入校验 + 白名单</text>
  <text x="540" y="440" font-size="9" fill="#2d3748">只允许 HTML 安全标签</text>
  <text x="540" y="455" font-size="9" fill="#2d3748">禁止 onerror/onload 等事件</text>
</svg>
