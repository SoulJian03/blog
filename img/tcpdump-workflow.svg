<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="460" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">tcpdump 抓包分析实战</text>

  <rect x="40" y="60" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="92" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">抓包</text>
  <text x="110" y="108" font-size="9" text-anchor="middle" fill="#c53030">tcpdump -i eth0</text>

  <rect x="200" y="60" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="270" y="92" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">过滤</text>
  <text x="270" y="108" font-size="9" text-anchor="middle" fill="#b7791f">host/port/ proto</text>

  <rect x="360" y="60" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="430" y="92" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">保存</text>
  <text x="430" y="108" font-size="9" text-anchor="middle" fill="#805ad5">-w file.pcap</text>

  <rect x="520" y="60" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="590" y="92" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">分析</text>
  <text x="590" y="108" font-size="9" text-anchor="middle" fill="#38a169">Wireshark</text>

  <rect x="680" y="60" width="140" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="750" y="92" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">取证</text>
  <text x="750" y="108" font-size="9" text-anchor="middle" fill="#3182ce">导出 / 分析</text>

  <rect x="840" y="60" width="120" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="900" y="92" font-size="11" text-anchor="middle" fill="#276749" font-weight="bold">报告</text>

  <rect x="40" y="140" width="460" height="280" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">tcpdump 实战命令</text>

  <text x="70" y="195" font-size="10" font-weight="bold" fill="#c53030">抓 HTTP 包：</text>
  <text x="70" y="215" font-size="9" fill="#2d3748">tcpdump -i eth0 port 80 -A</text>

  <text x="70" y="240" font-size="10" font-weight="bold" fill="#805ad5">抓指定 IP：</text>
  <text x="70" y="260" font-size="9" fill="#2d3748">tcpdump -i eth0 host 192.168.1.100</text>

  <text x="70" y="285" font-size="10" font-weight="bold" fill="#dd6b20">抓 DNS：</text>
  <text x="70" y="305" font-size="9" fill="#2d3748">tcpdump -i eth0 port 53</text>

  <text x="70" y="330" font-size="10" font-weight="bold" fill="#3182ce">保存为 pcap：</text>
  <text x="70" y="350" font-size="9" fill="#2d3748">tcpdump -i eth0 -w capture.pcap</text>

  <text x="70" y="375" font-size="10" font-weight="bold" fill="#38a169">抓 TCP 连接：</text>
  <text x="70" y="395" font-size="9" fill="#2d3748">tcpdump -i eth0 'tcp[tcpflags] &amp; (tcp-syn) != 0'</text>
  <text x="70" y="415" font-size="9" fill="#2d3748">SYN 扫描检测</text>

  <text x="70" y="440" font-size="10" font-weight="bold" fill="#276749">抓特定协议：</text>
  <text x="70" y="445" font-size="9" fill="#2d3748">tcpdump -i eth0 icmp | tcpdump -i eth0 udp</text>

  <rect x="520" y="140" width="440" height="280" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">Wireshark 分析</text>

  <text x="550" y="195" font-size="10" font-weight="bold" fill="#c53030">过滤器：</text>
  <text x="550" y="215" font-size="9" fill="#2d3748">ip.addr == 192.168.1.100</text>
  <text x="550" y="235" font-size="9" fill="#2d3748">tcp.port == 80</text>
  <text x="550" y="255" font-size="9" fill="#2d3748">http.request.method == "POST"</text>

  <text x="550" y="285" font-size="10" font-weight="bold" fill="#805ad5">导出对象：</text>
  <text x="550" y="305" font-size="9" fill="#2d3748">File → Export Objects → HTTP</text>

  <text x="550" y="335" font-size="10" font-weight="bold" fill="#dd6b20">统计连接：</text>
  <text x="550" y="355" font-size="9" fill="#2d3748">Statistics → Conversations</text>

  <text x="550" y="385" font-size="10" font-weight="bold" fill="#3182ce">抓包关联：</text>
  <text x="550" y="405" font-size="9" fill="#2d3748">Filter: tcp.flags.syn==1 (SYN 扫描)</text>
  <text x="550" y="425" font-size="9" fill="#2d3748">Filter: tcp.analysis.retransmission (重传)</text>
</svg>
