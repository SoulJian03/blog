<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr-w3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="#f8fafc" rx="10"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#111">Windows 提权决策树</text>
  <text x="40" y="64" font-size="14" fill="#666">从低权限 shell 提权到 SYSTEM / Administrator 的完整决策路径</text>

  <rect x="40" y="100" width="1120" height="50" rx="10" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="600" y="130" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🚀 获取初始 Shell（普通用户 / IIS AppPool）</text>

  <path d="M 600 150 L 600 175" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arr-w3)"/>

  <!-- 分支1 -->
  <rect x="30" y="200" width="240" height="80" rx="10" fill="#fee2e2" stroke="#c0392b" stroke-width="2"/>
  <text x="150" y="228" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">① 信息收集</text>
  <text x="150" y="250" font-size="12" text-anchor="middle" fill="#555">whoami / systeminfo</text>
  <text x="150" y="268" font-size="11" text-anchor="middle" fill="#555">wmic os get Caption,Version</text>

  <path d="M 270 240 L 310 240" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr-w3)"/>

  <rect x="320" y="180" width="200" height="100" rx="10" fill="#dbeafe" stroke="#2980b9" stroke-width="2"/>
  <text x="420" y="208" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">② 补丁缺口</text>
  <text x="420" y="230" font-size="12" text-anchor="middle" fill="#555">wmic qfe list</text>
  <text x="420" y="248" font-size="11" text-anchor="middle" fill="#555">对比 MS14-068 / 永恒之蓝</text>

  <rect x="320" y="310" width="200" height="100" rx="10" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="420" y="338" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">③ 配置错误</text>
  <text x="420" y="360" font-size="12" text-anchor="middle" fill="#555">AlwaysInstallElevated</text>
  <text x="420" y="378" font-size="11" text-anchor="middle" fill="#555">服务权限 / 计划任务</text>

  <rect x="560" y="180" width="200" height="100" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="660" y="208" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">④ Token 操作</text>
  <text x="660" y="230" font-size="12" text-anchor="middle" fill="#555">mimikatz token::elevate</text>
  <text x="660" y="248" font-size="11" text-anchor="middle" fill="#555">token::impersonate</text>

  <rect x="560" y="310" width="200" height="100" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
  <text x="660" y="338" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">⑤ 内核漏洞</text>
  <text x="660" y="360" font-size="12" text-anchor="middle" fill="#555">CVE 提权 exploit</text>
  <text x="660" y="378" font-size="11" text-anchor="middle" fill="#555">如 PrintNightmare</text>

  <path d="M 780 240 L 820 240" stroke="#1565c0" stroke-width="2.5" fill="none" marker-end="url(#arr-w3)"/>
  <path d="M 780 360 L 820 360" stroke="#ad1457" stroke-width="2.5" fill="none" marker-end="url(#arr-w3)"/>
  <path d="M 520 200 C 700 150, 780 150, 820 220" stroke="#2980b9" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-w3)"/>
  <path d="M 520 320 C 700 300, 780 300, 820 340" stroke="#b45309" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-w3)"/>

  <rect x="830" y="180" width="330" height="260" rx="12" fill="#e8f5e9" stroke="#27ae60" stroke-width="2.5"/>
  <text x="995" y="208" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🎯 提权路径</text>
  <line x1="850" y1="218" x2="1140" y2="218" stroke="#27ae60" stroke-width="1"/>

  <text x="850" y="248" font-size="13" font-weight="bold" fill="#c0392b">1. 补丁缺口</text>
  <text x="850" y="266" font-size="12" fill="#555">找到未打补丁 → 搜索对应 CVE → 编译 exploit → SYSTEM</text>

  <text x="850" y="298" font-size="13" font-weight="bold" fill="#2980b9">2. 配置错误</text>
  <text x="850" y="316" font-size="12" fill="#555">AlwaysInstallElevated=1 → msf 提权模块 → SYSTEM</text>

  <text x="850" y="348" font-size="13" font-weight="bold" fill="#1565c0">3. Token 劫持</text>
  <text x="850" y="366" font-size="12" fill="#555">mimikatz 劫持 SYSTEM 进程 Token → 提权</text>

  <text x="850" y="398" font-size="13" font-weight="bold" fill="#ad1457">4. 内核漏洞</text>
  <text x="850" y="416" font-size="12" fill="#555">找 Windows 版本 → 找 CVE → 编译/下载 exploit</text>

  <text x="850" y="440" font-size="13" font-weight="bold" fill="#b45309">5. 服务权限</text>
  <text x="850" y="458" font-size="12" fill="#555">服务路径空格未加引号 → 替换服务可执行文件 → SYSTEM</text>

  <text x="995" y="478" font-size="14" text-anchor="middle" fill="#27ae60" font-weight="bold">→ root/SYSTEM</text>
</svg>
