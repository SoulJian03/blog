<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="460" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">权限维持常见技术对比</text>

  <rect x="40" y="60" width="130" height="55" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="105" y="92" font-size="10" text-anchor="middle" fill="#c53030" font-weight="bold">SSH 密钥</text>

  <rect x="185" y="60" width="130" height="55" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="250" y="92" font-size="10" text-anchor="middle" fill="#b7791f" font-weight="bold">计划任务</text>

  <rect x="330" y="60" width="130" height="55" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="395" y="92" font-size="10" text-anchor="middle" fill="#805ad5" font-weight="bold">WebShell</text>

  <rect x="475" y="60" width="130" height="55" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="540" y="92" font-size="10" text-anchor="middle" fill="#38a169" font-weight="bold">后门账号</text>

  <rect x="620" y="60" width="130" height="55" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="685" y="92" font-size="10" text-anchor="middle" fill="#3182ce" font-weight="bold">Rootkit</text>

  <rect x="765" y="60" width="130" height="55" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="830" y="92" font-size="10" text-anchor="middle" fill="#276749" font-weight="bold">C2 持久化</text>

  <rect x="910" y="60" width="45" height="55" rx="8" fill="#faf5ff" stroke="#805ad5" stroke-width="2"/>
  <text x="932" y="92" font-size="10" text-anchor="middle" fill="#44337a" font-weight="bold">更多</text>

  <rect x="40" y="130" width="460" height="300" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="155" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">各技术检测难度与风险</text>

  <rect x="60" y="175" width="170" height="110" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.5"/>
  <text x="145" y="198" font-size="10" text-anchor="middle" fill="#c53030" font-weight="bold">SSH 密钥</text>
  <text x="80" y="222" font-size="9" fill="#2d3748">风险: 高</text>
  <text x="80" y="242" font-size="9" fill="#2d3748">检测: 低</text>
  <text x="80" y="262" font-size="9" fill="#2d3748">持久: 永久</text>
  <text x="80" y="282" font-size="9" fill="#2d3748">方法: 写入 authorized_keys</text>

  <rect x="250" y="175" width="210" height="110" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="1.5"/>
  <text x="355" y="198" font-size="10" text-anchor="middle" fill="#b7791f" font-weight="bold">计划任务</text>
  <text x="270" y="222" font-size="9" fill="#2d3748">风险: 高</text>
  <text x="270" y="242" font-size="9" fill="#2d3748">检测: 中</text>
  <text x="270" y="262" font-size="9" fill="#2d3748">持久: 重启后仍在</text>
  <text x="270" y="282" font-size="9" fill="#2d3748">方法: crontab / at / systemd</text>

  <rect x="60" y="305" width="170" height="110" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="1.5"/>
  <text x="145" y="328" font-size="10" text-anchor="middle" fill="#805ad5" font-weight="bold">WebShell</text>
  <text x="80" y="352" font-size="9" fill="#2d3748">风险: 中</text>
  <text x="80" y="372" font-size="9" fill="#2d3748">检测: 中（WAF/EDR）</text>
  <text x="80" y="392" font-size="9" fill="#2d3748">持久: 文件存在</text>
  <text x="80" y="412" font-size="9" fill="#2d3748">方法: 上传脚本到 Web 目录</text>

  <rect x="250" y="305" width="210" height="110" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5"/>
  <text x="355" y="328" font-size="10" text-anchor="middle" fill="#38a169" font-weight="bold">后门账号</text>
  <text x="270" y="352" font-size="9" fill="#2d3748">风险: 极高</text>
  <text x="270" y="372" font-size="9" fill="#2d3748">检测: 低</text>
  <text x="270" y="392" font-size="9" fill="#2d3748">持久: 永久</text>
  <text x="270" y="412" font-size="9" fill="#2d3748">方法: 创建隐藏管理员账号</text>

  <rect x="520" y="130" width="440" height="300" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="155" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">检测方法</text>

  <text x="550" y="185" font-size="10" font-weight="bold" fill="#c53030">SSH 密钥检测：</text>
  <text x="550" y="205" font-size="9" fill="#2d3748">cat /root/.ssh/authorized_keys</text>
  <text x="550" y="225" font-size="9" fill="#2d3748">ls -la /home/*/.ssh/</text>

  <text x="550" y="250" font-size="10" font-weight="bold" fill="#805ad5">计划任务检测：</text>
  <text x="550" y="270" font-size="9" fill="#2d3748">crontab -l · cat /etc/crontab</text>
  <text x="550" y="290" font-size="9" fill="#2d3748">ls -la /etc/cron.*/ · systemctl list-units</text>

  <text x="550" y="315" font-size="10" font-weight="bold" fill="#dd6b20">WebShell 检测：</text>
  <text x="550" y="335" font-size="9" fill="#2d3748">find /var/www -mtime -3</text>
  <text x="550" y="355" font-size="9" fill="#2d3748">grep -r "eval\|base64_decode" /var/www</text>

  <text x="550" y="380" font-size="10" font-weight="bold" fill="#3182ce">后门账号检测：</text>
  <text x="550" y="400" font-size="9" fill="#2d3748">cat /etc/passwd | grep "/bin/bash"</text>
  <text x="550" y="420" font-size="9" fill="#2d3748">对比已知用户列表</text>

  <text x="550" y="440" font-size="10" font-weight="bold" fill="#38a169">防御：</text>
  <text x="550" y="445" font-size="9" fill="#2d3748">最小权限 + 双因素认证 + 定期审计</text>
</svg>
