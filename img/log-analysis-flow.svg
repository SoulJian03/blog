<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">日志分析：access.log 找攻击痕迹</text>

  <rect x="40" y="70" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="102" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① 采集日志</text>

  <rect x="200" y="70" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="270" y="102" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② 关键词过滤</text>

  <rect x="360" y="70" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="430" y="102" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ IP 聚类</text>

  <rect x="520" y="70" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="590" y="102" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 路径分析</text>

  <rect x="680" y="70" width="140" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="750" y="102" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ UA 分析</text>

  <rect x="840" y="70" width="120" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="900" y="102" font-size="11" text-anchor="middle" fill="#276749" font-weight="bold">⑥ 取证</text>

  <rect x="40" y="150" width="460" height="300" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">access.log 分析命令</text>

  <text x="70" y="205" font-size="10" font-weight="bold" fill="#c53030">SQL 注入：</text>
  <text x="70" y="225" font-size="9" fill="#2d3748">grep -E "union|select|sleep" access.log</text>

  <text x="70" y="255" font-size="10" font-weight="bold" fill="#805ad5">XSS：</text>
  <text x="70" y="275" font-size="9" fill="#2d3748">grep -E "&lt;script|alert\(" access.log</text>

  <text x="70" y="305" font-size="10" font-weight="bold" fill="#dd6b20">路径遍历：</text>
  <text x="70" y="325" font-size="9" fill="#2d3748">grep -E "\.\./|\.\.\\\\|/etc/passwd" access.log</text>

  <text x="70" y="355" font-size="10" font-weight="bold" fill="#3182ce">WebShell：</text>
  <text x="70" y="375" font-size="9" fill="#2d3748">grep -E "\.jsp\?cmd|cmd=" access.log</text>

  <text x="70" y="405" font-size="10" font-weight="bold" fill="#38a169">请求统计：</text>
  <text x="70" y="425" font-size="9" fill="#2d3748">awk '{print $1}' access.log | sort | uniq -c | sort -rn</text>
  <text x="70" y="445" font-size="9" fill="#2d3748">统计每个 IP 的请求次数</text>

  <rect x="520" y="150" width="440" height="300" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">分析维度</text>

  <text x="550" y="205" font-size="10" font-weight="bold" fill="#c53030">IP 维度：</text>
  <text x="550" y="225" font-size="9" fill="#2d3748">异常高频 IP · 扫描器 IP</text>

  <text x="550" y="255" font-size="10" font-weight="bold" fill="#805ad5">路径维度：</text>
  <text x="550" y="275" font-size="9" fill="#2d3748">敏感路径访问 · 404 高频</text>

  <text x="550" y="305" font-size="10" font-weight="bold" fill="#dd6b20">UA 维度：</text>
  <text x="550" y="325" font-size="9" fill="#2d3748">扫描器 UA（sqlmap/nikto）</text>

  <text x="550" y="355" font-size="10" font-weight="bold" fill="#3182ce">时间维度：</text>
  <text x="550" y="375" font-size="9" fill="#2d3748">深夜异常访问 · 频率突变</text>

  <text x="550" y="405" font-size="10" font-weight="bold" fill="#38a169">状态码维度：</text>
  <text x="550" y="425" font-size="9" fill="#2d3748">500 错误日志分析</text>
  <text x="550" y="445" font-size="9" fill="#2d3748">200/404 比例异常</text>
</svg>
