<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="500" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">日志分析：攻击痕迹查找流程</text>

  <rect x="40" y="60" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="110" y="88" font-size="11" text-anchor="middle" fill="#744210" font-weight="bold">收集日志</text>
  <text x="110" y="102" font-size="9" text-anchor="middle" fill="#744210">Nginx/系统/应用</text>

  <line x1="180" y1="85" x2="215" y2="85" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="220" y="60" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="290" y="88" font-size="11" text-anchor="middle" fill="#44337a" font-weight="bold">时间线对齐</text>
  <text x="290" y="102" font-size="9" text-anchor="middle" fill="#44337a">按攻击时间排序</text>

  <line x1="360" y1="85" x2="395" y2="85" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="400" y="60" width="140" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="470" y="88" font-size="11" text-anchor="middle" fill="#2a4365" font-weight="bold">筛选异常</text>
  <text x="470" y="102" font-size="9" text-anchor="middle" fill="#2a4365">404/500/慢请求</text>

  <line x1="540" y1="85" x2="575" y2="85" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="580" y="60" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="650" y="88" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">Payload 识别</text>
  <text x="650" y="102" font-size="9" text-anchor="middle" fill="#c53030">SQL/XSS/路径</text>

  <line x1="720" y1="85" x2="755" y2="85" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="760" y="60" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="830" y="88" font-size="11" text-anchor="middle" fill="#22543d" font-weight="bold">关联分析</text>
  <text x="830" y="102" font-size="9" text-anchor="middle" fill="#22543d">攻击者/工具/IP</text>

  <line x1="900" y1="85" x2="935" y2="85" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="40" y="140" width="450" height="320" rx="12" fill="#ebf8ff" stroke="#4299e1" stroke-width="2"/>
  <text x="265" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#2b6cb0">access.log 关键字段</text>

  <text x="70" y="200" font-size="10" fill="#2d3748">$remote_addr — 客户端 IP（攻击者来源）</text>
  <text x="70" y="230" font-size="10" fill="#2d3748">$time_local — 访问时间（对齐攻击时间线）</text>
  <text x="70" y="260" font-size="10" fill="#2d3748">$request — 请求行（URL/参数 = Payload 位置）</text>
  <text x="70" y="290" font-size="10" fill="#2d3748">$status — 状态码（404=扫描 500=报错注入）</text>
  <text x="70" y="320" font-size="10" fill="#2d3748">$body_bytes_sent — 响应体大小（数据泄露指标）</text>
  <text x="70" y="350" font-size="10" fill="#2d3748">$http_referer — 来源页（CSRF 攻击源）</text>
  <text x="70" y="380" font-size="10" fill="#2d3748">$http_user_agent — 浏览器标识（工具特征识别）</text>
  <text x="70" y="410" font-size="10" fill="#2d3748">$http_x_forwarded_for — 代理 IP（绕过识别）</text>
  <text x="70" y="440" font-size="10" fill="#2d3748">$request_time — 响应时间（慢查询/DoS 指标）</text>

  <rect x="510" y="140" width="450" height="320" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="735" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">常见攻击痕迹关键词</text>

  <text x="540" y="195" font-size="10" font-weight="bold" fill="#c53030">SQL 注入:</text>
  <text x="540" y="215" font-size="9" fill="#2d3748">UNION/SELECT/sleep()/BENCHMARK/' OR '1'='1</text>
  <text x="540" y="245" font-size="10" font-weight="bold" fill="#805ad5">XSS:</text>
  <text x="540" y="265" font-size="9" fill="#2d3748">&lt;script/&lt;img onerror=/alert(/onload=</text>
  <text x="540" y="295" font-size="10" font-weight="bold" fill="#dd6b20">命令注入:</text>
  <text x="540" y="315" font-size="9" fill="#2d3748">;|&amp;&amp;/system(/exec(/passthru(/shell_exec(</text>
  <text x="540" y="345" font-size="10" font-weight="bold" fill="#3182ce">路径穿越:</text>
  <text x="540" y="365" font-size="9" fill="#2d3748">../etc/passwd/%00/.env/web.config</text>
  <text x="540" y="395" font-size="10" font-weight="bold" fill="#38a169">WebShell 上传:</text>
  <text x="540" y="415" font-size="9" fill="#2d3748">.php/.asp/.jsp POST /upload/ 返回 200</text>
  <text x="540" y="440" font-size="10" font-weight="bold" fill="#2c5282">扫描器:</text>
  <text x="540" y="455" font-size="9" fill="#2d3748">Nikto/dirsearch/Nuclei 特征 UA</text>
</svg>
