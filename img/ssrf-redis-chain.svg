<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="360" fill="#f8fafc" rx="10"/>
  <text x="20" y="34" font-size="20" font-weight="bold" fill="#111">攻击链：SSRF → 内网 Redis 未授权 → Getshell</text>

  <rect x="20" y="110" width="150" height="100" rx="10" fill="#fee2e2" stroke="#333" stroke-width="2"/>
  <text x="95" y="155" font-size="16" text-anchor="middle" fill="#111">攻击者</text>

  <rect x="240" y="110" width="180" height="100" rx="10" fill="#dbeafe" stroke="#333" stroke-width="2"/>
  <text x="330" y="150" font-size="16" text-anchor="middle" fill="#111">Web 应用</text>
  <text x="330" y="176" font-size="13" text-anchor="middle" fill="#b91c1c">SSRF 漏洞（入口）</text>
  <text x="330" y="196" font-size="12" text-anchor="middle" fill="#666">URL 预览/图片代理</text>

  <rect x="500" y="110" width="180" height="100" rx="10" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="590" y="150" font-size="16" text-anchor="middle" fill="#111">内网 Redis</text>
  <text x="590" y="176" font-size="13" text-anchor="middle" fill="#b45309">未授权访问 6379</text>

  <rect x="750" y="110" width="130" height="100" rx="10" fill="#dcfce7" stroke="#333" stroke-width="2"/>
  <text x="815" y="150" font-size="16" text-anchor="middle" fill="#111">Getshell</text>
  <text x="815" y="176" font-size="12" text-anchor="middle" fill="#333">crontab / WebShell</text>

  <line x1="170" y1="160" x2="235" y2="160" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="420" y1="160" x2="495" y2="160" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="680" y1="160" x2="745" y2="160" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>

  <text x="205" y="140" font-size="12" fill="#666" text-anchor="middle">1. 请求</text>
  <text x="460" y="140" font-size="12" fill="#666" text-anchor="middle">2. SSRF 访问内网</text>
  <text x="712" y="140" font-size="12" fill="#666" text-anchor="middle">3. CONFIG 写入</text>

  <text x="20" y="260" font-size="14" fill="#333">关键点：</text>
  <text x="20" y="286" font-size="13" fill="#666">SSRF 提供“进内网的路”，Redis 未授权提供“执行入口”，两者缺一不可</text>
  <text x="20" y="312" font-size="13" fill="#666">防御：SSRF 白名单/禁内网 + Redis 认证/绑内网 + 网络隔离（见漏洞联动篇）</text>
</svg>
