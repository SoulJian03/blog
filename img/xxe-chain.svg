<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">XXE XML外部实体注入攻击链</text>

  <rect x="40" y="70" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="102" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① 发现 XML</text>

  <rect x="200" y="70" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="270" y="102" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② 注入 DTD</text>

  <rect x="360" y="70" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="430" y="102" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 文件读取</text>

  <rect x="520" y="70" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="590" y="102" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ SSRF</text>

  <rect x="680" y="70" width="140" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="750" y="102" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ OOB 外带</text>

  <rect x="840" y="70" width="120" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="900" y="102" font-size="11" text-anchor="middle" fill="#276749" font-weight="bold">⑥ RCE</text>

  <rect x="40" y="150" width="460" height="300" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">XXE 利用方式</text>

  <text x="70" y="205" font-size="10" font-weight="bold" fill="#c53030">基础注入：</text>
  <text x="70" y="225" font-size="9" fill="#2d3748">&lt;?xml version="1.0"?</text>
  <text x="70" y="245" font-size="9" fill="#2d3748">&lt;!DOCTYPE foo [</text>
  <text x="70" y="265" font-size="9" fill="#2d3748">&lt;!ENTITY xxe SYSTEM "file:///etc/passwd"&gt;</text>
  <text x="70" y="285" font-size="9" fill="#2d3748">]&gt;</text>
  <text x="70" y="305" font-size="9" fill="#2d3748">&lt;foo&gt;&amp;xxe;&lt;/foo&gt;</text>

  <text x="70" y="335" font-size="10" font-weight="bold" fill="#805ad5">攻击类型：</text>
  <text x="70" y="355" font-size="9" fill="#2d3748">文件读取：file:// /proc/self/environ</text>
  <text x="70" y="375" font-size="9" fill="#2d3748">SSRF：http://internal-service/</text>
  <text x="70" y="395" font-size="9" fill="#2d3748">OOB 外带：读取无回显文件</text>
  <text x="70" y="415" font-size="9" fill="#2d3748">RCE：php://filter · expect://</text>
  <text x="70" y="435" font-size="9" fill="#2d3748">DoS：&lt;!ENTITY bomb "&amp;bomb;&amp;bomb;"&gt;</text>

  <rect x="520" y="150" width="440" height="300" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">防御方法</text>

  <text x="550" y="205" font-size="10" font-weight="bold" fill="#c53030">禁用 DTD：</text>
  <text x="550" y="225" font-size="9" fill="#2d3748">设置 XML parser 不允许外部实体</text>
  <text x="550" y="245" font-size="9" fill="#2d3748">libxml_disable_entity_loader(true)</text>

  <text x="550" y="275" font-size="10" font-weight="bold" fill="#805ad5">使用白名单：</text>
  <text x="550" y="295" font-size="9" fill="#2d3748">只允许安全的 XML 格式</text>
  <text x="550" y="315" font-size="9" fill="#2d3748">使用 JSON 替代 XML</text>

  <text x="550" y="345" font-size="10" font-weight="bold" fill="#dd6b20">框架防护：</text>
  <text x="550" y="365" font-size="9" fill="#2d3748">更新依赖库到安全版本</text>
  <text x="550" y="385" font-size="9" fill="#2d3748">WAF 规则检测 XXE payload</text>

  <text x="550" y="415" font-size="10" font-weight="bold" fill="#3182ce">代码层面：</text>
  <text x="550" y="435" font-size="9" fill="#2d3748">禁止使用外部实体解析</text>
  <text x="550" y="455" font-size="9" fill="#2d3748">使用 safe XML parser</text>
</svg>
