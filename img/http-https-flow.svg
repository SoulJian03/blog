<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="500" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">HTTP/HTTPS 工作原理</text>

  <rect x="40" y="60" width="200" height="60" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="140" y="88" font-size="12" text-anchor="middle" fill="#2a4365" font-weight="bold">HTTP（明文）</text>
  <text x="140" y="108" font-size="9" text-anchor="middle" fill="#2a4365">请求 → 响应</text>

  <rect x="400" y="60" width="200" height="60" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="500" y="88" font-size="12" text-anchor="middle" fill="#22543d" font-weight="bold">HTTPS = HTTP + TLS</text>
  <text x="500" y="108" font-size="9" text-anchor="middle" fill="#22543d">加密传输</text>

  <rect x="760" y="60" width="200" height="60" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="860" y="88" font-size="12" text-anchor="middle" fill="#744210" font-weight="bold">TLS 握手</text>
  <text x="860" y="108" font-size="9" text-anchor="middle" fill="#744210">密钥交换</text>

  <rect x="40" y="145" width="460" height="320" rx="12" fill="#ebf8ff" stroke="#4299e1" stroke-width="2"/>
  <text x="270" y="170" font-size="12" font-weight="bold" text-anchor="middle" fill="#2b6cb0">HTTP 请求报文结构</text>

  <text x="70" y="200" font-size="10" fill="#2d3748">GET /path?param=value HTTP/1.1</text>
  <text x="70" y="220" font-size="10" fill="#2d3748">Host: example.com</text>
  <text x="70" y="240" font-size="10" fill="#2d3748">User-Agent: Mozilla/5.0</text>
  <text x="70" y="260" font-size="10" fill="#2d3748">Accept: text/html</text>
  <text x="70" y="280" font-size="10" fill="#2d3748">Cookie: session=abc123</text>
  <text x="70" y="300" font-size="10" fill="#2d3748">Authorization: Bearer token</text>
  <text x="70" y="320" font-size="10" fill="#2d3748">Content-Type: application/json</text>
  <text x="70" y="340" font-size="10" fill="#2d3748">Content-Length: 45</text>
  <text x="70" y="360" font-size="10" fill="#2d3748">(空行分隔头与体)</text>
  <text x="70" y="380" font-size="10" fill="#2d3748">{"key":"value"}</text>

  <text x="70" y="410" font-size="10" font-weight="bold" fill="#c53030">安全注意：</text>
  <text x="70" y="430" font-size="9" fill="#2d3748">HTTP 明文传输 → 抓包即可看到所有数据</text>
  <text x="70" y="450" font-size="9" fill="#2d3748">Cookie/Token/密码在 HTTP 下完全暴露</text>

  <rect x="520" y="145" width="440" height="320" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="170" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">TLS 1.3 握手流程</text>

  <text x="550" y="200" font-size="10" fill="#2d3748">① ClientHello: 支持的密码套件</text>
  <text x="550" y="220" font-size="10" fill="#2d3748">② ServerHello: 选择的密码套件</text>
  <text x="550" y="240" font-size="10" fill="#2d3748">③ Server 证书 + 密钥交换</text>
  <text x="550" y="260" font-size="10" fill="#2d3748">④ Client 验证证书 → 生成密钥</text>
  <text x="550" y="280" font-size="10" fill="#2d3748">⑤ Finished → 加密通信开始</text>

  <text x="550" y="310" font-size="10" font-weight="bold" fill="#c53030">证书验证：</text>
  <text x="550" y="330" font-size="9" fill="#2d3748">① 证书有效期</text>
  <text x="550" y="350" font-size="9" fill="#2d3748">② 颁发机构（CA）是否可信</text>
  <text x="550" y="370" font-size="9" fill="#2d3748">③ 域名是否匹配</text>
  <text x="550" y="390" font-size="9" fill="#2d3748">④ 证书链是否完整</text>

  <text x="550" y="420" font-size="10" font-weight="bold" fill="#38a169">抓包工具：</text>
  <text x="550" y="440" font-size="9" fill="#2d3748">Wireshark（抓包分析）</text>
  <text x="550" y="460" font-size="9" fill="#2d3748">Fiddler / Charles（HTTPS 解密）</text>
</svg>
