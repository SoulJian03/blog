<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="500" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c53030"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">内网渗透：信息收集与存活探测</text>

  <rect x="40" y="60" width="150" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="115" y="92" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① 探测存活主机</text>
  <text x="115" y="108" font-size="9" text-anchor="middle" fill="#c53030">ping sweep / ARP</text>

  <line x1="190" y1="85" x2="225" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="230" y="60" width="150" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="305" y="92" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② 端口扫描</text>
  <text x="305" y="108" font-size="9" text-anchor="middle" fill="#b7791f">nmap / masscan</text>

  <line x1="380" y1="85" x2="415" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="420" y="60" width="150" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="495" y="92" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 服务指纹</text>
  <text x="495" y="108" font-size="9" text-anchor="middle" fill="#805ad5">OS / 服务 / 版本</text>

  <line x1="570" y1="85" x2="605" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="610" y="60" width="150" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="685" y="92" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 漏洞扫描</text>
  <text x="685" y="108" font-size="9" text-anchor="middle" fill="#38a169">nuclei / 手工验证</text>

  <line x1="760" y1="85" x2="795" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="800" y="60" width="160" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="880" y="92" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ 弱口令爆破</text>

  <rect x="40" y="140" width="450" height="330" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="265" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">信息收集技术栈</text>

  <text x="70" y="195" font-size="10" font-weight="bold" fill="#c53030">存活探测：</text>
  <text x="70" y="215" font-size="9" fill="#2d3748">fping -a 192.168.1.0/24</text>
  <text x="70" y="235" font-size="9" fill="#2d3748">nmap -sn 192.168.1.0/24</text>
  <text x="70" y="255" font-size="9" fill="#2d3748">arp-scan -l</text>

  <text x="70" y="280" font-size="10" font-weight="bold" fill="#805ad5">端口扫描：</text>
  <text x="70" y="300" font-size="9" fill="#2d3748">nmap -sS -sV -O -p- target</text>
  <text x="70" y="320" font-size="9" fill="#2d3748">masscan -p1-65535 192.168.1.0/24</text>

  <text x="70" y="345" font-size="10" font-weight="bold" fill="#dd6b20">漏洞扫描：</text>
  <text x="70" y="365" font-size="9" fill="#2d3748">nuclei -t cves/ -u http://target</text>
  <text x="70" y="385" font-size="9" fill="#2d3748">nmap --script=vuln target</text>

  <text x="70" y="410" font-size="10" font-weight="bold" fill="#3182ce">弱口令：</text>
  <text x="70" y="430" font-size="9" fill="#2d3748">hydra -l admin -P rockyou.txt ssh://target</text>
  <text x="70" y="450" font-size="9" fill="#2d3748">medusa -u admin -P rockyou.txt -M ssh</text>

  <text x="70" y="475" font-size="10" font-weight="bold" fill="#38a169">内网扫描：</text>
  <text x="70" y="485" font-size="9" fill="#2d3748">net view / wmic / BloodHound</text>

  <rect x="510" y="140" width="460" height="330" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">内网信息收集清单</text>

  <text x="540" y="195" font-size="10" font-weight="bold" fill="#c53030">Windows：</text>
  <text x="540" y="215" font-size="9" fill="#2d3748">ipconfig /all · net user · net group</text>
  <text x="540" y="235" font-size="9" fill="#2d3748">net view · net share · tasklist</text>
  <text x="540" y="255" font-size="9" fill="#2d3748">wmic qfe list · wmic process list</text>
  <text x="540" y="275" font-size="9" fill="#2d3748">reg query HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall</text>

  <text x="540" y="305" font-size="10" font-weight="bold" fill="#805ad5">Linux：</text>
  <text x="540" y="325" font-size="9" fill="#2d3748">hostname · ifconfig · cat /etc/passwd</text>
  <text x="540" y="345" font-size="9" fill="#2d3748">cat /etc/shadow · ls -la /home/</text>
  <text x="540" y="365" font-size="9" fill="#2d3748">cat /etc/crontab · ls -la /var/spool/cron/</text>
  <text x="540" y="385" font-size="9" fill="#2d3748">ps aux · lsof -i</text>

  <text x="540" y="415" font-size="10" font-weight="bold" fill="#dd6b20">域名/内网：</text>
  <text x="540" y="435" font-size="9" fill="#2d3748">cat /etc/hosts · cat /etc/resolv.conf</text>
  <text x="540" y="455" font-size="9" fill="#2d3748">arp -a · netstat -rn</text>
  <text x="540" y="475" font-size="9" fill="#2d3748">nbtscan 192.168.1.0/24</text>
</svg>
