<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">目录爆破：dirsearch 与 ffuf 实战</text>

  <rect x="40" y="60" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="92" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">dirsearch</text>

  <rect x="200" y="60" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="270" y="92" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">ffuf</text>

  <rect x="360" y="60" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="430" y="92" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">Gobuster</text>

  <rect x="520" y="60" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="590" y="92" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">wfuzz</text>

  <rect x="680" y="60" width="140" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="750" y="92" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">arjun（参数）</text>

  <rect x="840" y="60" width="120" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="900" y="92" font-size="11" text-anchor="middle" fill="#276749" font-weight="bold"> nuclei</text>

  <rect x="40" y="140" width="460" height="310" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">dirsearch 命令</text>

  <text x="70" y="195" font-size="10" font-weight="bold" fill="#c53030">基础：</text>
  <text x="70" y="215" font-size="9" fill="#2d3748">dirsearch -u http://target -e .php,.html</text>

  <text x="70" y="240" font-size="10" font-weight="bold" fill="#805ad5">字典：</text>
  <text x="70" y="260" font-size="9" fill="#2d3748">dirsearch -u http://target -w /path/big.txt</text>

  <text x="70" y="285" font-size="10" font-weight="bold" fill="#dd6b20">深度：</text>
  <text x="70" y="305" font-size="9" fill="#2d3748">dirsearch -u http://target --deep</text>

  <text x="70" y="330" font-size="10" font-weight="bold" fill="#3182ce">Header：</text>
  <text x="70" y="350" font-size="9" fill="#2d3748">dirsearch -u http://target -H "Cookie: admin=1"</text>

  <text x="70" y="375" font-size="10" font-weight="bold" fill="#38a169">过滤：</text>
  <text x="70" y="395" font-size="9" fill="#2d3748">dirsearch -u http://target --exclude-status 404</text>

  <text x="70" y="420" font-size="10" font-weight="bold" fill="#276749">输出：</text>
  <text x="70" y="440" font-size="9" fill="#2d3748">dirsearch -u http://target -o report.json</text>

  <text x="70" y="465" font-size="10" font-weight="bold" fill="#c53030">线程：</text>
  <text x="70" y="475" font-size="9" fill="#2d3748">dirsearch -u http://target -t 50</text>

  <rect x="520" y="140" width="440" height="310" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">ffuf 命令</text>

  <text x="550" y="195" font-size="10" font-weight="bold" fill="#c53030">目录爆破：</text>
  <text x="550" y="215" font-size="9" fill="#2d3748">ffuf -u http://target/FUZZ -w words.txt</text>

  <text x="550" y="240" font-size="10" font-weight="bold" fill="#805ad5">参数爆破：</text>
  <text x="550" y="260" font-size="9" fill="#2d3748">ffuf -u http://target/?id=FUZZ -w params.txt</text>

  <text x="550" y="285" font-size="10" font-weight="bold" fill="#dd6b20">Header 爆破：</text>
  <text x="550" y="305" font-size="9" fill="#2d3748">ffuf -u http://target -H "X-Forwarded-For: FUZZ"</text>

  <text x="550" y="330" font-size="10" font-weight="bold" fill="#3182ce">POST 数据：</text>
  <text x="550" y="350" font-size="9" fill="#2d3748">ffuf -u http://target -d "id=FUZZ" -w words.txt</text>

  <text x="550" y="375" font-size="10" font-weight="bold" fill="#38a169">排除：</text>
  <text x="550" y="395" font-size="9" fill="#2d3748">ffuf -u http://target/FUZZ -w w.txt -fc 404</text>

  <text x="550" y="420" font-size="10" font-weight="bold" fill="#276749">多线程：</text>
  <text x="550" y="440" font-size="9" fill="#2d3748">ffuf -u http://target/FUZZ -w w.txt -t 100</text>

  <text x="550" y="465" font-size="10" font-weight="bold" fill="#c53030">正则：</text>
  <text x="550" y="475" font-size="9" fill="#2d3748">ffuf -u http://target/FUZZ -w w.txt -mr "admin"</text>
</svg>
