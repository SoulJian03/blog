<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3182ce"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">子域名枚举：subfinder + 多源联动</text>

  <rect x="40" y="60" width="150" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="115" y="92" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① subfinder</text>

  <line x1="190" y1="85" x2="225" y2="85" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="230" y="60" width="150" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="305" y="92" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② amass</text>

  <line x1="380" y1="85" x2="415" y2="85" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="420" y="60" width="150" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="495" y="92" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ OneForAll</text>

  <line x1="570" y1="85" x2="605" y2="85" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="610" y="60" width="150" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="685" y="92" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 存活验证</text>

  <line x1="760" y1="85" x2="795" y2="85" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="800" y="60" width="170" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="885" y="92" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ 资产入库</text>

  <rect x="40" y="140" width="460" height="310" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">subfinder 实战命令</text>

  <text x="70" y="195" font-size="10" font-weight="bold" fill="#c53030">基础使用：</text>
  <text x="70" y="215" font-size="9" fill="#2d3748">subfinder -d example.com</text>

  <text x="70" y="240" font-size="10" font-weight="bold" fill="#805ad5">输出到文件：</text>
  <text x="70" y="260" font-size="9" fill="#2d3748">subfinder -d example.com -o sub.txt</text>

  <text x="70" y="285" font-size="10" font-weight="bold" fill="#dd6b20">指定数据源：</text>
  <text x="70" y="305" font-size="9" fill="#2d3748">subfinder -d example.com -sources alienvault</text>

  <text x="70" y="330" font-size="10" font-weight="bold" fill="#3182ce">多线程：</text>
  <text x="70" y="350" font-size="9" fill="#2d3748">subfinder -d example.com -t 20</text>

  <text x="70" y="375" font-size="10" font-weight="bold" fill="#38a169">批量域名：</text>
  <text x="70" y="395" font-size="9" fill="#2d3748">subfinder -l domains.txt -o result.txt</text>

  <text x="70" y="420" font-size="10" font-weight="bold" fill="#276749">存活验证：</text>
  <text x="70" y="440" font-size="9" fill="#2d3748">cat sub.txt | httpx -threads 200</text>

  <text x="70" y="465" font-size="10" font-weight="bold" fill="#c53030">DNS 爆破：</text>
  <text x="70" y="475" font-size="9" fill="#2d3748">subfinder -d example.com -e（启用枚举）</text>

  <rect x="520" y="140" width="440" height="310" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">数据源对比</text>

  <text x="550" y="195" font-size="10" font-weight="bold" fill="#c53030">免费数据源：</text>
  <text x="550" y="215" font-size="9" fill="#2d3748">AlienVault · Censys · Certificate</text>
  <text x="550" y="235" font-size="9" fill="#2d3748">SecurityTrails · HackerOne</text>
  <text x="550" y="255" font-size="9" fill="#2d3748">Shodan · Fullhunt</text>

  <text x="550" y="285" font-size="10" font-weight="bold" fill="#805ad5">付费数据源：</text>
  <text x="550" y="305" font-size="9" fill="#2d3748">DNS DB · 需要 API KEY</text>

  <text x="550" y="335" font-size="10" font-weight="bold" fill="#dd6b20">配合工具：</text>
  <text x="550" y="355" font-size="9" fill="#2d3748">amass（深度枚举）</text>
  <text x="550" y="375" font-size="9" fill="#2d3748">OneForAll（全源整合）</text>
  <text x="550" y="395" font-size="9" fill="#2d3748">httpx（存活验证）</text>

  <text x="550" y="425" font-size="10" font-weight="bold" fill="#3182ce">工作流：</text>
  <text x="550" y="445" font-size="9" fill="#2d3748">subfinder → amass → 去重 → httpx</text>
  <text x="550" y="465" font-size="9" fill="#2d3748">→ nuclei 扫描 → ARL 入库</text>
</svg>
