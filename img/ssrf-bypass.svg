<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="460" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c53030"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">SSRF 深入利用与绕过手法</text>

  <rect x="40" y="60" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="92" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① 发现 SSRF</text>
  <text x="110" y="108" font-size="9" text-anchor="middle" fill="#c53030">URL 参数/图片抓取</text>

  <line x1="180" y1="85" x2="215" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="220" y="60" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="290" y="92" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② 探测内网</text>
  <text x="290" y="108" font-size="9" text-anchor="middle" fill="#b7791f">127.0.0.1/内网IP</text>

  <line x1="360" y1="85" x2="395" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="400" y="60" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="470" y="92" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 绕过过滤</text>
  <text x="470" y="108" font-size="9" text-anchor="middle" fill="#805ad5">IP转换/协议</text>

  <line x1="540" y1="85" x2="575" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="580" y="60" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="650" y="92" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 利用内网服务</text>
  <text x="650" y="108" font-size="9" text-anchor="middle" fill="#38a169">Redis/Metadata/K8s</text>

  <line x1="720" y1="85" x2="755" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="760" y="60" width="200" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="860" y="92" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ Getshell / 云权限</text>

  <rect x="40" y="140" width="450" height="280" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="265" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">SSRF 绕过手法</text>

  <text x="70" y="195" font-size="10" font-weight="bold" fill="#c53030">1. 协议绕过</text>
  <text x="70" y="215" font-size="9" fill="#2d3748">file:///etc/passwd</text>
  <text x="70" y="235" font-size="9" fill="#2d3748">gopher://127.0.0.1:6379/_set</text>
  <text x="70" y="255" font-size="9" fill="#2d3748">dict://127.0.0.1:11211</text>
  <text x="70" y="275" font-size="9" fill="#2d3748">sftp://127.0.0.1:22</text>

  <text x="70" y="300" font-size="10" font-weight="bold" fill="#805ad5">2. IP 格式绕过</text>
  <text x="70" y="320" font-size="9" fill="#2d3748">127.0.0.1 = 0177.0.0.1 (八进制)</text>
  <text x="70" y="340" font-size="9" fill="#2d3748">127.0.0.1 = 2130706433 (十进制)</text>
  <text x="70" y="360" font-size="9" fill="#2d3748">127.0.0.1 = 0x7f000001 (十六进制)</text>
  <text x="70" y="380" font-size="9" fill="#2d3748">127.0.0.1 = 127.1 (省略补全)</text>
  <text x="70" y="400" font-size="9" fill="#2d3748">127.0.0.1 = [::1]:80 (IPv6)</text>

  <text x="70" y="425" font-size="10" font-weight="bold" fill="#dd6b20">3. DNS 重绑定</text>
  <text x="70" y="445" font-size="9" fill="#2d3748">域名首次解析外部IP → 二次解析内网IP</text>

  <rect x="510" y="140" width="460" height="280" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">SSRF 利用场景</text>

  <text x="540" y="195" font-size="10" font-weight="bold" fill="#c53030">1. 云元数据</text>
  <text x="540" y="215" font-size="9" fill="#2d3748">169.254.169.254 获取云凭据</text>

  <text x="540" y="240" font-size="10" font-weight="bold" fill="#805ad5">2. 内网 Redis 未授权</text>
  <text x="540" y="260" font-size="9" fill="#2d3748">gopher://127.0.0.1:6379/_</text>
  <text x="540" y="275" font-size="9" fill="#2d3748">写入 crontab / webshell</text>

  <text x="540" y="300" font-size="10" font-weight="bold" fill="#dd6b20">3. 内网端口扫描</text>
  <text x="540" y="320" font-size="9" fill="#2d3748">探测 80/443/6379/27017/8080</text>

  <text x="540" y="345" font-size="10" font-weight="bold" fill="#3182ce">4. 文件读取</text>
  <text x="540" y="365" font-size="9" fill="#2d3748">file:// 读取配置文件/密码</text>

  <text x="540" y="390" font-size="10" font-weight="bold" fill="#38a169">防御：</text>
  <text x="540" y="410" font-size="9" fill="#2d3748">URL 白名单 + 禁用非 http(s) 协议</text>
  <text x="540" y="425" font-size="9" fill="#2d3748">禁止内网 IP + 元数据 IP</text>
  <text x="540" y="440" font-size="9" fill="#2d3748">网络层隔离 SSRF 出口</text>
</svg>
