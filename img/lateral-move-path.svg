<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="460" fill="#f8fafc" rx="10"/>
  <text x="20" y="36" font-size="20" font-weight="bold" fill="#111">内网横向移动路径</text>

  <!-- 入口机 -->
  <rect x="30" y="150" width="180" height="120" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="120" y="195" font-size="17" text-anchor="middle" fill="#b91c1c" font-weight="bold">入口主机（已拿下）</text>
  <text x="120" y="220" font-size="13" text-anchor="middle" fill="#666">通过 Web 漏洞/弱口令进入</text>
  <text x="120" y="244" font-size="13" text-anchor="middle" fill="#666">mimikatz 抓凭据</text>

  <!-- 凭据 -->
  <rect x="310" y="150" width="220" height="120" rx="10" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="420" y="195" font-size="17" text-anchor="middle" fill="#b45309" font-weight="bold">凭据：NTLM 哈希 / 票据 / 明文</text>
  <text x="420" y="220" font-size="13" text-anchor="middle" fill="#666">PtH / PtT / 弱口令</text>
  <text x="420" y="244" font-size="13" text-anchor="middle" fill="#666">管理密码复用 = 放大影响面</text>

  <!-- 目标主机 -->
  <rect x="620" y="60" width="140" height="80" rx="10" fill="#dbeafe" stroke="#333" stroke-width="2"/>
  <text x="690" y="95" font-size="16" text-anchor="middle" fill="#111">主机 A</text>
  <text x="690" y="118" font-size="12" text-anchor="middle" fill="#666">SMB 445</text>
  <rect x="620" y="150" width="140" height="80" rx="10" fill="#dbeafe" stroke="#333" stroke-width="2"/>
  <text x="690" y="185" font-size="16" text-anchor="middle" fill="#111">主机 B</text>
  <text x="690" y="208" font-size="12" text-anchor="middle" fill="#666">WMI / WinRM</text>
  <rect x="620" y="240" width="140" height="80" rx="10" fill="#dbeafe" stroke="#333" stroke-width="2"/>
  <text x="690" y="275" font-size="16" text-anchor="middle" fill="#111">主机 C</text>
  <text x="690" y="298" font-size="12" text-anchor="middle" fill="#666">RDP 3389</text>

  <!-- 域控 -->
  <rect x="790" y="300" width="100" height="90" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="3"/>
  <text x="840" y="335" font-size="15" text-anchor="middle" fill="#7e22ce" font-weight="bold">域控</text>
  <text x="840" y="358" font-size="12" text-anchor="middle" fill="#666">最终目标</text>

  <!-- arrows -->
  <line x1="210" y1="210" x2="305" y2="210" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="530" y1="190" x2="615" y2="105" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="530" y1="210" x2="615" y2="190" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="530" y1="230" x2="615" y2="275" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="760" y1="280" x2="790" y2="330" stroke="#7e22ce" stroke-width="3" marker-end="url(#arr)"/>

  <text x="400" y="130" font-size="13" fill="#b45309" text-anchor="middle">凭据+可达服务+权限</text>
  <text x="770" y="300" font-size="12" fill="#7e22ce" text-anchor="middle">提权/票据</text>

  <text x="30" y="410" font-size="13" fill="#666">工具：impacket(psexec/wmiexec/smbexec)、CrackMapExec、evil-winrm；检测：同一账号多主机登录、LSASS 读取</text>
</svg>
