<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">WebLogic WLS-WSAT 反序列化 RCE（CVE-2020-14882）</text>

  <rect x="40" y="70" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="102" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① 发现 WebLogic</text>

  <rect x="200" y="70" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="270" y="102" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② 确认版本</text>

  <rect x="360" y="70" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="430" y="102" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 开启 T3</text>

  <rect x="520" y="70" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="590" y="102" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 构造 payload</text>

  <rect x="680" y="70" width="140" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="750" y="102" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ 发送 EXP</text>

  <rect x="840" y="70" width="120" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="900" y="102" font-size="11" text-anchor="middle" fill="#276749" font-weight="bold">⑥ Shell</text>

  <rect x="40" y="150" width="460" height="300" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">CVE-2020-14882 利用</text>

  <text x="70" y="205" font-size="10" font-weight="bold" fill="#c53030">漏洞信息：</text>
  <text x="70" y="225" font-size="9" fill="#2d3748">影响：WebLogic 10.3.6/12.1.3/12.2.1</text>
  <text x="70" y="245" font-size="9" fill="#2d3748">模块：WLS-WSAT（无需登录）</text>
  <text x="70" y="265" font-size="9" fill="#2d3748">入口：/wls-wsat/CoordinatorPortType</text>

  <text x="70" y="295" font-size="10" font-weight="bold" fill="#805ad5">利用前提：</text>
  <text x="70" y="315" font-size="9" fill="#2d3748">未开启 T3 协议（需利用 HTTP 开启）</text>
  <text x="70" y="335" font-size="9" fill="#2d3748">或使用 T3 协议直接利用</text>

  <text x="70" y="365" font-size="10" font-weight="bold" fill="#dd6b20">EXP 步骤：</text>
  <text x="70" y="385" font-size="9" fill="#2d3748">1. 确认版本（/console）</text>
  <text x="70" y="405" font-size="9" fill="#2d3748">2. 构造 JNDI 反序列化 payload</text>
  <text x="70" y="425" font-size="9" fill="#2d3748">3. 发送至 /wls-wsat/CoordinatorPortType</text>
  <text x="70" y="445" font-size="9" fill="#2d3748">4. 反弹 Shell</text>

  <rect x="520" y="150" width="440" height="300" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">防御加固</text>

  <text x="550" y="205" font-size="10" font-weight="bold" fill="#c53030">升级补丁：</text>
  <text x="550" y="225" font-size="9" fill="#2d3748">升级到 WebLogic 12.2.1.4+</text>
  <text x="550" y="245" font-size="9" fill="#2d3748">或应用 Oracle 安全补丁</text>

  <text x="550" y="275" font-size="10" font-weight="bold" fill="#805ad5">关闭 T3：</text>
  <text x="550" y="295" font-size="9" fill="#2d3748">weblogic.xml 中禁用 T3 协议</text>

  <text x="550" y="325" font-size="10" font-weight="bold" fill="#dd6b20">网络隔离：</text>
  <text x="550" y="345" font-size="9" fill="#2d3748">WebLogic 不暴露公网</text>
  <text x="550" y="365" font-size="9" fill="#2d3748">WAF 拦截 /wls-wsat/ 路径</text>

  <text x="550" y="395" font-size="10" font-weight="bold" fill="#3182ce">监控：</text>
  <text x="550" y="415" font-size="9" fill="#2d3748">监控 /wls-wsat/ 访问日志</text>
  <text x="550" y="435" font-size="9" fill="#2d3748">异常 RCE 调用告警</text>
</svg>
