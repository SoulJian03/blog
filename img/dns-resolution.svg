<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="500" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3182ce"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">DNS 域名解析完整流程</text>

  <rect x="40" y="60" width="150" height="55" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="115" y="88" font-size="11" text-anchor="middle" fill="#2a4365" font-weight="bold">① 浏览器缓存</text>
  <text x="115" y="105" font-size="9" text-anchor="middle" fill="#2a4365">先查本地缓存</text>

  <line x1="190" y1="87" x2="225" y2="87" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="230" y="60" width="150" height="55" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="305" y="88" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② hosts 文件</text>
  <text x="305" y="105" font-size="9" text-anchor="middle" fill="#b7791f">/etc/hosts</text>

  <line x1="380" y1="87" x2="415" y2="87" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="420" y="60" width="150" height="55" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="495" y="88" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 递归 DNS</text>
  <text x="495" y="105" font-size="9" text-anchor="middle" fill="#805ad5">运营商 DNS（如 114.114.114.114）</text>

  <line x1="570" y1="87" x2="605" y2="87" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="610" y="60" width="150" height="55" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="685" y="88" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 根域名服务器</text>
  <text x="685" y="105" font-size="9" text-anchor="middle" fill="#38a169">.com / .cn 等 TLD</text>

  <line x1="760" y1="87" x2="795" y2="87" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="800" y="60" width="170" height="55" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="885" y="88" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ 权威域名服务器</text>
  <text x="885" y="105" font-size="9" text-anchor="middle" fill="#3182ce">返回 IP 地址</text>

  <rect x="40" y="145" width="460" height="320" rx="12" fill="#ebf8ff" stroke="#4299e1" stroke-width="2"/>
  <text x="270" y="170" font-size="12" font-weight="bold" text-anchor="middle" fill="#2b6cb0">DNS 攻击类型</text>

  <text x="70" y="200" font-size="10" font-weight="bold" fill="#c53030">1. DNS 投毒</text>
  <text x="70" y="220" font-size="9" fill="#2d3748">攻击者伪造 DNS 响应 → 将域名解析到恶意 IP</text>
  <text x="70" y="240" font-size="9" fill="#2d3748">利用 DNS 协议无校验的缺陷</text>

  <text x="70" y="264" font-size="10" font-weight="bold" fill="#805ad5">2. DNS 隧道</text>
  <text x="70" y="284" font-size="9" fill="#2d3748">将数据编码到 DNS 查询中传输</text>
  <text x="70" y="304" font-size="9" fill="#2d3748">绕过防火墙（DNS 通常不被拦截）</text>

  <text x="70" y="328" font-size="10" font-weight="bold" fill="#dd6b20">3. DNS Rebinding</text>
  <text x="70" y="348" font-size="9" fill="#2d3748">首次解析外部 IP → 二次解析内网 IP</text>
  <text x="70" y="368" font-size="9" fill="#2d3748">绕过同源策略访问内网服务</text>

  <text x="70" y="392" font-size="10" font-weight="bold" fill="#3182ce">4. 缓存投毒</text>
  <text x="70" y="412" font-size="9" fill="#2d3748">污染递归 DNS 缓存 → 大量用户受影响</text>

  <text x="70" y="436" font-size="10" font-weight="bold" fill="#38a169">防御：</text>
  <text x="70" y="456" font-size="9" fill="#2d3748">DNSSEC 签名验证 · DNS over HTTPS · 速率限制</text>

  <rect x="520" y="145" width="440" height="320" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="170" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">DNS 命令实战</text>

  <text x="550" y="200" font-size="10" font-weight="bold" fill="#c53030">查询 A 记录：</text>
  <text x="550" y="218" font-size="9" fill="#2d3748">dig example.com A</text>
  <text x="550" y="236" font-size="9" fill="#2d3748">nslookup example.com</text>

  <text x="550" y="260" font-size="10" font-weight="bold" fill="#805ad5">查询所有记录：</text>
  <text x="550" y="278" font-size="9" fill="#2d3748">dig example.com ANY</text>
  <text x="550" y="296" font-size="9" fill="#2d3748">dig example.com NS（查 NS 服务器）</text>

  <text x="550" y="320" font-size="10" font-weight="bold" fill="#dd6b20">指定 DNS 服务器：</text>
  <text x="550" y="338" font-size="9" fill="#2d3748">dig @8.8.8.8 example.com</text>

  <text x="550" y="362" font-size="10" font-weight="bold" fill="#3182ce">子域名枚举：</text>
  <text x="550" y="380" font-size="9" fill="#2d3748">dnsrecon -d example.com -t axfr</text>
  <text x="550" y="398" font-size="9" fill="#2d3748">fierce -dns example.com</text>

  <text x="550" y="422" font-size="10" font-weight="bold" fill="#38a169">DNS 隧道检测：</text>
  <text x="550" y="440" font-size="9" fill="#2d3748">异常长的子域名查询（数据编码）</text>
  <text x="550" y="458" font-size="9" fill="#2d3748">高频 TXT 查询（C2 通信）</text>
</svg>
