<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="500" fill="#f8fafc" rx="10"/>
  <text x="20" y="34" font-size="20" font-weight="bold" fill="#111">态势感知：安全大脑 + 设备联动</text>

  <!-- 大屏 -->
  <rect x="330" y="20" width="260" height="70" rx="10" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="460" y="50" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">大屏可视化 / 重保指挥</text>
  <text x="460" y="74" font-size="13" text-anchor="middle" fill="#666">态势总览 · 风险资产 · 攻击者</text>

  <!-- 平台 -->
  <rect x="310" y="140" width="300" height="130" rx="12" fill="#dbeafe" stroke="#333" stroke-width="3"/>
  <text x="460" y="182" font-size="20" text-anchor="middle" fill="#111" font-weight="bold">态势感知平台</text>
  <text x="460" y="210" font-size="14" text-anchor="middle" fill="#333">日志汇聚 + 关联分析</text>
  <text x="460" y="230" font-size="14" text-anchor="middle" fill="#333">威胁情报 + UEBA + SOAR</text>
  <text x="460" y="254" font-size="13" text-anchor="middle" fill="#b91c1c">≈ SIEM + 情报 + 编排</text>

  <!-- 底部设备 -->
  <rect x="40" y="360" width="150" height="80" rx="10" fill="#dcfce7" stroke="#333" stroke-width="2"/>
  <text x="115" y="395" font-size="16" text-anchor="middle" fill="#111">防火墙</text>
  <rect x="210" y="360" width="150" height="80" rx="10" fill="#dcfce7" stroke="#333" stroke-width="2"/>
  <text x="285" y="395" font-size="16" text-anchor="middle" fill="#111">IPS / IDS</text>
  <rect x="380" y="360" width="150" height="80" rx="10" fill="#dcfce7" stroke="#333" stroke-width="2"/>
  <text x="455" y="395" font-size="16" text-anchor="middle" fill="#111">EDR</text>
  <rect x="550" y="360" width="150" height="80" rx="10" fill="#dcfce7" stroke="#333" stroke-width="2"/>
  <text x="625" y="395" font-size="16" text-anchor="middle" fill="#111">漏扫</text>
  <rect x="720" y="360" width="150" height="80" rx="10" fill="#dcfce7" stroke="#333" stroke-width="2"/>
  <text x="795" y="395" font-size="16" text-anchor="middle" fill="#111">蜜罐</text>

  <!-- 上报 arrows -->
  <line x1="115" y1="360" x2="400" y2="270" stroke="#666" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="285" y1="360" x2="430" y2="272" stroke="#666" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="455" y1="360" x2="460" y2="275" stroke="#666" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="625" y1="360" x2="490" y2="272" stroke="#666" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="795" y1="360" x2="520" y2="270" stroke="#666" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="300" y="320" font-size="13" fill="#666">日志 / 告警上报</text>

  <!-- 联动返回 -->
  <line x1="460" y1="140" x2="250" y2="80" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arr)"/>
  <text x="280" y="78" font-size="12" fill="#b91c1c">联动封锁下发</text>

  <text x="20" y="470" font-size="13" fill="#666">联动链路：设备上报 → 平台研判 → 下发处置（封 IP / 隔离终端 / 阻断会话）</text>
</svg>
