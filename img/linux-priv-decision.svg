<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="520" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">Linux 提权决策树</text>

  <rect x="400" y="50" width="200" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="500" y="82" font-size="11" text-anchor="middle" fill="#2a4365" font-weight="bold">普通用户 → root</text>

  <line x1="400" y1="100" x2="300" y2="140" stroke="#3182ce" stroke-width="2"/>
  <line x1="600" y1="100" x2="700" y2="140" stroke="#3182ce" stroke-width="2"/>

  <rect x="170" y="145" width="250" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="295" y="177" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">① SUID 文件</text>

  <rect x="580" y="145" width="250" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="705" y="177" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">② SUDO 配置</text>

  <line x1="295" y1="195" x2="200" y2="235" stroke="#b7791f" stroke-width="2"/>
  <line x1="295" y1="195" x2="400" y2="235" stroke="#b7791f" stroke-width="2"/>
  <line x1="705" y1="195" x2="600" y2="235" stroke="#805ad5" stroke-width="2"/>
  <line x1="705" y1="195" x2="800" y2="235" stroke="#805ad5" stroke-width="2"/>

  <rect x="60" y="240" width="270" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5"/>
  <text x="195" y="272" font-size="10" text-anchor="middle" fill="#22543d" font-weight="bold">find -perm -4000 /</text>

  <rect x="330" y="240" width="270" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.5"/>
  <text x="465" y="272" font-size="10" text-anchor="middle" fill="#c53030" font-weight="bold">/usr/bin/find -exec</text>

  <rect x="480" y="240" width="250" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5"/>
  <text x="605" y="272" font-size="10" text-anchor="middle" fill="#22543d" font-weight="bold">sudo -l 查看权限</text>

  <rect x="680" y="240" width="270" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.5"/>
  <text x="815" y="272" font-size="10" text-anchor="middle" fill="#c53030" font-weight="bold">sudo bash / NOPASSWD</text>

  <line x1="300" y1="290" x2="200" y2="330" stroke="#3182ce" stroke-width="2"/>
  <line x1="600" y1="290" x2="700" y2="330" stroke="#3182ce" stroke-width="2"/>
  <line x1="500" y1="290" x2="500" y2="330" stroke="#3182ce" stroke-width="2"/>

  <rect x="170" y="335" width="260" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="300" y="367" font-size="11" text-anchor="middle" fill="#2a4365" font-weight="bold">③ 内核漏洞</text>

  <rect x="440" y="335" width="260" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="570" y="367" font-size="11" text-anchor="middle" fill="#276749" font-weight="bold">④ 计划任务</text>

  <rect x="710" y="335" width="260" height="50" rx="8" fill="#faf5ff" stroke="#805ad5" stroke-width="2"/>
  <text x="840" y="367" font-size="11" text-anchor="middle" fill="#44337a" font-weight="bold">⑤ Docker/容器</text>

  <line x1="300" y1="385" x2="200" y2="425" stroke="#3182ce" stroke-width="1.5"/>
  <line x1="570" y1="385" x2="570" y2="425" stroke="#48bb78" stroke-width="1.5"/>
  <line x1="840" y1="385" x2="840" y2="425" stroke="#805ad5" stroke-width="1.5"/>

  <rect x="60" y="430" width="280" height="65" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5"/>
  <text x="200" y="453" font-size="10" text-anchor="middle" fill="#822727" font-weight="bold">Dirty Cow (CVE-2016-5195)</text>
  <text x="200" y="473" font-size="9" text-anchor="middle" fill="#822727">内核 3.x~4.x · 写保护绕过</text>
  <text x="200" y="490" font-size="9" text-anchor="middle" fill="#822727">kernel-exploit/linux</text>

  <rect x="420" y="430" width="300" height="65" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="1.5"/>
  <text x="570" y="453" font-size="10" text-anchor="middle" fill="#744210" font-weight="bold">crontab 可写</text>
  <text x="570" y="473" font-size="9" text-anchor="middle" fill="#744210">ls -la /etc/crontab</text>
  <text x="570" y="490" font-size="9" text-anchor="middle" fill="#744210">写入 root 执行脚本</text>

  <rect x="760" y="430" width="220" height="65" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="1.5"/>
  <text x="870" y="453" font-size="10" text-anchor="middle" fill="#44337a" font-weight="bold">Docker Socket</text>
  <text x="870" y="473" font-size="9" text-anchor="middle" fill="#44337a">docker.sock 挂载</text>
  <text x="870" y="490" font-size="9" text-anchor="middle" fill="#44337a">容器逃逸 → root</text>
</svg>
