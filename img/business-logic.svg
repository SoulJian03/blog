<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">业务逻辑漏洞分类</text>

  <rect x="40" y="60" width="200" height="60" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="140" y="92" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">越权访问</text>
  <text x="140" y="110" font-size="9" text-anchor="middle" fill="#c53030">IDOR / BOLA</text>

  <rect x="260" y="60" width="200" height="60" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="360" y="92" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">水平越权</text>
  <text x="360" y="110" font-size="9" text-anchor="middle" fill="#b7791f">A 用户看 B 数据</text>

  <rect x="480" y="60" width="200" height="60" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="580" y="92" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">垂直越权</text>
  <text x="580" y="110" font-size="9" text-anchor="middle" fill="#805ad5">普通 → 管理员</text>

  <rect x="700" y="60" width="200" height="60" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="800" y="92" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">价格篡改</text>
  <text x="800" y="110" font-size="9" text-anchor="middle" fill="#38a169">改参数/改价格</text>

  <rect x="900" y="60" width="60" height="60" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="930" y="92" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">更多</text>

  <rect x="40" y="145" width="460" height="310" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="170" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">业务逻辑漏洞清单</text>

  <text x="70" y="200" font-size="10" font-weight="bold" fill="#c53030">越权：</text>
  <text x="70" y="220" font-size="9" fill="#2d3748">改 ID 参数：GET /user/1 → /user/2</text>
  <text x="70" y="240" font-size="9" fill="#2d3748">改 Cookie 用户 ID</text>

  <text x="70" y="270" font-size="10" font-weight="bold" fill="#805ad5">篡改：</text>
  <text x="70" y="290" font-size="9" fill="#2d3748">改价格：price=1 → price=0.01</text>
  <text x="70" y="310" font-size="9" fill="#2d3748">改数量：quantity=1 → quantity=999</text>

  <text x="70" y="340" font-size="10" font-weight="bold" fill="#dd6b20">绕过：</text>
  <text x="70" y="360" font-size="9" fill="#2d3748">验证码绕过 · 支付绕过</text>
  <text x="70" y="380" font-size="9" fill="#2d3748">跳过步骤 · 多步操作跳过</text>

  <text x="70" y="410" font-size="10" font-weight="bold" fill="#3182ce">其他：</text>
  <text x="70" y="430" font-size="9" fill="#2d3748">业务重放 · 并发竞争</text>
  <text x="70" y="450" font-size="9" fill="#2d3748">负数/超大数输入</text>

  <rect x="520" y="145" width="440" height="310" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="170" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">防御方法</text>

  <text x="550" y="200" font-size="10" font-weight="bold" fill="#c53030">服务端验证：</text>
  <text x="550" y="220" font-size="9" fill="#2d3748">所有业务逻辑在服务端校验</text>
  <text x="550" y="240" font-size="9" fill="#2d3748">不要信任前端传来的参数</text>

  <text x="550" y="270" font-size="10" font-weight="bold" fill="#805ad5">权限检查：</text>
  <text x="550" y="290" font-size="9" fill="#2d3748">每次请求检查用户是否有权操作</text>
  <text x="550" y="310" font-size="9" fill="#2d3748">使用用户ID而非前端传入的ID</text>

  <text x="550" y="340" font-size="10" font-weight="bold" fill="#dd6b20">输入校验：</text>
  <text x="550" y="360" font-size="9" fill="#2d3748">价格/数量等使用服务端固定值</text>
  <text x="550" y="380" font-size="9" fill="#2d3748">不允许用户篡改业务参数</text>

  <text x="550" y="410" font-size="10" font-weight="bold" fill="#3182ce">操作审计：</text>
  <text x="550" y="430" font-size="9" fill="#2d3748">敏感操作记录日志</text>
  <text x="550" y="450" font-size="9" fill="#2d3748">异常操作实时告警</text>
</svg>
