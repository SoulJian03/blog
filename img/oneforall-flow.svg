<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">OneForAll 子域名收集全流程</text>

  <rect x="40" y="70" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="102" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① 配置 API</text>

  <rect x="200" y="70" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="270" y="102" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② 执行收集</text>

  <rect x="360" y="70" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="430" y="102" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ DNS 验证</text>

  <rect x="520" y="70" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="590" y="102" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 存活验证</text>

  <rect x="680" y="70" width="140" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="750" y="102" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ 指纹识别</text>

  <rect x="840" y="70" width="120" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="900" y="102" font-size="11" text-anchor="middle" fill="#276749" font-weight="bold">⑥ 输出报告</text>

  <rect x="40" y="150" width="460" height="300" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">OneForAll 实战</text>

  <text x="70" y="205" font-size="10" font-weight="bold" fill="#c53030">安装：</text>
  <text x="70" y="225" font-size="9" fill="#2d3748">git clone https://github.com/shmilylty/OneForAll</text>
  <text x="70" y="245" font-size="9" fill="#2d3748">pip install -r requirements.txt</text>

  <text x="70" y="275" font-size="10" font-weight="bold" fill="#805ad5">配置 API：</text>
  <text x="70" y="295" font-size="9" fill="#2d3748">编辑 config.ini 添加 API KEY</text>

  <text x="70" y="325" font-size="10" font-weight="bold" fill="#dd6b20">执行：</text>
  <text x="70" y="345" font-size="9" fill="#2d3748">python3 oneforall.py -d example.com</text>

  <text x="70" y="375" font-size="10" font-weight="bold" fill="#3182ce">批量：</text>
  <text x="70" y="395" font-size="9" fill="#2d3748">python3 oneforall.py -dL domains.txt</text>

  <text x="70" y="425" font-size="10" font-weight="bold" fill="#38a169">输出：</text>
  <text x="70" y="445" font-size="9" fill="#2d3748">results/ 目录（CSV/JSON/HTML）</text>

  <rect x="520" y="150" width="440" height="300" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">数据源对比</text>

  <text x="550" y="205" font-size="10" font-weight="bold" fill="#c53030">免费源：</text>
  <text x="550" y="225" font-size="9" fill="#2d3748">AlienVault · Censys · crt.sh</text>
  <text x="550" y="245" font-size="9" fill="#2d3748">SecurityTrails · HackerOne</text>

  <text x="550" y="275" font-size="10" font-weight="bold" fill="#805ad5">付费源：</text>
  <text x="550" y="295" font-size="9" fill="#2d3748">DNSDB · 需要 API KEY</text>

  <text x="550" y="325" font-size="10" font-weight="bold" fill="#dd6b20">特点：</text>
  <text x="550" y="345" font-size="9" fill="#2d3748">全源整合 · 自动验证 · 自动去重</text>
  <text x="550" y="365" font-size="9" fill="#2d3748">输出格式丰富 · 支持批量</text>

  <text x="550" y="395" font-size="10" font-weight="bold" fill="#3182ce">配合工具：</text>
  <text x="550" y="415" font-size="9" fill="#2d3748">OneForAll → httpx（存活）</text>
  <text x="550" y="435" font-size="9" fill="#2d3748">→ nuclei（漏洞）→ ARL（归档）</text>
</svg>
