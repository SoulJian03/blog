<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="460" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">数据库操作语句对比（DML/DDL/DQL/DCL）</text>

  <rect x="40" y="60" width="220" height="360" rx="12" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="150" y="85" font-size="13" text-anchor="middle" fill="#c53030" font-weight="bold">DML 数据操作</text>

  <text x="70" y="115" font-size="9" fill="#2d3748">INSERT INTO users VALUES</text>
  <text x="80" y="133" font-size="9" fill="#2d3748">  (1, 'admin');</text>
  <text x="70" y="160" font-size="9" fill="#2d3748">UPDATE users SET age=25</text>
  <text x="80" y="178" font-size="9" fill="#2d3748">WHERE id=1;</text>
  <text x="70" y="205" font-size="9" fill="#2d3748">DELETE FROM users</text>
  <text x="80" y="223" font-size="9" fill="#2d3748">WHERE id=2;</text>

  <text x="70" y="255" font-size="10" font-weight="bold" fill="#c53030">用途：</text>
  <text x="70" y="275" font-size="9" fill="#2d3748">插入/更新/删除数据</text>
  <text x="70" y="295" font-size="9" fill="#2d3748">可回滚（需事务）</text>

  <text x="70" y="325" font-size="10" font-weight="bold" fill="#c53030">安全：</text>
  <text x="70" y="345" font-size="9" fill="#2d3748">防 SQL 注入</text>
  <text x="70" y="365" font-size="9" fill="#2d3748">WHERE 条件必须写</text>
  <text x="70" y="385" font-size="9" fill="#2d3748">DELETE 前 SELECT 验证</text>

  <rect x="285" y="60" width="220" height="360" rx="12" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="395" y="85" font-size="13" text-anchor="middle" fill="#b7791f" font-weight="bold">DDL 数据定义</text>

  <text x="305" y="115" font-size="9" fill="#2d3748">CREATE TABLE orders (</text>
  <text x="315" y="133" font-size="9" fill="#2d3748">  id INT PRIMARY KEY,</text>
  <text x="315" y="151" font-size="9" fill="#2d3748">  total DECIMAL(10,2)</text>
  <text x="305" y="169" font-size="9" fill="#2d3748">);</text>
  <text x="305" y="195" font-size="9" fill="#2d3748">ALTER TABLE orders</text>
  <text x="315" y="213" font-size="9" fill="#2d3748">ADD status VARCHAR(20);</text>
  <text x="305" y="240" font-size="9" fill="#2d3748">DROP TABLE orders;</text>

  <text x="305" y="270" font-size="10" font-weight="bold" fill="#b7791f">用途：</text>
  <text x="305" y="290" font-size="9" fill="#2d3748">创建/修改/删除表</text>
  <text x="305" y="310" font-size="9" fill="#2d3748">自动提交，不可回滚</text>

  <text x="305" y="340" font-size="10" font-weight="bold" fill="#b7791f">安全：</text>
  <text x="305" y="360" font-size="9" fill="#2d3748">DBA 权限控制严格</text>
  <text x="305" y="380" font-size="9" fill="#2d3748">应用账号禁止 DDL</text>

  <rect x="530" y="60" width="220" height="360" rx="12" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="640" y="85" font-size="13" text-anchor="middle" fill="#805ad5" font-weight="bold">DQL 数据查询</text>

  <text x="550" y="115" font-size="9" fill="#2d3748">SELECT * FROM users;</text>
  <text x="550" y="140" font-size="9" fill="#2d3748">SELECT name FROM users</text>
  <text x="560" y="158" font-size="9" fill="#2d3748">WHERE id &gt; 10</text>
  <text x="560" y="176" font-size="9" fill="#2d3748">ORDER BY name LIMIT 10;</text>
  <text x="550" y="200" font-size="9" fill="#2d3748">SELECT COUNT(*) FROM users</text>
  <text x="560" y="218" font-size="9" fill="#2d3748">GROUP BY status</text>
  <text x="560" y="236" font-size="9" fill="#2d3748">HAVING COUNT(*) &gt; 5;</text>

  <text x="550" y="265" font-size="10" font-weight="bold" fill="#805ad5">用途：</text>
  <text x="550" y="285" font-size="9" fill="#2d3748">查询/聚合/连接/子查询</text>
  <text x="550" y="305" font-size="9" fill="#2d3748">只读，不修改数据</text>

  <text x="550" y="335" font-size="10" font-weight="bold" fill="#805ad5">安全：</text>
  <text x="550" y="355" font-size="9" fill="#2d3748">防 SQL 注入</text>
  <text x="550" y="375" font-size="9" fill="#2d3748">注意索引性能</text>

  <rect x="775" y="60" width="185" height="360" rx="12" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="867" y="85" font-size="13" text-anchor="middle" fill="#38a169" font-weight="bold">DCL 数据控制</text>

  <text x="795" y="115" font-size="9" fill="#2d3748">GRANT SELECT ON</text>
  <text x="805" y="133" font-size="9" fill="#2d3748">users TO 'app'@'%';</text>
  <text x="795" y="158" font-size="9" fill="#2d3748">REVOKE DELETE ON</text>
  <text x="805" y="176" font-size="9" fill="#2d3748">users FROM 'app'@'%';</text>
  <text x="795" y="201" font-size="9" fill="#2d3748">GRANT ALL ON *.*</text>
  <text x="805" y="219" font-size="9" fill="#2d3748">TO 'dba'@'localhost';</text>

  <text x="795" y="250" font-size="10" font-weight="bold" fill="#38a169">用途：</text>
  <text x="795" y="270" font-size="9" fill="#2d3748">授权/收回权限</text>

  <text x="795" y="300" font-size="10" font-weight="bold" fill="#38a169">安全：</text>
  <text x="795" y="320" font-size="9" fill="#2d3748">最小权限原则</text>
  <text x="795" y="340" font-size="9" fill="#2d3748">禁止 ALL PRIVILEGES</text>
  <text x="795" y="360" font-size="9" fill="#2d3748">限制连接来源 IP</text>
  <text x="795" y="380" font-size="9" fill="#2d3748">定期审查权限</text>
  <text x="795" y="400" font-size="9" fill="#2d3748">密码强度要求</text>
</svg>
