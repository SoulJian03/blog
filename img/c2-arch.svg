<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="420" fill="#f8fafc" rx="10"/>
  <text x="20" y="36" font-size="20" font-weight="bold" fill="#111">C2 平台通用架构（CS / Vshell / MSF）</text>

  <!-- 攻击者 -->
  <rect x="20" y="150" width="150" height="110" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="95" y="195" font-size="17" text-anchor="middle" fill="#b91c1c" font-weight="bold">攻击者操作端</text>
  <text x="95" y="220" font-size="12" text-anchor="middle" fill="#666">Teamserver / 控制台</text>

  <!-- C2 server -->
  <rect x="230" y="140" width="180" height="130" rx="10" fill="#dbeafe" stroke="#333" stroke-width="3"/>
  <text x="320" y="182" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">C2 服务端</text>
  <text x="320" y="208" font-size="12" text-anchor="middle" fill="#333">监听器(Listener)</text>
  <text x="320" y="226" font-size="12" text-anchor="middle" fill="#333">管理多台 Agent</text>
  <text x="320" y="250" font-size="11" text-anchor="middle" fill="#b91c1c">攻击机或公网 VPS</text>

  <!-- Agent -->
  <rect x="500" y="140" width="180" height="130" rx="10" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="590" y="182" font-size="17" text-anchor="middle" fill="#b45309" font-weight="bold">目标主机 Agent</text>
  <text x="590" y="208" font-size="12" text-anchor="middle" fill="#666">beacon / agent / meterpreter</text>
  <text x="590" y="226" font-size="12" text-anchor="middle" fill="#666">被投递的木马</text>

  <!-- 内网 -->
  <rect x="760" y="140" width="140" height="130" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="830" y="182" font-size="16" text-anchor="middle" fill="#7e22ce" font-weight="bold">内网目标群</text>
  <text x="830" y="208" font-size="12" text-anchor="middle" fill="#666">横向 / 提权</text>

  <!-- arrows -->
  <line x1="170" y1="205" x2="225" y2="205" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="410" y1="205" x2="495" y2="205" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="680" y1="205" x2="755" y2="205" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>

  <text x="198" y="185" font-size="12" fill="#666" text-anchor="middle">操作指令</text>
  <text x="452" y="185" font-size="12" fill="#666" text-anchor="middle">上线 / 回连</text>
  <text x="718" y="185" font-size="12" fill="#666" text-anchor="middle">Socks/隧道</text>

  <!-- 防火墙示意图 -->
  <rect x="470" y="330" width="280" height="54" rx="8" fill="#fef9c3" stroke="#b45309"/>
  <text x="610" y="356" font-size="14" text-anchor="middle" fill="#b45309">防火墙/EDR 只放行常见流量 → C2 要“伪装”回连</text>
  <line x1="590" y1="290" x2="590" y2="325" stroke="#b45309" stroke-width="2" stroke-dasharray="6,5"/>

  <text x="20" y="396" font-size="13" fill="#666">正反向：反向=目标连回 C2（可出网）；正向=目标开端口、C2 连过去（只能进不能出）</text>
</svg>
