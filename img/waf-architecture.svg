<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr-w1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-w2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2980b9"/>
    </marker>
    <marker id="arr-w3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="#f8fafc" rx="10"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#111">WAF 架构与绕过路径图</text>
  <text x="40" y="64" font-size="14" fill="#666">WAF 规则匹配流程、部署模式与常见绕过路径</text>

  <!-- 客户端 -->
  <rect x="20" y="180" width="160" height="80" rx="10" fill="#fee2e2" stroke="#c0392b" stroke-width="2"/>
  <text x="100" y="210" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">👤 攻击者</text>
  <text x="100" y="232" font-size="12" text-anchor="middle" fill="#555">恶意请求</text>

  <path d="M 180 220 L 280 220" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr-w1)"/>

  <!-- WAF -->
  <rect x="280" y="120" width="280" height="220" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="420" y="150" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🛡️ WAF 引擎</text>
  <line x1="300" y1="160" x2="540" y2="160" stroke="#1565c0" stroke-width="1"/>

  <text x="300" y="185" font-size="13" font-weight="bold" fill="#1565c0">① 协议解析</text>
  <text x="300" y="205" font-size="12" fill="#555">HTTP 解码 / URL 解码 / Base64 解码</text>

  <text x="300" y="230" font-size="13" font-weight="bold" fill="#1565c0">② 规则匹配</text>
  <text x="300" y="250" font-size="12" fill="#555">SQL/XSS/RCE 正则规则 / 语义分析</text>

  <text x="300" y="275" font-size="13" font-weight="bold" fill="#1565c0">③ 动作执行</text>
  <text x="300" y="295" font-size="12" fill="#555">拦截 / 告警 / 放行 / 验证码</text>

  <text x="300" y="320" font-size="13" font-weight="bold" fill="#1565c0">④ 日志记录</text>

  <!-- 绕过路径 -->
  <path d="M 280 175 C 150 150, 150 350, 280 300" stroke="#e65100" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-w2)"/>
  <text x="80" y="260" font-size="11" fill="#e65100" text-anchor="middle" font-weight="bold">绕过路径1：
编码混淆</text>

  <path d="M 560 220 C 700 200, 700 300, 560 280" stroke="#e65100" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-w2)"/>
  <text x="660" y="205" font-size="11" fill="#e65100" text-anchor="middle" font-weight="bold">绕过路径2：
语义等价变换</text>

  <path d="M 420 340 C 420 400, 420 420, 420 440" stroke="#e65100" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-w3)"/>

  <!-- 正常放行到服务器 -->
  <path d="M 560 220 L 660 220" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arr-w3)"/>
  <text x="610" y="205" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="bold">放行</text>

  <!-- 应用服务器 -->
  <rect x="660" y="180" width="180" height="80" rx="10" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="750" y="210" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">🖥️ 应用服务器</text>
  <text x="750" y="232" font-size="12" text-anchor="middle" fill="#555">Web 应用</text>

  <!-- 绕过技术 -->
  <rect x="30" y="410" width="1140" height="130" rx="10" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="440" font-size="16" font-weight="bold" fill="#111">常见 WAF 绕过技术</text>

  <text x="50" y="468" font-size="13" font-weight="bold" fill="#c0392b">1. 编码混淆</text>
  <text x="220" y="468" font-size="12" fill="#333">URL 二次编码 / Unicode 编码 / HTML 实体编码 / Base64</text>

  <text x="50" y="490" font-size="13" font-weight="bold" fill="#2980b9">2. 语法等价</text>
  <text x="220" y="490" font-size="12" fill="#333">SELECT 1 → select 1 / SLEEP(1) → sleep(1) / 大小写交替</text>

  <text x="50" y="512" font-size="13" font-weight="bold" fill="#27ae60">3. HTTP 参数污染</text>
  <text x="220" y="512" font-size="12" fill="#333">同参数多值、HTTP Header 注入、分块传输</text>

  <text x="50" y="534" font-size="13" font-weight="bold" fill="#b45309">4. 请求分裂</text>
  <text x="220" y="534" font-size="12" fill="#333">把 payload 拆分到多个请求，或放 Cookie/Referer/Header 中</text>

  <text x="700" y="468" font-size="13" font-weight="bold" fill="#ad1457">5. 文件上传绕过</text>
  <text x="700" y="490" font-size="12" fill="#333">上传图片马，WAF 不看图片内部内容</text>

  <text x="700" y="512" font-size="13" font-weight="bold" fill="#1565c0">6. 逻辑绕过</text>
  <text x="700" y="534" font-size="12" fill="#333">用正常参数触发异常行为，WAF 只规则匹配不看业务逻辑</text>
</svg>
