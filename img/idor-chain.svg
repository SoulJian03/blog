<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">越权访问与IDOR（不恰当直接对象引用）</text>

  <rect x="40" y="70" width="220" height="60" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="150" y="102" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">水平越权（BOLA）</text>
  <text x="150" y="120" font-size="9" text-anchor="middle" fill="#c53030">同级别用户之间</text>

  <rect x="280" y="70" width="220" height="60" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="390" y="102" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">垂直越权（BFLA）</text>
  <text x="390" y="120" font-size="9" text-anchor="middle" fill="#b7791f">低权限 → 高权限</text>

  <rect x="520" y="70" width="220" height="60" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="630" y="102" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">IDOR</text>
  <text x="630" y="120" font-size="9" text-anchor="middle" fill="#805ad5">直接对象引用</text>

  <rect x="760" y="70" width="200" height="60" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="860" y="102" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">状态越权</text>
  <text x="860" y="120" font-size="9" text-anchor="middle" fill="#38a169">状态机跳过</text>

  <rect x="40" y="160" width="460" height="290" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">越权攻击示例</text>

  <text x="70" y="215" font-size="10" font-weight="bold" fill="#c53030">水平越权：</text>
  <text x="70" y="235" font-size="9" fill="#2d3748">GET /api/orders?id=123</text>
  <text x="70" y="255" font-size="9" fill="#2d3748">改 id=124 → 看他人订单</text>
  <text x="70" y="275" font-size="9" fill="#2d3748">改 Cookie 中 user_id</text>

  <text x="70" y="305" font-size="10" font-weight="bold" fill="#805ad5">垂直越权：</text>
  <text x="70" y="325" font-size="9" fill="#2d3748">普通用户访问 /admin</text>
  <text x="70" y="345" font-size="9" fill="#2d3748">改 role=admin</text>

  <text x="70" y="375" font-size="10" font-weight="bold" fill="#dd6b20">IDOR：</text>
  <text x="70" y="395" font-size="9" fill="#2d3748">GET /account?id=1 → id=2</text>
  <text x="70" y="415" font-size="9" fill="#2d3748">PUT /api/users/123 → 改他人信息</text>
  <text x="70" y="435" font-size="9" fill="#2d3748">使用不可预测 ID（UUID）</text>

  <rect x="520" y="160" width="440" height="290" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">防御方法</text>

  <text x="550" y="215" font-size="10" font-weight="bold" fill="#c53030">服务端权限校验：</text>
  <text x="550" y="235" font-size="9" fill="#2d3748">每次请求验证用户是否有权操作</text>
  <text x="550" y="255" font-size="9" fill="#2d3748">不要信任前端传来的 user_id</text>

  <text x="550" y="285" font-size="10" font-weight="bold" fill="#805ad5">不可预测 ID：</text>
  <text x="550" y="305" font-size="9" fill="#2d3748">使用 UUID 替代自增 ID</text>
  <text x="550" y="325" font-size="9" fill="#2d3748">使用 Token 替代直接 ID</text>

  <text x="550" y="355" font-size="10" font-weight="bold" fill="#dd6b20">统一鉴权中间件：</text>
  <text x="550" y="375" font-size="9" fill="#2d3748">在框架层做权限校验</text>
  <text x="550" y="395" font-size="9" fill="#2d3748">RBAC 基于角色的访问控制</text>

  <text x="550" y="425" font-size="10" font-weight="bold" fill="#3182ce">日志审计：</text>
  <text x="550" y="445" font-size="9" fill="#2d3748">记录敏感操作 · 异常告警</text>
</svg>
