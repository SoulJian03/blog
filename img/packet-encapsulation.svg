<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">数据包封装与解包过程</text>

  <rect x="40" y="60" width="140" height="45" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="88" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">应用数据</text>

  <line x1="110" y1="105" x2="110" y2="135" stroke="#c53030" stroke-width="2"/>

  <rect x="40" y="140" width="140" height="45" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="110" y="168" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">+ TCP 头部</text>

  <line x1="110" y1="185" x2="110" y2="215" stroke="#b7791f" stroke-width="2"/>

  <rect x="40" y="220" width="140" height="45" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="110" y="248" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">+ IP 头部</text>

  <line x1="110" y1="265" x2="110" y2="295" stroke="#805ad5" stroke-width="2"/>

  <rect x="40" y="300" width="140" height="45" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="110" y="328" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">+ MAC 头部</text>

  <line x1="110" y1="345" x2="110" y2="375" stroke="#38a169" stroke-width="2"/>

  <rect x="40" y="380" width="140" height="45" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="110" y="408" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">→ 比特流</text>

  <text x="110" y="445" font-size="11" text-anchor="middle" fill="#744210" font-weight="bold">封装（发送）</text>

  <rect x="240" y="60" width="520" height="370" rx="12" fill="#ebf8ff" stroke="#4299e1" stroke-width="2"/>
  <text x="500" y="85" font-size="12" font-weight="bold" text-anchor="middle" fill="#2b6cb0">各层头部字段</text>

  <text x="270" y="115" font-size="10" font-weight="bold" fill="#c53030">TCP 头部（20 字节）：</text>
  <text x="270" y="133" font-size="9" fill="#2d3748">源端口(16b) · 目的端口(16b) · 序列号(32b) · 确认号(32b)</text>
  <text x="270" y="153" font-size="9" fill="#2d3748">标志位(SYN/ACK/FIN/RST) · 窗口大小 · 校验和</text>

  <text x="270" y="183" font-size="10" font-weight="bold" fill="#805ad5">IP 头部（20 字节）：</text>
  <text x="270" y="201" font-size="9" fill="#2d3748">版本号(4b) · 头部长度(4b) · 服务类型(8b) · 总长度(16b)</text>
  <text x="270" y="221" font-size="9" fill="#2d3748">标识(16b) · 标志+片偏移(16b) · TTL(8b) · 协议(8b)</text>
  <text x="270" y="241" font-size="9" fill="#2d3748">源 IP(32b) · 目的 IP(32b) · 选项 · 填充</text>

  <text x="270" y="271" font-size="10" font-weight="bold" fill="#38a169">以太网头部（14 字节）：</text>
  <text x="270" y="289" font-size="9" fill="#2d3748">目的 MAC(48b) · 源 MAC(48b) · 类型(16b)</text>

  <text x="270" y="319" font-size="10" font-weight="bold" fill="#3182ce">以太帧尾部（4 字节）：</text>
  <text x="270" y="337" font-size="9" fill="#2d3748">FCS 帧校验序列（CRC32）</text>

  <text x="270" y="367" font-size="10" font-weight="bold" fill="#dd6b20">封装顺序：</text>
  <text x="270" y="385" font-size="9" fill="#2d3748">应用层 → 传输层(+TCP头) → 网络层(+IP头) → 链路层(+MAC头/尾)</text>

  <text x="270" y="415" font-size="10" font-weight="bold" fill="#38a169">MTU 限制：</text>
  <text x="270" y="433" font-size="9" fill="#2d3748">以太网默认 MTU=1500 字节，超过则分片</text>

  <rect x="810" y="60" width="150" height="370" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="885" y="85" font-size="12" text-anchor="middle" fill="#276749" font-weight="bold">解包（接收）</text>
  <text x="830" y="115" font-size="9" fill="#2d3748">① 链路层</text>
  <text x="830" y="133" font-size="9" fill="#2d3748">去 MAC 头/尾</text>
  <text x="830" y="163" font-size="9" fill="#2d3748">② 网络层</text>
  <text x="830" y="181" font-size="9" fill="#2d3748">去 IP 头</text>
  <text x="830" y="211" font-size="9" fill="#2d3748">③ 传输层</text>
  <text x="830" y="229" font-size="9" fill="#2d3748">去 TCP 头</text>
  <text x="830" y="259" font-size="9" fill="#2d3748">④ 应用层</text>
  <text x="830" y="277" font-size="9" fill="#2d3748">交付原始数据</text>

  <text x="830" y="310" font-size="10" font-weight="bold" fill="#c53030">抓包分析：</text>
  <text x="830" y="328" font-size="9" fill="#2d3748">Wireshark 逐层展开</text>
  <text x="830" y="355" font-size="10" font-weight="bold" fill="#805ad5">渗透关联：</text>
  <text x="830" y="373" font-size="9" fill="#2d3748">TCP 标志位 → SYN Flood</text>
  <text x="830" y="391" font-size="9" fill="#2d3748">IP 头 → IP 伪造</text>
  <text x="830" y="409" font-size="9" fill="#2d3748">MAC 头 → ARP 欺骗</text>
</svg>
