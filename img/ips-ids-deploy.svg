<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="440" fill="#f8fafc" rx="10"/>
  <text x="20" y="34" font-size="20" font-weight="bold" fill="#111">IDS（旁路）与 IPS（串接）部署对比</text>

  <!-- 链路上部：防火墙 -->
  <rect x="30" y="90" width="150" height="90" rx="10" fill="#fee2e2" stroke="#333" stroke-width="2"/>
  <text x="105" y="135" font-size="17" text-anchor="middle" fill="#111">互联网</text>
  <text x="105" y="158" font-size="13" text-anchor="middle" fill="#666">攻击者</text>

  <rect x="300" y="80" width="150" height="100" rx="10" fill="#dbeafe" stroke="#333" stroke-width="2"/>
  <text x="375" y="125" font-size="17" text-anchor="middle" fill="#111">防火墙</text>
  <text x="375" y="152" font-size="13" text-anchor="middle" fill="#666">边界策略</text>

  <!-- IPS 串接 -->
  <rect x="560" y="80" width="160" height="100" rx="10" fill="#fef9c3" stroke="#b45309" stroke-width="3"/>
  <text x="640" y="120" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">IPS</text>
  <text x="640" y="146" font-size="13" text-anchor="middle" fill="#b45309">串接在链路中</text>
  <text x="640" y="166" font-size="13" text-anchor="middle" fill="#b45309">发现即阻断</text>

  <rect x="800" y="80" width="80" height="100" rx="10" fill="#dcfce7" stroke="#333" stroke-width="2"/>
  <text x="840" y="130" font-size="16" text-anchor="middle" fill="#111">核心</text>
  <text x="840" y="152" font-size="13" text-anchor="middle" fill="#666">交换机</text>

  <!-- 主线箭头 -->
  <line x1="180" y1="130" x2="295" y2="130" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="450" y1="130" x2="555" y2="130" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="720" y1="130" x2="795" y2="130" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <text x="370" y="205" font-size="13" fill="#666" text-anchor="middle">IPS 在线串接 → 断则断业务，误杀要小心</text>

  <!-- IDS 旁路 -->
  <rect x="300" y="300" width="180" height="80" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="390" y="338" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">IDS</text>
  <text x="390" y="360" font-size="13" text-anchor="middle" fill="#7e22ce">旁路监听（镜像口）</text>
  <text x="390" y="372" font-size="12" text-anchor="middle" fill="#666">只告警不阻断</text>

  <!-- 镜像虚线 -->
  <line x1="800" y1="200" x2="800" y2="340" stroke="#7e22ce" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arr)"/>
  <line x1="800" y1="340" x2="485" y2="340" stroke="#7e22ce" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arr)"/>
  <text x="812" y="270" font-size="13" fill="#7e22ce">镜像流量</text>

  <text x="390" y="410" font-size="14" fill="#666" text-anchor="middle">IDS 旁路不影响业务，适合检测与取证</text>
</svg>
