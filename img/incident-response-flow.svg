<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">应急响应标准流程</text>

  <rect x="40" y="70" width="140" height="60" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="105" font-size="12" text-anchor="middle" fill="#c53030" font-weight="bold">① 发现</text>
  <text x="110" y="125" font-size="10" text-anchor="middle" fill="#742a2a">告警/用户反馈</text>

  <line x1="180" y1="100" x2="215" y2="100" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="220" y="70" width="140" height="60" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="290" y="105" font-size="12" text-anchor="middle" fill="#b7791f" font-weight="bold">② 确认</text>
  <text x="290" y="125" font-size="10" text-anchor="middle" fill="#744210">判断真实告警</text>

  <line x1="360" y1="100" x2="395" y2="100" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="400" y="70" width="140" height="60" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="470" y="105" font-size="12" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 遏制</text>
  <text x="470" y="125" font-size="10" text-anchor="middle" fill="#44337a">断网/隔离/下线</text>

  <line x1="540" y1="100" x2="575" y2="100" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="580" y="70" width="140" height="60" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="650" y="105" font-size="12" text-anchor="middle" fill="#38a169" font-weight="bold">④ 取证</text>
  <text x="650" y="125" font-size="10" text-anchor="middle" fill="#22543d">内存/日志/快照</text>

  <line x1="720" y1="100" x2="755" y2="100" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="760" y="70" width="140" height="60" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="830" y="105" font-size="12" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ 分析</text>
  <text x="830" y="125" font-size="10" text-anchor="middle" fill="#2a4365">攻击链/入口</text>

  <line x1="900" y1="100" x2="935" y2="100" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="760" y="170" width="140" height="60" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="830" y="205" font-size="12" text-anchor="middle" fill="#38a169" font-weight="bold">⑥ 清除</text>
  <text x="830" y="225" font-size="10" text-anchor="middle" fill="#22543d">删后门/改密码</text>

  <line x1="830" y1="230" x2="830" y2="265" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="760" y="270" width="140" height="60" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="830" y="305" font-size="12" text-anchor="middle" fill="#805ad5" font-weight="bold">⑦ 恢复</text>
  <text x="830" y="325" font-size="10" text-anchor="middle" fill="#44337a">修漏洞/重建</text>

  <line x1="670" y1="245" x2="745" y2="300" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="560" y="270" width="120" height="60" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="620" y="305" font-size="12" text-anchor="middle" fill="#3182ce" font-weight="bold">⑧ 复盘</text>
  <text x="620" y="325" font-size="10" text-anchor="middle" fill="#2a4365">总结经验</text>

  <rect x="40" y="170" width="340" height="200" rx="12" fill="#ebf8ff" stroke="#4299e1" stroke-width="2"/>
  <text x="210" y="195" font-size="13" font-weight="bold" text-anchor="middle" fill="#2b6cb0">证据保全清单</text>
  <text x="70" y="225" font-size="11" fill="#2d3748">• 内存快照 (LiME)</text>
  <text x="70" y="250" font-size="11" fill="#2d3748">• 磁盘快照 (dd)</text>
  <text x="70" y="275" font-size="11" fill="#2d3748">• 进程列表 (ps aux)</text>
  <text x="70" y="300" font-size="11" fill="#2d3748">• 网络连接 (ss -tulnp)</text>
  <text x="70" y="325" font-size="11" fill="#2d3748">• 计划任务 (crontab)</text>
  <text x="70" y="350" font-size="11" fill="#2d3748">• SSH 公钥/登录日志</text>
  <text x="70" y="375" font-size="11" fill="#2d3748">• Web 日志/上传目录</text>

  <rect x="400" y="170" width="310" height="200" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="555" y="195" font-size="13" font-weight="bold" text-anchor="middle" fill="#276749">排查顺序</text>
  <text x="430" y="225" font-size="11" fill="#2d3748">1. 异常进程 (ps aux)</text>
  <text x="430" y="250" font-size="11" fill="#2d3748">2. 网络连接 (netstat/ss)</text>
  <text x="430" y="275" font-size="11" fill="#2d3748">3. WebShell (find/grep)</text>
  <text x="430" y="300" font-size="11" fill="#2d3748">4. 计划任务/启动项</text>
  <text x="430" y="325" font-size="11" fill="#2d3748">5. 用户/账号变更</text>
  <text x="430" y="350" font-size="11" fill="#2d3748">6. 日志回溯攻击时间线</text>
</svg>
