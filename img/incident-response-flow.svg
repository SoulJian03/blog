<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">应急响应流程（NIST 800-61）</text>

  <rect x="40" y="60" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="92" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① 准备</text>

  <rect x="200" y="60" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="270" y="92" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② 检测</text>

  <rect x="360" y="60" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="430" y="92" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 遏制</text>

  <rect x="520" y="60" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="590" y="92" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 根除</text>

  <rect x="680" y="60" width="140" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="750" y="92" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ 恢复</text>

  <rect x="840" y="60" width="120" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="900" y="92" font-size="11" text-anchor="middle" fill="#276749" font-weight="bold">⑥ 复盘</text>

  <rect x="40" y="140" width="460" height="310" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">应急响应步骤详解</text>

  <text x="70" y="195" font-size="10" font-weight="bold" fill="#c53030">① 准备：</text>
  <text x="70" y="215" font-size="9" fill="#2d3748">建立 IR 团队 · 准备取证工具</text>
  <text x="70" y="235" font-size="9" fill="#2d3748">定义事件等级 · 制定响应计划</text>

  <text x="70" y="260" font-size="10" font-weight="bold" fill="#805ad5">② 检测：</text>
  <text x="70" y="280" font-size="9" fill="#2d3748">分析告警 · 确认事件真实性和影响范围</text>
  <text x="70" y="300" font-size="9" fill="#2d3748">确认 IOC（入侵指标）</text>

  <text x="70" y="325" font-size="10" font-weight="bold" fill="#dd6b20">③ 遏制：</text>
  <text x="70" y="345" font-size="9" fill="#2d3748">隔离受感染主机 · 断开网络连接</text>
  <text x="70" y="365" font-size="9" fill="#2d3748">阻止攻击扩散 · 保留现场证据</text>

  <text x="70" y="390" font-size="10" font-weight="bold" fill="#3182ce">④ 根除：</text>
  <text x="70" y="410" font-size="9" fill="#2d3748">清理恶意文件 · 修复漏洞 · 重置密码</text>
  <text x="70" y="430" font-size="9" fill="#2d3748">重建受影响系统</text>

  <text x="70" y="455" font-size="10" font-weight="bold" fill="#38a169">⑤ 恢复 + ⑥ 复盘：</text>
  <text x="70" y="470" font-size="9" fill="#2d3748">恢复业务 · 编写事件报告 · 总结经验教训</text>

  <rect x="520" y="140" width="440" height="310" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">取证关键命令</text>

  <text x="550" y="195" font-size="10" font-weight="bold" fill="#c53030">内存取证：</text>
  <text x="550" y="215" font-size="9" fill="#2d3748">ps aux · ss -tlnp · lsof -i</text>

  <text x="550" y="240" font-size="10" font-weight="bold" fill="#805ad5">文件取证：</text>
  <text x="550" y="260" font-size="9" fill="#2d3748">find / -mmin -60 -type f</text>
  <text x="550" y="280" font-size="9" fill="#2d3748">ls -la /tmp /dev/shm</text>

  <text x="550" y="305" font-size="10" font-weight="bold" fill="#dd6b20">日志取证：</text>
  <text x="550" y="325" font-size="9" fill="#2d3748">/var/log/auth.log · /var/log/secure</text>
  <text x="550" y="345" font-size="9" fill="#2d3748">journalctl -u sshd --since "1 hour ago"</text>

  <text x="550" y="370" font-size="10" font-weight="bold" fill="#3182ce">持久化检查：</text>
  <text x="550" y="390" font-size="9" fill="#2d3748">cat /etc/crontab · crontab -l</text>
  <text x="550" y="410" font-size="9" fill="#2d3748">systemctl list-units --all</text>

  <text x="550" y="435" font-size="10" font-weight="bold" fill="#38a169">网络取证：</text>
  <text x="550" y="455" font-size="9" fill="#2d3748">tcpdump -i eth0 -w capture.pcap</text>
  <text x="550" y="470" font-size="9" fill="#2d3748">netstat -antp · ss -tlnp</text>
</svg>
