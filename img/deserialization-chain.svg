<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="#f8fafc" rx="10"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#111">反序列化攻击链图</text>
  <text x="40" y="64" font-size="14" fill="#666">Java/PHP/Python 反序列化：Gadget 链 → 危险方法 → RCE</text>

  <rect x="30" y="160" width="180" height="90" rx="12" fill="#fee2e2" stroke="#c0392b" stroke-width="2.5"/>
  <text x="120" y="190" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🕵️ 攻击者</text>
  <text x="120" y="215" font-size="13" text-anchor="middle" fill="#555">构造恶意序列化对象</text>

  <path d="M 210 205 L 250 205" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr-s1)"/>

  <rect x="260" y="120" width="240" height="180" rx="12" fill="#dbeafe" stroke="#2980b9" stroke-width="2.5"/>
  <text x="380" y="150" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">📦 恶意对象构造</text>
  <line x1="280" y1="160" x2="480" y2="160" stroke="#2980b9" stroke-width="1"/>
  <text x="280" y="188" font-size="12" font-weight="bold" fill="#c0392b">Gadget 链</text>
  <text x="280" y="208" font-size="12" fill="#555">Object → readObject()</text>
  <text x="280" y="226" font-size="12" fill="#555">→ finalize() / toString()</text>
  <text x="280" y="244" font-size="12" fill="#555">→ Runtime.exec()</text>
  <text x="280" y="262" font-size="12" fill="#555">→ ProcessBuilder</text>
  <text x="280" y="280" font-size="12" font-weight="bold" fill="#2980b9">ysoserial 常用链</text>
  <text x="280" y="298" font-size="12" fill="#555">CC1-CC7 / JRMP / Groovy</text>

  <path d="M 500 205 L 540 205" stroke="#2980b9" stroke-width="2.5" fill="none" marker-end="url(#arr-s1)"/>

  <rect x="550" y="160" width="200" height="90" rx="12" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="650" y="190" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🖥️ 反序列化入口</text>
  <text x="650" y="215" font-size="13" text-anchor="middle" fill="#555">readObject()/Unserialize()</text>

  <path d="M 750 205 L 790 205" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arr-s1)"/>

  <rect x="800" y="160" width="200" height="90" rx="12" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="900" y="190" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">💻 命令执行</text>
  <text x="900" y="215" font-size="13" text-anchor="middle" fill="#555">Runtime.exec()</text>
  <text x="900" y="233" font-size="12" text-anchor="middle" fill="#555">反弹 Shell / 读写文件</text>

  <path d="M 1000 205 C 1080 320, 400 350, 250 205" stroke="#b45309" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-s1)"/>
  <text x="600" y="365" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">攻击者控制命令输出 → 获取 Shell</text>

  <rect x="30" y="340" width="1140" height="200" rx="10" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="370" font-size="16" font-weight="bold" fill="#111">语言 / 框架 对照</text>

  <text x="50" y="400" font-size="14" font-weight="bold" fill="#c0392b">Java</text>
  <text x="180" y="400" font-size="12" fill="#333">ObjectInputStream.readObject() → 触发 readObject() / finalize() / toString()</text>
  <text x="180" y="418" font-size="12" fill="#555">工具：ysoserial / CommonsCollections</text>

  <text x="50" y="446" font-size="14" font-weight="bold" fill="#2980b9">PHP</text>
  <text x="180" y="446" font-size="12" fill="#333">unserialize() → 触发 __wakeup() / __destruct() / __toString()</text>
  <text x="180" y="464" font-size="12" fill="#555">工具：PHPggc</text>

  <text x="50" y="490" font-size="14" font-weight="bold" fill="#27ae60">Python</text>
  <text x="180" y="490" font-size="12" fill="#333">pickle.loads() → 触发 __reduce__() → os.system()</text>
  <text x="180" y="508" font-size="12" fill="#555">工具：pickle 手动构造 + 反序列化 payload</text>

  <text x="600" y="400" font-size="14" font-weight="bold" fill="#b45309">通用防御</text>
  <text x="600" y="420" font-size="12" fill="#333">禁止反序列化不可信数据（Java: 使用 ObjectInputFilter）</text>
  <text x="600" y="440" font-size="12" fill="#333">PHP: 使用 JSON 代替序列化</text>
  <text x="600" y="460" font-size="12" fill="#333">Python: 使用 json.loads() 代替 pickle.loads()</text>
  <text x="600" y="480" font-size="12" fill="#333">.NET: 禁用不安全反序列化（UnsafeNativeMethod）</text>
  <text x="600" y="500" font-size="12" fill="#333">全局：WAF 拦截序列化特征</text>
</svg>
