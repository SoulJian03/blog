<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3182ce"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c53030"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">TCP 三次握手与四次挥手</text>

  <rect x="60" y="60" width="150" height="60" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="135" y="88" font-size="11" text-anchor="middle" fill="#2a4365" font-weight="bold">Client</text>
  <text x="135" y="108" font-size="9" text-anchor="middle" fill="#2a4365">客户端</text>

  <rect x="790" y="60" width="150" height="60" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="865" y="88" font-size="11" text-anchor="middle" fill="#22543d" font-weight="bold">Server</text>
  <text x="865" y="108" font-size="9" text-anchor="middle" fill="#22543d">服务端</text>

  <line x1="210" y1="90" x2="790" y2="90" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>
  <text x="500" y="82" font-size="10" text-anchor="middle" fill="#3182ce" font-weight="bold">① SYN（syn=x）</text>
  <text x="500" y="98" font-size="8" text-anchor="middle" fill="#3182ce">客户端→服务端</text>

  <line x1="790" y1="130" x2="210" y2="130" stroke="#38a169" stroke-width="2" marker-end="url(#arr)"/>
  <text x="500" y="122" font-size="10" text-anchor="middle" fill="#38a169" font-weight="bold">② SYN+ACK（syn=y, ack=x+1）</text>
  <text x="500" y="138" font-size="8" text-anchor="middle" fill="#38a169">服务端→客户端</text>

  <line x1="210" y1="170" x2="790" y2="170" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>
  <text x="500" y="162" font-size="10" text-anchor="middle" fill="#3182ce" font-weight="bold">③ ACK（ack=y+1）</text>
  <text x="500" y="178" font-size="8" text-anchor="middle" fill="#3182ce">连接建立 · 数据传输开始</text>

  <line x1="60" y1="200" x2="940" y2="200" stroke="#a0aec0" stroke-width="1" stroke-dasharray="5,5"/>

  <rect x="60" y="220" width="880" height="24" rx="4" fill="#fefcbf" stroke="#b7791f" stroke-width="1.5"/>
  <text x="500" y="236" font-size="10" text-anchor="middle" fill="#744210" font-weight="bold">数据传输阶段（双向通信）</text>

  <line x1="210" y1="260" x2="790" y2="260" stroke="#c53030" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="500" y="252" font-size="10" text-anchor="middle" fill="#c53030" font-weight="bold">④ FIN（fin）</text>
  <text x="500" y="268" font-size="8" text-anchor="middle" fill="#c53030">客户端请求关闭</text>

  <line x1="790" y1="290" x2="210" y2="290" stroke="#38a169" stroke-width="2" marker-end="url(#arr)"/>
  <text x="500" y="282" font-size="10" text-anchor="middle" fill="#38a169" font-weight="bold">⑤ ACK</text>
  <text x="500" y="298" font-size="8" text-anchor="middle" fill="#38a169">服务端确认</text>

  <line x1="790" y1="320" x2="210" y2="320" stroke="#c53030" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="500" y="312" font-size="10" text-anchor="middle" fill="#c53030" font-weight="bold">⑥ FIN（fin）</text>
  <text x="500" y="328" font-size="8" text-anchor="middle" fill="#c53030">服务端请求关闭</text>

  <line x1="210" y1="350" x2="790" y2="350" stroke="#3182ce" stroke-width="2" marker-end="url(#arr)"/>
  <text x="500" y="342" font-size="10" text-anchor="middle" fill="#3182ce" font-weight="bold">⑦ ACK</text>
  <text x="500" y="358" font-size="8" text-anchor="middle" fill="#3182ce">连接关闭 · 2MSL 等待</text>

  <rect x="60" y="385" width="410" height="70" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5"/>
  <text x="265" y="408" font-size="10" text-anchor="middle" fill="#2b6cb0" font-weight="bold">三次握手目的</text>
  <text x="90" y="428" font-size="9" fill="#2d3748">双方确认收发能力正常 · 初始化序列号</text>
  <text x="90" y="445" font-size="9" fill="#2d3748">防止历史连接请求造成混乱</text>

  <rect x="530" y="385" width="410" height="70" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5"/>
  <text x="735" y="408" font-size="10" text-anchor="middle" fill="#276749" font-weight="bold">四次挥手原因</text>
  <text x="560" y="428" font-size="9" fill="#2d3748">TCP 全双工 → 双方独立关闭</text>
  <text x="560" y="445" font-size="9" fill="#2d3748">TIME_WAIT 状态确保最后一个 ACK 到达</text>
</svg>
