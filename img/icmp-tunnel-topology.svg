<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr-i1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="520" fill="#f8fafc" rx="10"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#111">ICMP 隧道拓扑图</text>
  <text x="40" y="64" font-size="14" fill="#666">利用 ICMP ping 包建立隐蔽数据传输隧道（ping 隧道）</text>

  <line x1="500" y1="80" x2="500" y2="420" stroke="#b0b0b0" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="400" y="98" font-size="14" font-weight="bold" fill="#555">公网 / 攻击侧</text>
  <text x="570" y="98" font-size="14" font-weight="bold" fill="#555">内网 / 目标侧</text>

  <rect x="30" y="150" width="200" height="100" rx="12" fill="#fee2e2" stroke="#c0392b" stroke-width="2.5"/>
  <text x="130" y="185" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">🖥️ ICMP 隧道服务端</text>
  <text x="130" y="210" font-size="13" text-anchor="middle" fill="#555">ptunnel / icmpsh</text>
  <text x="130" y="228" font-size="12" text-anchor="middle" fill="#555">接收 ICMP Echo Reply</text>

  <rect x="540" y="150" width="200" height="100" rx="12" fill="#dbeafe" stroke="#2980b9" stroke-width="2.5"/>
  <text x="640" y="185" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">🔑 内网 ICMP 客户端</text>
  <text x="640" y="210" font-size="13" text-anchor="middle" fill="#555">ptunnel / icmpsh</text>
  <text x="640" y="228" font-size="12" text-anchor="middle" fill="#555">发送 ICMP Echo Request</text>

  <rect x="790" y="150" width="180" height="100" rx="12" fill="#fef9c3" stroke="#b45309" stroke-width="2.5"/>
  <text x="880" y="185" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">🏛️ 内网主机</text>
  <text x="880" y="210" font-size="13" text-anchor="middle" fill="#555">已控 / 可 ping</text>
  <text x="880" y="228" font-size="12" text-anchor="middle" fill="#555">ICMP 通常不被防火墙拦截</text>

  <path d="M 230 200 L 530 200" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#arr-i1)"/>
  <text x="380" y="185" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">ICMP Echo Reply（携带隧道数据）</text>

  <path d="M 740 200 L 780 200" stroke="#2980b9" stroke-width="3" fill="none" marker-end="url(#arr-i1)"/>
  <text x="760" y="185" font-size="12" fill="#2980b9" text-anchor="middle">ICMP Echo Request</text>

  <path d="M 230 230 C 300 350, 450 370, 530 230" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-i1)"/>
  <text x="380" y="380" font-size="12" fill="#c0392b" text-anchor="middle">ICMP Echo Request（携带下行数据）</text>

  <rect x="30" y="310" width="1140" height="180" rx="10" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="340" font-size="16" font-weight="bold" fill="#111">ICMP 隧道原理</text>
  <text x="50" y="370" font-size="14" fill="#333">1. 数据编码：把需要传输的数据编码到 ICMP 包的 Data 字段中</text>
  <text x="50" y="392" font-size="14" fill="#333">2. 封装 ping：编码数据作为 ping 载荷（Echo Request/Reply）</text>
  <text x="50" y="414" font-size="14" fill="#333">3. 发送：客户端发 ping 请求（带数据），服务端回复（带数据）</text>
  <text x="50" y="436" font-size="14" fill="#333">4. 提取：双方从 ICMP 包中提取编码数据，还原原始数据</text>

  <text x="50" y="458" font-size="14" font-weight="bold" fill="#c0392b">为什么能绕过防火墙？</text>
  <text x="280" y="458" font-size="13" fill="#333">ICMP 协议是网络基础协议，绝大多数防火墙只检查是否丢包，不深度检测 ICMP 内容</text>
  <text x="280" y="478" font-size="13" fill="#555">正常 ping 流量和隧道流量在包大小、频率上有差异，但不是所有环境都会监控</text>
  <text x="50" y="498" font-size="14" font-weight="bold" fill="#b45309">局限性</text>
  <text x="200" y="498" font-size="13" fill="#555">速度极慢（受限于 ICMP 包大小）；防火墙限速/限速检测可发现异常流量模式</text>
</svg>
