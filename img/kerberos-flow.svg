<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr-k1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-k2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2980b9"/>
    </marker>
    <marker id="arr-k3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="#f8fafc" rx="10"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#111">Kerberos 认证流程与票据流</text>
  <text x="40" y="64" font-size="14" fill="#666">AS-REP（AS 回复）→ TGS（票据授予）→ 服务票据 → Kerberoasting / AS-REP Roasting 攻击点</text>

  <!-- 客户端 -->
  <rect x="30" y="150" width="180" height="90" rx="10" fill="#fee2e2" stroke="#c0392b" stroke-width="2"/>
  <text x="120" y="180" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">👤 客户端</text>
  <text x="120" y="205" font-size="13" text-anchor="middle" fill="#555">用户: jdoe</text>
  <text x="120" y="222" font-size="12" text-anchor="middle" fill="#555">密码哈希（明文→加密）</text>

  <!-- KDC AS -->
  <rect x="320" y="120" width="220" height="90" rx="10" fill="#dbeafe" stroke="#2980b9" stroke-width="2"/>
  <text x="430" y="150" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🏛️ KDC - AS</text>
  <text x="430" y="175" font-size="13" text-anchor="middle" fill="#555">认证服务（Authentication）</text>
  <text x="430" y="192" font-size="12" text-anchor="middle" fill="#555">验证用户身份 → 发 TGT</text>

  <!-- KDC TGS -->
  <rect x="320" y="250" width="220" height="90" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="430" y="280" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🏛️ KDC - TGS</text>
  <text x="430" y="305" font-size="13" text-anchor="middle" fill="#555">票据授予服务</text>
  <text x="430" y="322" font-size="12" text-anchor="middle" fill="#555">用 TGT 换取服务票据</text>

  <!-- 服务 -->
  <rect x="670" y="180" width="220" height="90" rx="10" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="780" y="210" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🖥️ 目标服务</text>
  <text x="780" y="235" font-size="13" text-anchor="middle" fill="#555">如 CIFS/HTTP/RDP</text>
  <text x="780" y="252" font-size="12" text-anchor="middle" fill="#555">验证服务票据</text>

  <!-- 攻击者 -->
  <rect x="950" y="290" width="200" height="100" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
  <text x="1050" y="320" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">🕵️ 攻击者</text>
  <text x="1050" y="345" font-size="13" text-anchor="middle" fill="#555">嗅探票据 / Kerberoasting</text>
  <text x="1050" y="362" font-size="12" text-anchor="middle" fill="#555">离线爆破 RC4 加密票据</text>

  <!-- 步骤1: AS-REP -->
  <path d="M 210 195 L 310 165" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr-k1)"/>
  <text x="260" y="170" font-size="11" fill="#c0392b" text-anchor="middle">1. AS-REQ（用户凭证）</text>

  <path d="M 310 145 L 210 175" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr-k1)"/>
  <text x="260" y="210" font-size="11" fill="#c0392b" text-anchor="middle">2. AS-REP（TGT + Session Key）</text>

  <!-- 步骤2: TGS -->
  <path d="M 430 210 L 430 245" stroke="#2980b9" stroke-width="2.5" fill="none" marker-end="url(#arr-k2)"/>
  <text x="460" y="230" font-size="11" fill="#2980b9">3. TGT 内部流转</text>

  <path d="M 210 200 C 250 300, 300 330, 320 290" stroke="#2980b9" stroke-width="2.5" fill="none" marker-end="url(#arr-k2)"/>
  <text x="240" y="320" font-size="11" fill="#2980b9" text-anchor="middle">3. TGS-REQ（TGT）</text>

  <path d="M 320 270 C 300 230, 250 210, 210 210" stroke="#2980b9" stroke-width="2.5" fill="none" marker-end="url(#arr-k2)"/>
  <text x="240" y="285" font-size="11" fill="#2980b9" text-anchor="middle">4. TGS-REP（服务票据）</text>

  <!-- 步骤3: 服务访问 -->
  <path d="M 210 200 C 300 380, 500 400, 660 220" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arr-k3)"/>
  <text x="450" y="400" font-size="11" fill="#27ae60" text-anchor="middle">5. 服务票据 → 访问服务</text>

  <!-- 攻击点 -->
  <path d="M 540 260 C 700 300, 850 340, 945 340" stroke="#ad1457" stroke-width="2.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-k1)"/>
  <text x="700" y="320" font-size="11" fill="#ad1457" text-anchor="middle" font-weight="bold">⚠️ Kerberoasting：截获服务票据，离线爆破</text>

  <path d="M 540 140 C 700 180, 850 260, 945 310" stroke="#ad1457" stroke-width="2.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-k1)"/>
  <text x="700" y="200" font-size="11" fill="#ad1457" text-anchor="middle" font-weight="bold">⚠️ AS-REP Roasting：无预认证账号，截获 AS-REP 离线爆破</text>

  <!-- 底部说明 -->
  <rect x="30" y="440" width="1140" height="100" rx="10" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="470" font-size="15" font-weight="bold" fill="#111">两种 Roasting 攻击的区别</text>
  <text x="50" y="495" font-size="13" fill="#c0392b" font-weight="bold">Kerberoasting：</text>
  <text x="240" y="495" font-size="13" fill="#333">用户有权限 → 请求 SPN 票据（TGS）→ 离线爆破 RC4 加密票据中的服务账号密码哈希</text>
  <text x="50" y="520" font-size="13" fill="#2980b9" font-weight="bold">AS-REP Roasting：</text>
  <text x="260" y="520" font-size="13" fill="#333">用户未启用"不预认证" → 直接请求 AS-REP → 离线爆破 AS-REP 中的用户密码哈希（无需密码/票据）</text>
  <text x="50" y="542" font-size="12" fill="#555">两者共性：不需要域管权限，不需要在线爆破（不会触发账户锁定），离线暴力破解即可</text>
</svg>
