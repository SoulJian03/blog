<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c53030"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">Spring4Shell CVE-2022-22965 攻击链</text>

  <rect x="40" y="60" width="150" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="115" y="93" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① 检测版本</text>
  <text x="115" y="108" font-size="9" text-anchor="middle" fill="#c53030">Spring Boot 2.6.x~2.6.3/2.5.x</text>

  <line x1="190" y1="85" x2="225" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="230" y="60" width="150" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="305" y="93" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② 构造 SSTI</text>
  <text x="305" y="108" font-size="9" text-anchor="middle" fill="#b7791f">class.module.classLoader</text>

  <line x1="380" y1="85" x2="415" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="420" y="60" width="150" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="495" y="93" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 反射加载类</text>
  <text x="495" y="108" font-size="9" text-anchor="middle" fill="#805ad5">Runtime.exec()</text>

  <line x1="570" y1="85" x2="605" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="610" y="60" width="150" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="685" y="93" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 写入 JSP</text>
  <text x="685" y="108" font-size="9" font-weight="bold" fill="#22543d">Tomcat ROOT/webapps</text>

  <line x1="760" y1="85" x2="795" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="800" y="60" width="160" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="880" y="93" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ 访问 JSP Getshell</text>

  <rect x="40" y="140" width="450" height="310" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="265" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">漏洞原理</text>
  <text x="70" y="195" font-size="10" font-weight="bold" fill="#c53030">CVE 编号</text>
  <text x="70" y="215" font-size="9" fill="#2d3748">CVE-2022-22965</text>
  <text x="70" y="240" font-size="10" font-weight="bold" fill="#c53030">CVSS 评分</text>
  <text x="70" y="260" font-size="9" fill="#2d3748">9.8（严重）· 远程 · 无需认证</text>
  <text x="70" y="285" font-size="10" font-weight="bold" fill="#c53030">影响版本</text>
  <text x="70" y="305" font-size="9" fill="#2d3748">Spring Boot: 2.6.0 ~ 2.6.3</text>
  <text x="70" y="325" font-size="9" fill="#2d3748">           2.5.0 ~ 2.5.6</text>
  <text x="70" y="350" font-size="10" font-weight="bold" fill="#c53030">攻击条件</text>
  <text x="70" y="370" font-size="9" fill="#2d3748">1. JDK 9+（反射限制解除）</text>
  <text x="70" y="390" font-size="9" fill="#2d3748">2. Tomcat 部署（写入 JSP 文件）</text>
  <text x="70" y="410" font-size="9" fill="#2d3748">3. 默认 SpEL 解析（无需配置）</text>
  <text x="70" y="430" font-size="10" font-weight="bold" fill="#805ad5">核心原因</text>
  <text x="70" y="445" font-size="9" fill="#2d3748">Spring MVC 请求处理流程中</text>
  <text x="70" y="465" font-size="9" fill="#2d3748">StandardServletMultipartResolver</text>
  <text x="70" y="475" font-size="9" fill="#2d3748">解析文件名时使用 SpEL 表达式</text>

  <rect x="510" y="140" width="460" height="310" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">修复方案</text>

  <text x="540" y="195" font-size="10" font-weight="bold" fill="#c53030">方案 1：升级 Spring Boot</text>
  <text x="540" y="215" font-size="9" fill="#2d3748">2.6.4+ / 2.5.7+</text>

  <text x="540" y="240" font-size="10" font-weight="bold" fill="#805ad5">方案 2：临时缓解</text>
  <text x="540" y="260" font-size="9" fill="#2d3748">设置 spring.mvc.ignoreDefaultModelOnRedirect=true</text>
  <text x="540" y="280" font-size="9" fill="#2d3748">或使用非 Tomcat 容器（Jetty/Undertow）</text>

  <text x="540" y="305" font-size="10" font-weight="bold" fill="#dd6b20">方案 3：禁用文件上传</text>
  <text x="540" y="325" font-size="9" fill="#2d3748">spring.servlet.multipart.enabled=false</text>

  <text x="540" y="350" font-size="10" font-weight="bold" fill="#3182ce">检测方法</text>
  <text x="540" y="370" font-size="9" fill="#2d3748">nuclei -t spring4shell.yaml</text>
  <text x="540" y="390" font-size="9" fill="#2d3748">java -jar spring4shell-checker.jar</text>

  <text x="540" y="415" font-size="10" font-weight="bold" fill="#38a169">防御加固</text>
  <text x="540" y="435" font-size="9" fill="#2d3748">1. 及时跟进 CVE 公告</text>
  <text x="540" y="455" font-size="9" fill="#2d3748">2. 使用 Dependabot 自动升级</text>
  <text x="540" y="470" font-size="9" fill="#2d3748">3. 定期组件漏洞扫描</text>
</svg>
