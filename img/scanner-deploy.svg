<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="380" fill="#f8fafc" rx="10"/>
  <text x="20" y="34" font-size="20" font-weight="bold" fill="#111">漏扫：扫描器 → 资产 → 修复闭环</text>

  <!-- 扫描器 -->
  <rect x="30" y="120" width="200" height="120" rx="10" fill="#dbeafe" stroke="#333" stroke-width="3"/>
  <text x="130" y="165" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">漏扫工具</text>
  <text x="130" y="192" font-size="13" text-anchor="middle" fill="#333">Nessus / OpenVAS</text>
  <text x="130" y="212" font-size="13" text-anchor="middle" fill="#333">nuclei / Xray / AWVS</text>
  <text x="130" y="230" font-size="12" text-anchor="middle" fill="#666">定时 / 发布触发</text>

  <!-- 资产 -->
  <rect x="340" y="60" width="160" height="90" rx="10" fill="#fee2e2" stroke="#333" stroke-width="2"/>
  <text x="420" y="102" font-size="16" text-anchor="middle" fill="#111">Web 服务器</text>
  <rect x="340" y="170" width="160" height="90" rx="10" fill="#fee2e2" stroke="#333" stroke-width="2"/>
  <text x="420" y="212" font-size="16" text-anchor="middle" fill="#111">主机 / 内网资产</text>

  <!-- 报告/工单 -->
  <rect x="620" y="120" width="230" height="120" rx="10" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="735" y="165" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">漏洞报告 → 工单</text>
  <text x="735" y="192" font-size="13" text-anchor="middle" fill="#666">按风险分级</text>
  <text x="735" y="212" font-size="13" text-anchor="middle" fill="#666">人工验证 + 修复闭环</text>

  <line x1="230" y1="180" x2="335" y2="145" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="230" y1="180" x2="335" y2="215" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="500" y1="180" x2="615" y2="180" stroke="#666" stroke-width="3" marker-end="url(#arr)"/>
  <text x="415" y="280" font-size="13" fill="#666" text-anchor="middle">扫描结果 → 高危必须人工验证（误报多）</text>
  <text x="30" y="340" font-size="13" fill="#666">流程：扫描 → 验证 → 分级 → 修复 → 复测 → 常态化（纳入发布流程/定期）</text>
</svg>
