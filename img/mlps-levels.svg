<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">等保2.0 五个等级</text>

  <rect x="30" y="60" width="940" height="60" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="150" y="95" font-size="13" text-anchor="middle" fill="#22543d" font-weight="bold">第一级：自主保护级</text>
  <text x="500" y="83" font-size="10" text-anchor="middle" fill="#2d3748">一般系统，不涉及国家安全/社会秩序</text>
  <text x="500" y="102" font-size="10" text-anchor="middle" fill="#2d3748">企业内网/小型网站 → 自主保护，无需测评</text>

  <rect x="30" y="135" width="940" height="60" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="150" y="170" font-size="13" text-anchor="middle" fill="#2a4365" font-weight="bold">第二级：指导保护级</text>
  <text x="500" y="158" font-size="10" text-anchor="middle" fill="#2d3748">一般系统，但涉及公民/法人权益</text>
  <text x="500" y="177" font-size="10" text-anchor="middle" fill="#2d3748">中小企业/一般行业网站 → 自评备案，无需正式测评</text>

  <rect x="30" y="210" width="940" height="60" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="150" y="245" font-size="13" text-anchor="middle" fill="#744210" font-weight="bold">第三级：监督保护级</text>
  <text x="500" y="233" font-size="10" text-anchor="middle" fill="#2d3748">涉及国家安全/社会秩序，如被破坏会严重损害</text>
  <text x="500" y="252" font-size="10" text-anchor="middle" fill="#2d3748">金融/政务/医疗/电商 → 必须每年测评 + 备案</text>

  <rect x="30" y="285" width="940" height="60" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="150" y="320" font-size="13" text-anchor="middle" fill="#c53030" font-weight="bold">第四级：强制保护级</text>
  <text x="500" y="308" font-size="10" text-anchor="middle" fill="#2d3748">国家重要领域，被破坏会特别严重损害</text>
  <text x="500" y="327" font-size="10" text-anchor="middle" fill="#2d3748">电力/电信/航空/国防 → 每半年测评 + 国家审查</text>

  <rect x="30" y="360" width="940" height="60" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="150" y="395" font-size="13" text-anchor="middle" fill="#44337a" font-weight="bold">第五级：专控保护级</text>
  <text x="500" y="383" font-size="10" text-anchor="middle" fill="#2d3748">最高级别，涉及国家核心基础设施</text>
  <text x="500" y="402" font-size="10" text-anchor="middle" fill="#2d3748">国防关键系统 → 国家专项管控，极少使用</text>

  <rect x="30" y="440" width="940" height="30" rx="6" fill="#fed7d7" stroke="#c53030" stroke-width="1"/>
  <text x="500" y="460" font-size="11" text-anchor="middle" fill="#742a2a">⚠ 绝大多数企业网站/系统是第二级或第三级；金融/政务系统通常要求第三级</text>
</svg>
