<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">lsof 网络与进程分析</text>

  <rect x="40" y="70" width="130" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="105" y="92" font-size="10" text-anchor="middle" fill="#c53030" font-weight="bold">查看端口</text>
  <text x="105" y="108" font-size="9" text-anchor="middle" fill="#c53030">lsof -i</text>

  <rect x="185" y="70" width="130" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="250" y="92" font-size="10" text-anchor="middle" fill="#b7791f" font-weight="bold">查看进程</text>
  <text x="250" y="108" font-size="9" text-anchor="middle" fill="#b7791f">lsof -p PID</text>

  <rect x="330" y="70" width="130" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="395" y="92" font-size="10" text-anchor="middle" fill="#805ad5" font-weight="bold">查看文件</text>
  <text x="395" y="108" font-size="9" text-anchor="middle" fill="#805ad5">lsof file</text>

  <rect x="475" y="70" width="130" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="540" y="92" font-size="10" text-anchor="middle" fill="#38a169" font-weight="bold">查看用户</text>
  <text x="540" y="108" font-size="9" text-anchor="middle" fill="#38a169">lsof -u user</text>

  <rect x="620" y="70" width="130" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="685" y="92" font-size="10" text-anchor="middle" fill="#3182ce" font-weight="bold">查看协议</text>
  <text x="685" y="108" font-size="9" text-anchor="middle" fill="#3182ce">lsof -i TCP</text>

  <rect x="765" y="70" width="130" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="830" y="92" font-size="10" text-anchor="middle" fill="#276749" font-weight="bold">查看端口号</text>
  <text x="830" y="108" font-size="9" text-anchor="middle" fill="#276749">lsof -i :80</text>

  <rect x="40" y="145" width="460" height="310" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="170" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">lsof 实战命令</text>

  <text x="70" y="200" font-size="10" font-weight="bold" fill="#c53030">查看端口占用：</text>
  <text x="70" y="220" font-size="9" fill="#2d3748">lsof -i :80</text>
  <text x="70" y="240" font-size="9" fill="#2d3748">lsof -i :80 -n</text>
  <text x="70" y="260" font-size="9" fill="#2d3748">lsof -i TCP:80</text>

  <text x="70" y="290" font-size="10" font-weight="bold" fill="#805ad5">查看所有网络连接：</text>
  <text x="70" y="310" font-size="9" fill="#2d3748">lsof -i</text>
  <text x="70" y="330" font-size="9" fill="#2d3748">lsof -i -P -n</text>

  <text x="70" y="360" font-size="10" font-weight="bold" fill="#dd6b20">查看进程打开文件：</text>
  <text x="70" y="380" font-size="9" fill="#2d3748">lsof -p 1234</text>
  <text x="70" y="400" font-size="9" fill="#2d3748">lsof -p 1234 | grep cwd</text>

  <text x="70" y="430" font-size="10" font-weight="bold" fill="#3182ce">查看用户进程：</text>
  <text x="70" y="450" font-size="9" fill="#2d3748">lsof -u root</text>

  <text x="70" y="475" font-size="10" font-weight="bold" fill="#38a169">查看监听端口：</text>
  <text x="70" y="475" font-size="9" fill="#2d3748">lsof -i -sTCP:LISTEN</text>

  <rect x="520" y="145" width="440" height="310" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="170" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">应急响应场景</text>

  <text x="550" y="200" font-size="10" font-weight="bold" fill="#c53030">查找后门端口：</text>
  <text x="550" y="220" font-size="9" fill="#2d3748">lsof -i -P -n | grep LISTEN</text>

  <text x="550" y="250" font-size="10" font-weight="bold" fill="#805ad5">查找异常连接：</text>
  <text x="550" y="270" font-size="9" fill="#2d3748">lsof -i -P -n | grep ESTABLISHED</text>

  <text x="550" y="300" font-size="10" font-weight="bold" fill="#dd6b20">查找被删除文件：</text>
  <text x="550" y="320" font-size="9" fill="#2d3748">lsof | grep deleted</text>
  <text x="550" y="340" font-size="9" fill="#2d3748">（被删除但仍被进程占用）</text>

  <text x="550" y="370" font-size="10" font-weight="bold" fill="#3182ce">查找异常进程：</text>
  <text x="550" y="390" font-size="9" fill="#2d3748">lsof -i | grep -v root | grep root</text>

  <text x="550" y="420" font-size="10" font-weight="bold" fill="#38a169">强制关闭端口：</text>
  <text x="550" y="440" font-size="9" fill="#2d3748">kill -9 PID</text>
  <text x="550" y="460" font-size="9" fill="#2d3748">注意：先确认不是系统进程</text>
</svg>
