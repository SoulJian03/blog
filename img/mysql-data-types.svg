<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="460" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">MySQL 数据类型速查</text>

  <rect x="40" y="60" width="280" height="360" rx="12" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="180" y="85" font-size="13" text-anchor="middle" fill="#c53030" font-weight="bold">数值类型</text>

  <text x="70" y="115" font-size="10" font-weight="bold" fill="#c53030">整数：</text>
  <text x="70" y="133" font-size="9" fill="#2d3748">TINYINT(1字节) · SMALLINT(2)</text>
  <text x="70" y="151" font-size="9" fill="#2d3748">MEDIUMINT(3) · INT(4) · BIGINT(8)</text>

  <text x="70" y="175" font-size="10" font-weight="bold" fill="#c53030">浮点数：</text>
  <text x="70" y="193" font-size="9" fill="#2d3748">FLOAT(4字节, 单精度)</text>
  <text x="70" y="211" font-size="9" fill="#2d3748">DOUBLE(8字节, 双精度)</text>

  <text x="70" y="235" font-size="10" font-weight="bold" fill="#c53030">精确小数：</text>
  <text x="70" y="253" font-size="9" fill="#2d3748">DECIMAL(M,D) · 定点数</text>
  <text x="70" y="271" font-size="9" fill="#2d3748">金融计算必须用 DECIMAL</text>

  <text x="70" y="295" font-size="10" font-weight="bold" fill="#c53030">UNSIGNED：</text>
  <text x="70" y="313" font-size="9" fill="#2d3748">无符号 · 范围扩大 2 倍</text>
  <text x="70" y="331" font-size="9" fill="#2d3748">INT UNSIGNED: 0~4294967295</text>

  <text x="70" y="355" font-size="10" font-weight="bold" fill="#c53030">选择建议：</text>
  <text x="70" y="373" font-size="9" fill="#2d3748">用最小能容纳的类型</text>
  <text x="70" y="391" font-size="9" fill="#2d3748">节省存储空间 + 提高性能</text>

  <rect x="340" y="60" width="300" height="360" rx="12" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="490" y="85" font-size="13" text-anchor="middle" fill="#b7791f" font-weight="bold">字符串类型</text>

  <text x="370" y="115" font-size="10" font-weight="bold" fill="#b7791f">CHAR(M)：</text>
  <text x="370" y="133" font-size="9" fill="#2d3748">定长 · 自动补空格</text>
  <text x="370" y="151" font-size="9" fill="#2d3748">适合短定长数据（MD5/状态）</text>
  <text x="370" y="169" font-size="9" fill="#2d3748">CHAR(10) 永远占 10 字符</text>

  <text x="370" y="193" font-size="10" font-weight="bold" fill="#b7791f">VARCHAR(M)：</text>
  <text x="370" y="211" font-size="9" fill="#2d3748">变长 · 按实际长度存储</text>
  <text x="370" y="229" font-size="9" fill="#2d3748">适合可变长度数据</text>
  <text x="370" y="247" font-size="9" fill="#2d3748">VARCHAR(255) 推荐上限</text>

  <text x="370" y="271" font-size="10" font-weight="bold" fill="#b7791f">TEXT/BLOB：</text>
  <text x="370" y="289" font-size="9" fill="#2d3748">TEXT: 长文本 (64KB)</text>
  <text x="370" y="307" font-size="9" fill="#2d3748">MEDIUMTEXT: 16MB</text>
  <text x="370" y="325" font-size="9" fill="#2d3748">LONGTEXT: 4GB</text>
  <text x="370" y="343" font-size="9" fill="#2d3748">BLOB: 二进制数据</text>

  <text x="370" y="367" font-size="10" font-weight="bold" fill="#b7791f">ENUM/SET：</text>
  <text x="370" y="385" font-size="9" fill="#2d3748">枚举类型 · 有限选项</text>
  <text x="370" y="403" font-size="9" fill="#2d3748">ENUM('男','女') · SET 多选</text>

  <rect x="660" y="60" width="300" height="360" rx="12" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="810" y="85" font-size="13" text-anchor="middle" fill="#805ad5" font-weight="bold">日期时间类型</text>

  <text x="690" y="115" font-size="10" font-weight="bold" fill="#805ad5">DATE：</text>
  <text x="690" y="133" font-size="9" fill="#2d3748">格式: YYYY-MM-DD</text>
  <text x="690" y="151" font-size="9" fill="#2d3748">范围: 1000-01-01 ~ 9999-12-31</text>

  <text x="690" y="175" font-size="10" font-weight="bold" fill="#805ad5">DATETIME：</text>
  <text x="690" y="193" font-size="9" fill="#2d3748">格式: YYYY-MM-DD HH:MM:SS</text>
  <text x="690" y="211" font-size="9" fill="#2d3748">存储: 8 字节 · 与时区无关</text>

  <text x="690" y="235" font-size="10" font-weight="bold" fill="#805ad5">TIMESTAMP：</text>
  <text x="690" y="253" font-size="9" fill="#2d3748">格式: YYYY-MM-DD HH:MM:SS</text>
  <text x="690" y="271" font-size="9" fill="#2d3748">存储: 4 字节 · 与时区相关</text>
  <text x="690" y="289" font-size="9" fill="#2d3748">自动更新（ON UPDATE CURRENT_TIMESTAMP）</text>

  <text x="690" y="313" font-size="10" font-weight="bold" fill="#805ad5">TIME：</text>
  <text x="690" y="331" font-size="9" fill="#2d3748">格式: HH:MM:SS</text>

  <text x="690" y="355" font-size="10" font-weight="bold" fill="#805ad5">选择建议：</text>
  <text x="690" y="373" font-size="9" fill="#2d3748">存储时间 → DATETIME</text>
  <text x="690" y="391" font-size="9" fill="#2d3748">自动记录 → TIMESTAMP</text>
</svg>
