<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="460" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c53030"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">ThinkPHP RCE 漏洞链（5.x）</text>

  <rect x="40" y="60" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="92" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① GET/POST 参数</text>
  <text x="110" y="108" font-size="9" text-anchor="middle" fill="#c53030">s=模块/控制器/方法</text>

  <line x1="180" y1="85" x2="215" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="220" y="60" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="290" y="92" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② Request 解析</text>
  <text x="290" y="108" font-size="9" text-anchor="middle" fill="#b7791f">stripTags→filter</text>

  <line x1="360" y1="85" x2="395" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="400" y="60" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="470" y="92" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 变量覆盖</text>
  <text x="470" y="108" font-size="9" text-anchor="middle" fill="#805ad5">method=filter</text>

  <line x1="540" y1="85" x2="575" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="580" y="60" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="650" y="92" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 反射调用</text>
  <text x="650" y="108" font-size="9" text-anchor="middle" fill="#38a169">filter函数名</text>

  <line x1="720" y1="85" x2="755" y2="85" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="760" y="60" width="200" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="860" y="92" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ RCE 系统命令执行</text>

  <rect x="40" y="140" width="450" height="280" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="265" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">漏洞原理（CVE-2018-2894）</text>

  <text x="70" y="195" font-size="10" font-weight="bold" fill="#c53030">触发条件</text>
  <text x="70" y="215" font-size="9" fill="#2d3748">ThinkPHP 5.0.0 ~ 5.0.23</text>
  <text x="70" y="235" font-size="9" fill="#2d3748">ThinkPHP 5.1.0 ~ 5.1.31</text>

  <text x="70" y="260" font-size="10" font-weight="bold" fill="#805ad5">利用步骤</text>
  <text x="70" y="280" font-size="9" fill="#2d3748">第 1 步：构造 GET 参数</text>
  <text x="70" y="300" font-size="9" fill="#2d3748">  s=index/index/index&method=filter</text>
  <text x="70" y="320" font-size="9" fill="#2d3748">第 2 步：利用 filter 覆盖变量</text>
  <text x="70" y="340" font-size="9" fill="#2d3748">  构造 _method=__construct 传入 filter=system</text>
  <text x="70" y="360" font-size="9" fill="#2d3748">第 3 步：反射调用 system('id')</text>
  <text x="70" y="380" font-size="9" fill="#2d3748">  执行系统命令 → RCE</text>
  <text x="70" y="400" font-size="10" font-weight="bold" fill="#dd6b20">修复版本</text>
  <text x="70" y="420" font-size="9" fill="#2d3748">ThinkPHP 5.0.24+ / 5.1.31+</text>
  <text x="70" y="440" font-size="9" fill="#2d3748">或升级至 ThinkPHP 6.x</text>

  <rect x="510" y="140" width="460" height="280" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">修复方案</text>

  <text x="540" y="195" font-size="10" font-weight="bold" fill="#c53030">1. 升级框架版本</text>
  <text x="540" y="215" font-size="9" fill="#2d3748">composer update topthink/framework</text>

  <text x="540" y="240" font-size="10" font-weight="bold" fill="#805ad5">2. 手动修复</text>
  <text x="540" y="260" font-size="9" fill="#2d3748">ThinkPHP/library/think/Request.php</text>
  <text x="540" y="280" font-size="9" fill="#2d3748">删除 filter 变量覆盖逻辑</text>

  <text x="540" y="305" font-size="10" font-weight="bold" fill="#dd6b20">3. 临时缓解</text>
  <text x="540" y="325" font-size="9" fill="#2d3748">禁用 GET 参数传法名</text>
  <text x="540" y="345" font-size="9" fill="#2d3748">Nginx 规则限制路径参数</text>

  <text x="540" y="370" font-size="10" font-weight="bold" fill="#3182ce">防御加固</text>
  <text x="540" y="390" font-size="9" fill="#2d3748">1. 定期升级框架 + 依赖</text>
  <text x="540" y="410" font-size="9" fill="#2d3748">2. 开启 debug=false</text>
  <text x="540" y="430" font-size="9" fill="#2d3748">3. 限制 URL 参数格式</text>
</svg>
