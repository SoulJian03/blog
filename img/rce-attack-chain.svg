<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c53030"/>
    </marker>
  </defs>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">RCE / 代码执行攻击链</text>

  <rect x="50" y="70" width="130" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="115" y="102" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① 框架漏洞</text>

  <line x1="180" y1="95" x2="215" y2="95" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="220" y="70" width="130" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="285" y="102" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② 反序列化</text>

  <line x1="350" y1="95" x2="385" y2="95" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="390" y="70" width="130" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="455" y="102" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 模板引擎</text>

  <line x1="520" y1="95" x2="555" y2="95" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="560" y="70" width="130" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="625" y="102" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 动态执行</text>

  <line x1="690" y1="95" x2="725" y2="95" stroke="#c53030" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="730" y="70" width="200" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="830" y="102" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ Getshell / 反弹 / 提权</text>

  <rect x="40" y="150" width="450" height="290" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="265" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">RCE 触发点分类</text>

  <rect x="70" y="195" width="160" height="70" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.5"/>
  <text x="150" y="218" font-size="10" text-anchor="middle" fill="#c53030" font-weight="bold">代码执行</text>
  <text x="90" y="240" font-size="9" fill="#2d3748">eval()/exec()</text>
  <text x="90" y="258" font-size="9" fill="#2d3748">PHP: eval($_POST['x'])</text>

  <rect x="250" y="195" width="200" height="70" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="1.5"/>
  <text x="350" y="218" font-size="10" text-anchor="middle" fill="#b7791f" font-weight="bold">命令执行</text>
  <text x="270" y="240" font-size="9" fill="#2d3748">system()/Runtime.exec()</text>
  <text x="270" y="258" font-size="9" fill="#2d3748">底层 OS 命令</text>

  <rect x="70" y="285" width="160" height="70" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="1.5"/>
  <text x="150" y="308" font-size="10" text-anchor="middle" fill="#805ad5" font-weight="bold">模板注入</text>
  <text x="90" y="330" font-size="9" fill="#2d3748">SSTI (Thymeleaf/Freemarker)</text>
  <text x="90" y="348" font-size="9" fill="#2d3748">Java: #{T(Runtime).getRuntime()}</text>

  <rect x="250" y="285" width="200" height="70" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5"/>
  <text x="350" y="308" font-size="10" text-anchor="middle" fill="#38a169" font-weight="bold">反序列化 RCE</text>
  <text x="270" y="330" font-size="9" fill="#2d3748">Java: ysoserial</text>
  <text x="270" y="348" font-size="9" fill="#2d3748">PHP: php-serialize</text>

  <rect x="70" y="375" width="380" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="1.5"/>
  <text x="260" y="400" font-size="10" text-anchor="middle" fill="#2a4365" font-weight="bold">沙箱逃逸 / 表达式注入 (SpEL/JEXL/OGNL)</text>

  <rect x="510" y="150" width="450" height="290" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="735" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">防御措施</text>

  <text x="540" y="205" font-size="10" font-weight="bold" fill="#c53030">1. 框架及时升级</text>
  <text x="540" y="225" font-size="9" fill="#2d3748">Spring/Shiro/Fastjson 等</text>
  <text x="540" y="245" font-size="9" fill="#2d3748">关注 CVE + 安全公告</text>

  <text x="540" y="270" font-size="10" font-weight="bold" fill="#805ad5">2. 禁止动态代码执行</text>
  <text x="540" y="290" font-size="9" fill="#2d3748">关闭 eval() / ScriptEngine</text>
  <text x="540" y="310" font-size="9" fill="#2d3748">使用沙箱 (Rhino GraalJS)</text>

  <text x="540" y="335" font-size="10" font-weight="bold" fill="#dd6b20">3. 反序列化控制</text>
  <text x="540" y="355" font-size="9" fill="#2d3748">实现 Serializable 白名单</text>
  <text x="540" y="375" font-size="9" fill="#2d3748">Gson/Jackson 替代 JDK</text>

  <text x="540" y="400" font-size="10" font-weight="bold" fill="#3182ce">4. 模板引擎安全</text>
  <text x="540" y="420" font-size="9" fill="#2d3748">Freemarker: disable template inheritance</text>
  <text x="540" y="435" font-size="9" fill="#2d3748">Thymeleaf: sandbox mode</text>
</svg>
