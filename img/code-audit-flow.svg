<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">代码审计基础：OWASP Top 10 审计流程</text>

  <rect x="40" y="70" width="140" height="50" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="110" y="102" font-size="11" text-anchor="middle" fill="#c53030" font-weight="bold">① 环境搭建</text>

  <rect x="200" y="70" width="140" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="270" y="102" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="bold">② 信息收集</text>

  <rect x="360" y="70" width="140" height="50" rx="8" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="430" y="102" font-size="11" text-anchor="middle" fill="#805ad5" font-weight="bold">③ 静态分析</text>

  <rect x="520" y="70" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="590" y="102" font-size="11" text-anchor="middle" fill="#38a169" font-weight="bold">④ 动态验证</text>

  <rect x="680" y="70" width="140" height="50" rx="8" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="750" y="102" font-size="11" text-anchor="middle" fill="#3182ce" font-weight="bold">⑤ 编写报告</text>

  <rect x="840" y="70" width="120" height="50" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="900" y="102" font-size="11" text-anchor="middle" fill="#276749" font-weight="bold">⑥ 修复验证</text>

  <rect x="40" y="150" width="460" height="300" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="270" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#822727">审计工具链</text>

  <text x="70" y="205" font-size="10" font-weight="bold" fill="#c53030">IDE 插件：</text>
  <text x="70" y="225" font-size="9" fill="#2d3748">SonarQube · FindBugs · PMD</text>
  <text x="70" y="245" font-size="9" fill="#2d3748">Fortify · Checkmarx</text>

  <text x="70" y="275" font-size="10" font-weight="bold" fill="#805ad5">代码扫描：</text>
  <text x="70" y="295" font-size="9" fill="#2d3748">grep -rn "eval\|exec\|system" src/</text>
  <text x="70" y="315" font-size="9" fill="#2d3748">grep -rn "SELECT.*FROM" src/</text>

  <text x="70" y="345" font-size="10" font-weight="bold" fill="#dd6b20">审计重点：</text>
  <text x="70" y="365" font-size="9" fill="#2d3748">输入验证 · 权限控制 · 加密使用</text>
  <text x="70" y="385" font-size="9" fill="#2d3748">错误处理 · 日志记录 · 会话管理</text>

  <text x="70" y="415" font-size="10" font-weight="bold" fill="#3182ce">报告格式：</text>
  <text x="70" y="435" font-size="9" fill="#2d3748">漏洞位置 · 代码片段 · 风险等级 · 修复建议</text>

  <rect x="520" y="150" width="440" height="300" rx="12" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
  <text x="740" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">OWASP Top 10 审计清单</text>

  <text x="550" y="205" font-size="10" font-weight="bold" fill="#c53030">A01 访问控制：</text>
  <text x="550" y="225" font-size="9" fill="#2d3748">检查鉴权中间件 · 权限校验逻辑</text>

  <text x="550" y="255" font-size="10" font-weight="bold" fill="#805ad5">A02 加密机制：</text>
  <text x="550" y="275" font-size="9" fill="#2d3748">检查 HTTPS · 密码加密 · 敏感数据</text>

  <text x="550" y="305" font-size="10" font-weight="bold" fill="#dd6b20">A03 注入：</text>
  <text x="550" y="325" font-size="9" fill="#2d3748">检查 SQL 拼接 · 命令拼接 · XSS</text>

  <text x="550" y="355" font-size="10" font-weight="bold" fill="#3182ce">A05 配置错误：</text>
  <text x="550" y="375" font-size="9" fill="#2d3748">检查调试模式 · 默认配置</text>

  <text x="550" y="405" font-size="10" font-weight="bold" fill="#38a169">A06 易受攻击组件：</text>
  <text x="550" y="425" font-size="9" fill="#2d3748">检查第三方依赖版本 · CVE 匹配</text>
  <text x="550" y="445" font-size="9" fill="#2d3748">npm audit / pip-audit</text>
</svg>
